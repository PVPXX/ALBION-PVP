/* Escribe el evento "pending" en Firebase y va avisando por `onStatus` a
   medida que cambia: 'waiting' (recién escrito, esperando al bot),
   'posted' (el bot ya lo publicó en Discord) o 'error'. Devuelve el
   eventId para poder después escuchar las anotaciones con
   watchEventSignups. */
function publishEventToDiscord({ title, when, notes, roster, channelId }, onStatus) {
  const db = getFirebaseDb();
  if (!db) {
    onStatus({ state: 'error', message: 'Firebase no está configurado en esta página (ver discord-bot/README.md).' });
    return null;
  }

  const eventId = genEventId();
  const payload = {
    status: 'pending',
    title,
    when: when || null,
    notes: notes || null,
    guildName: state.guildName || 'PVPX',
    channelId: channelId || null,
    createdAt: firebase.database.ServerValue.TIMESTAMP,
    roster: roster.map(s => {
      const g = invitationGearLine(s);
      return { role: s.role, weaponName: shortEsName(g.weapon.name), gearText: g.text };
    }),
  };

  const ref = db.ref('events/' + eventId);
  ref.set(payload)
    .then(() => {
      onStatus({ state: 'waiting', eventId });
      ref.on('value', (snap) => {
        const val = snap.val();
        if (!val) return;
        if (val.status === 'posted') {
          onStatus({ state: 'posted', eventId, messageId: val.messageId, channelId: val.channelId });
        } else if (val.status === 'error') {
          onStatus({ state: 'error', message: val.error || 'El bot no pudo publicar el evento — revisá que esté corriendo.' });
        }
      });
    })
    .catch((err) => {
      onStatus({ state: 'error', message: err.message || String(err) });
    });

  return eventId;
}

/* Escucha en vivo quién se anotó a cada rol de un evento ya publicado.
   Devuelve una función para dejar de escuchar (se llama al cerrar el
   modal, para no dejar listeners de Firebase colgados). */
function watchEventSignups(eventId, onSignups) {
  const db = getFirebaseDb();
  if (!db) return () => {};
  const ref = db.ref('events/' + eventId + '/signups');
  const handler = (snap) => onSignups(snap.val() || {});
  ref.on('value', handler);
  return () => ref.off('value', handler);
}

/* Carga un ícono de Render Service en modo CORS-anónimo para poder dibujarlo
   en canvas sin "mancharlo" (lo que impediría exportar la imagen después).
   Si el ícono no carga (falla de red, CORS, nombre no exacto) o tarda más
   de 6s, resuelve null y quien dibuja usa un emoji de respaldo — la
   invitación nunca queda rota por un ícono puntual. */
function loadOneImg(src, timeoutMs) {
  return new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    let done = false;
    const finish = (result) => { if (!done) { done = true; resolve(result); } };
    img.onload = () => finish(img);
    img.onerror = () => finish(null);
    img.src = src;
    setTimeout(() => finish(null), timeoutMs);
  });
}
function loadIconImg(suffix) {
  const url = iconUrl(suffix);
  if (!url) return Promise.resolve(null);
  return loadOneImg(url, 6000).then(img => {
    if (img) return img;
    // El pedido directo en modo CORS puede fallar si el Render Service de
    // Albion no manda encabezados CORS en ese momento (el ícono se ve bien
    // como <img> normal en el resto de la herramienta, pero un canvas
    // necesita CORS para poder exportarse después) — se reintenta una vez
    // a través de un proxy de imágenes público que sí los agrega, para no
    // perder el ícono real. Si esto también falla, se usa el emoji de
    // respaldo — la invitación nunca se rompe por esto.
    const bare = url.replace(/^https?:\/\//, '');
    const proxied = `https://images.weserv.nl/?url=${encodeURIComponent(bare)}`;
    return loadOneImg(proxied, 6000);
  });
}
async function loadIconCache(suffixes) {
  const unique = [...new Set(suffixes.filter(Boolean))];
  const cache = new Map();
  await Promise.all(unique.map(async (suffix) => { cache.set(suffix, await loadIconImg(suffix)); }));
  return cache;
}

function drawRoundRect(ctx, x, y, w, h, r) {
  if (typeof r === 'number') r = { tl: r, tr: r, br: r, bl: r };
  ctx.beginPath();
  ctx.moveTo(x + r.tl, y);
  ctx.lineTo(x + w - r.tr, y);
  ctx.arcTo(x + w, y, x + w, y + r.tr, r.tr);
  ctx.lineTo(x + w, y + h - r.br);
  ctx.arcTo(x + w, y + h, x + w - r.br, y + h, r.br);
  ctx.lineTo(x + r.bl, y + h);
  ctx.arcTo(x, y + h, x, y + h - r.bl, r.bl);
  ctx.lineTo(x + r.tl, y);
  ctx.arcTo(x, y, x + r.tl, y, r.tl);
  ctx.closePath();
}

function wrapCanvasText(ctx, text, maxWidth) {
  const words = String(text || '').split(' ');
  const lines = [];
  let cur = '';
  words.forEach(word => {
    const test = cur ? cur + ' ' + word : word;
    if (cur && ctx.measureText(test).width > maxWidth) {
      lines.push(cur);
      cur = word;
    } else {
      cur = test;
    }
  });
  if (cur) lines.push(cur);
  return lines;
}

/* Arma la imagen PNG completa de la invitación. Es async porque primero
   espera a que carguen las tipografías (Cinzel/Rajdhani, ya usadas en el
   resto de la herramienta) y todos los íconos de equipo en paralelo, para
   poder calcular alturas exactas antes de dibujar nada. */
async function buildInvitationCanvas({ title, when, notes, roster, label }) {
  try {
    if (document.fonts && document.fonts.load) {
      await Promise.all([
        document.fonts.load('900 34px Cinzel'),
        document.fonts.load('700 21px Cinzel'),
        document.fonts.load('700 22px Cinzel'),
        document.fonts.load('600 15px Rajdhani'),
        document.fonts.load('600 18px Rajdhani'),
        document.fonts.load('600 15.5px Rajdhani'),
        document.fonts.load('700 14.5px Rajdhani'),
        document.fonts.load('700 16px Rajdhani'),
        document.fonts.load('700 10px Rajdhani'),
        document.fonts.load('italic 500 13.5px Rajdhani'),
      ]);
    }
  } catch (err) { /* si no cargan las fuentes, seguimos con las del sistema */ }

  const gearLines = roster.map(invitationGearLine);
  const neededSuffixes = [];
  gearLines.forEach(g => {
    if (g.weapon.u) neededSuffixes.push(g.weapon.u);
    if (g.helm) neededSuffixes.push(g.helm[1]);
    if (g.chest) neededSuffixes.push(g.chest[1]);
    if (g.boots) neededSuffixes.push(g.boots[1]);
    if (g.cape) neededSuffixes.push(g.cape[1]);
    if (g.food) neededSuffixes.push(g.food[1]);
    if (g.potion) neededSuffixes.push(g.potion[1]);
  });
  const iconCache = await loadIconCache(neededSuffixes);

  const SCALE = 2;
  const W = 900;
  const PAD = 34;
  const subtitle = when;

  // Medimos primero en un canvas descartable para calcular alturas exactas
  // (el título puede ocupar 1 o 2 líneas según cuánto escriba cada usuario).
  const mctx = document.createElement('canvas').getContext('2d');
  mctx.font = "900 34px Cinzel, serif";
  const titleLines = wrapCanvasText(mctx, title, W - PAD * 2).slice(0, 2);
  // Replica exactamente los mismos incrementos que el dibujo real más abajo,
  // así el alto reservado siempre alcanza sin importar cuántas líneas ocupe
  // el título ni si hay subtítulo (evita que el renglón de abajo se pise).
  let headerContentBottom = 82 + titleLines.length * 40;
  if (subtitle) headerContentBottom += 26;
  const headerH = headerContentBottom + 44; // espacio para el renglón "X jugadores requeridos" + padding

  mctx.font = "italic 500 13.5px Rajdhani, sans-serif";
  const noteLines = notes ? wrapCanvasText(mctx, `📌 ${notes}`, W - PAD * 2) : [];
  const notesBlockH = noteLines.length ? noteLines.length * 19 + 14 : 0;

  // Roster: una tarjeta grande y completa por jugador (rol + arma arriba,
  // el equipo entero con íconos grandes + etiqueta abajo) en una sola
  // columna — reemplaza los dos bloques que había antes (lista de texto
  // chica + grilla de íconos chicos separada) por uno solo, más claro y
  // con todo más grande. Las constantes de acá tienen que coincidir
  // exactamente con los incrementos que usa el dibujo real más abajo,
  // igual que se hace con el título arriba, para que el alto reservado
  // siempre alcance.
  const CARD_ICON = 68;
  const CARD_ICON_GAP = 16;
  const CARD_PAD_X = 22;
  const CARD_PAD_TOP = 18;
  const CARD_HEAD_H = 30;
  const CARD_HEAD_GAP = 16;
  const CARD_ICON_LABEL_H = 16;
  const CARD_PAD_BOTTOM = 16;
  const PIECE_LABELS = ['ARMA', 'CASCO', 'PECHO', 'CAPA', 'BOTAS', 'COMIDA', 'POCIÓN'];
  const cardW = W - PAD * 2;
  const cardH = CARD_PAD_TOP + CARD_HEAD_H + CARD_HEAD_GAP + CARD_ICON + CARD_ICON_LABEL_H + CARD_PAD_BOTTOM;
  const cardGap = 14;
  const rows = roster.length;
  // 41 = espacio fijo entre el título de sección y el inicio de las tarjetas
  // (título + separador), igual que se dibuja más abajo.
  const rosterSectionH = 41 + notesBlockH + rows * (cardH + cardGap) + 12;

  const footerH = 100;
  const H = headerH + 30 + rosterSectionH + footerH + PAD;

  const canvas = document.createElement('canvas');
  canvas.width = Math.round(W * SCALE);
  canvas.height = Math.round(H * SCALE);
  const ctx = canvas.getContext('2d');
  ctx.scale(SCALE, SCALE);

  // Fondo general
  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, '#161616');
  bgGrad.addColorStop(1, '#0c0c0c');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#c8102e';
  ctx.lineWidth = 3;
  drawRoundRect(ctx, 3, 3, W - 6, H - 6, 14);
  ctx.stroke();

  // ---- Header banner ----
  const headerGrad = ctx.createLinearGradient(0, 0, W, 0);
  headerGrad.addColorStop(0, '#c8102e');
  headerGrad.addColorStop(1, '#7a0a1e');
  ctx.fillStyle = headerGrad;
  drawRoundRect(ctx, 0, 0, W, headerH, { tl: 12, tr: 12, br: 0, bl: 0 });
  ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.font = "600 15px Rajdhani, sans-serif";
  ctx.fillText(`⚔ ${state.guildName || 'PVPX'} · ${label}`, PAD, 40);

  ctx.fillStyle = '#ffffff';
  ctx.font = "900 34px Cinzel, serif";
  let ty = 82;
  titleLines.forEach(line => { ctx.fillText(line, PAD, ty); ty += 40; });

  if (subtitle) {
    ctx.fillStyle = 'rgba(255,255,255,.92)';
    ctx.font = "600 18px Rajdhani, sans-serif";
    ctx.fillText(`🗓️ ${subtitle}`, PAD, ty - 4);
    ty += 26;
  }

  ctx.fillStyle = 'rgba(255,255,255,.75)';
  ctx.font = "600 15px Rajdhani, sans-serif";
  ctx.fillText(`👥 ${roster.length} jugador${roster.length === 1 ? '' : 'es'} requeridos`, PAD, headerH - 18);

  let y = headerH + 30;
  // ---- Roster: una tarjeta grande por jugador con rol + arma arriba y el
  //      equipo completo abajo (íconos reales grandes, con emoji de
  //      respaldo si el ícono real no carga, y una etiqueta debajo de cada
  //      uno para que se entienda de un vistazo qué pieza es cada casilla) ----
  ctx.fillStyle = '#ff2d43';
  ctx.font = "700 21px Cinzel, serif";
  ctx.fillText('COMPOSICIÓN REQUERIDA', PAD, y);
  y += 13;
  ctx.strokeStyle = '#2a2a2a';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(PAD, y + 6); ctx.lineTo(W - PAD, y + 6); ctx.stroke();
  y += 28;

  if (noteLines.length) {
    ctx.fillStyle = '#b7b7b7';
    ctx.font = "italic 500 13.5px Rajdhani, sans-serif";
    noteLines.forEach(l => { ctx.fillText(l, PAD, y); y += 19; });
    y += 14;
  }

  const gridTop = y;

  gearLines.forEach((g, i) => {
    const cy = gridTop + i * (cardH + cardGap);
    const accent = ROLE_ACCENT[roster[i].role] || '#c8102e';

    // Fondo + borde + cinta de color de la tarjeta
    ctx.fillStyle = '#161616';
    drawRoundRect(ctx, PAD, cy, cardW, cardH, 12);
    ctx.fill();
    ctx.strokeStyle = accent;
    ctx.lineWidth = 1.5;
    drawRoundRect(ctx, PAD, cy, cardW, cardH, 12);
    ctx.stroke();
    ctx.fillStyle = accent;
    drawRoundRect(ctx, PAD, cy, 6, cardH, { tl: 12, bl: 12, tr: 0, br: 0 });
    ctx.fill();

    const innerX = PAD + CARD_PAD_X;

    // Pastilla de color con el rol (mismo estilo que el "role-badge" de la
    // página) + nombre del arma al lado, con todo el ancho de la tarjeta
    // disponible para que no se corte.
    ctx.font = "700 14.5px Rajdhani, sans-serif";
    const badgeLabel = `${g.def.icon} ${g.def.label}`;
    const badgeW = ctx.measureText(badgeLabel).width + 26;
    const badgeH = CARD_HEAD_H;
    const badgeY = cy + CARD_PAD_TOP;
    ctx.fillStyle = accent;
    drawRoundRect(ctx, innerX, badgeY, badgeW, badgeH, badgeH / 2);
    ctx.fill();
    ctx.fillStyle = '#0a0a0a';
    ctx.textBaseline = 'middle';
    ctx.fillText(badgeLabel, innerX + 13, badgeY + badgeH / 2 + 1);

    ctx.fillStyle = '#f7f7f7';
    ctx.font = "700 16px Rajdhani, sans-serif";
    const weaponLines = wrapCanvasText(ctx, shortEsName(g.weapon.name), cardW - CARD_PAD_X * 2 - badgeW - 18);
    ctx.fillText(weaponLines[0] || '', innerX + badgeW + 16, badgeY + badgeH / 2 + 1);
    ctx.textBaseline = 'alphabetic';

    // Fila de íconos grandes, con una etiqueta chica debajo de cada uno.
    const iconsY = badgeY + badgeH + CARD_HEAD_GAP;
    const pieces = [
      [g.weapon.u ? [g.weapon.name, g.weapon.u] : null, g.def.icon],
      [g.helm, '🪖'],
      [g.chest, '👕'],
      [g.cape, '🧣'],
      [g.boots, '👢'],
      [g.food, '🍖'],
      [g.potion, '🧪'],
    ];
    pieces.forEach(([piece, emoji], idx) => {
      const ix = innerX + idx * (CARD_ICON + CARD_ICON_GAP);
      ctx.fillStyle = '#0a0a0a';
      drawRoundRect(ctx, ix, iconsY, CARD_ICON, CARD_ICON, 10);
      ctx.fill();
      ctx.strokeStyle = accent;
      ctx.lineWidth = 1;
      drawRoundRect(ctx, ix, iconsY, CARD_ICON, CARD_ICON, 10);
      ctx.stroke();
      const img = piece ? iconCache.get(piece[1]) : null;
      if (img) {
        ctx.save();
        drawRoundRect(ctx, ix + 3, iconsY + 3, CARD_ICON - 6, CARD_ICON - 6, 8);
        ctx.clip();
        ctx.drawImage(img, ix + 3, iconsY + 3, CARD_ICON - 6, CARD_ICON - 6);
        ctx.restore();
      } else {
        // Algunos glifos (ej. "✚") no tienen presentación a color garantizada
        // y caen a un trazo monocromo que toma el fillStyle actual — si no
        // se resetea acá, hereda el negro de fondo de la casilla y queda
        // invisible. Por eso se fija un color claro explícito antes de
        // dibujarlo, sin importar qué carácter sea.
        ctx.fillStyle = '#f4f4f4';
        ctx.font = "34px sans-serif";
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(emoji, ix + CARD_ICON / 2, iconsY + CARD_ICON / 2 + 2);
        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
      }
      ctx.fillStyle = '#9a9a9a';
      ctx.font = "700 10px Rajdhani, sans-serif";
      ctx.textAlign = 'center';
      ctx.fillText(PIECE_LABELS[idx], ix + CARD_ICON / 2, iconsY + CARD_ICON + 13);
      ctx.textAlign = 'left';
    });
  });
  y = gridTop + rows * (cardH + cardGap) + 12;

  // ---- Footer / llamado a la acción ----
  const footerGrad = ctx.createLinearGradient(0, y, W, y);
  footerGrad.addColorStop(0, '#7a0a1e');
  footerGrad.addColorStop(1, '#c8102e');
  ctx.fillStyle = footerGrad;
  drawRoundRect(ctx, 0, y, W, H - y, { tl: 0, tr: 0, br: 12, bl: 12 });
  ctx.fill();

  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffffff';
  ctx.font = "700 22px Cinzel, serif";
  ctx.fillText('✅ ¡ANOTATE PARA PARTICIPAR!', W / 2, y + 44);
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  ctx.font = "600 15.5px Rajdhani, sans-serif";
  ctx.fillText('Respondé con tu rol y arma disponible para reservar tu lugar 👇', W / 2, y + 72);
  ctx.textAlign = 'left';

  return canvas;
}

/* Modal con el formulario (título/fecha/notas) + vista previa de la
   invitación generada, reutilizando el mismo overlay que la Guía y los
   selectores de equipo (guarda contenido HTML propio en #modalGuide). */
function openInvitationModal() {
  const data = currentInvitationRoster();
  if (!data || !data.roster.length) {
    showToast('Elegí una build con jugadores para generar la invitación');
    return;
  }
  const { entry, roster, label } = data;
  const defaultTitle = `${label} — ${entry.name}`;

  document.getElementById('modalTitle').textContent = '🎉 Invitación para Discord';
  document.getElementById('modalText').style.display = 'none';
  document.getElementById('modalFoot').style.display = 'none';
  document.getElementById('modalBox').classList.add('wide');
  const guide = document.getElementById('modalGuide');
  guide.style.display = '';
  guide.innerHTML = '';

  const form = document.createElement('div');
  form.className = 'invite-form';

  function fieldRow(labelText, placeholder, value, type) {
    const lbl = document.createElement('label');
    lbl.className = 'invite-label';
    lbl.appendChild(document.createTextNode(labelText));
    const input = document.createElement('input');
    input.type = type || 'text';
    if (placeholder) input.placeholder = placeholder;
    if (value) input.value = value;
    lbl.appendChild(input);
    return { lbl, input };
  }

  // Fecha y hora: en vez de un solo <input type="datetime-local"> (cuyo
  // reloj nativo puede mostrar AM/PM según el idioma del navegador del
  // usuario, algo que no se puede forzar de forma confiable desde la
  // página), se arma con un <input type="date"> (ese sí es siempre un
  // calendario, sin ambigüedad de horario) más dos <select> propios de
  // hora (00-23) y minuto, con las opciones escritas a mano en formato de
  // 24 horas — así nunca puede aparecer AM/PM sin importar el navegador o
  // la configuración regional de quien la usa. Sigue siendo "con
  // selección" (nada de tipear texto libre), solo que ya no depende del
  // widget nativo del navegador para el horario.
  function dateTimeRow(labelText) {
    const lbl = document.createElement('label');
    lbl.className = 'invite-label';
    lbl.appendChild(document.createTextNode(labelText));
    const wrap = document.createElement('div');
    wrap.className = 'invite-datetime-wrap';

    const dateInput = document.createElement('input');
    dateInput.type = 'date';
    dateInput.className = 'invite-date-input';
    wrap.appendChild(dateInput);

    const hourSelect = document.createElement('select');
    hourSelect.className = 'invite-hour-select';
    hourSelect.setAttribute('aria-label', 'Hora (24 hs)');
    for (let h = 0; h < 24; h++) {
      const opt = document.createElement('option');
      opt.value = String(h).padStart(2, '0');
      opt.textContent = String(h).padStart(2, '0');
      hourSelect.appendChild(opt);
    }
    wrap.appendChild(hourSelect);

    const sep = document.createElement('span');
    sep.className = 'invite-time-sep';
    sep.textContent = ':';
    wrap.appendChild(sep);

    const minuteSelect = document.createElement('select');
    minuteSelect.className = 'invite-minute-select';
    minuteSelect.setAttribute('aria-label', 'Minuto');
    [0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55].forEach(m => {
      const opt = document.createElement('option');
      opt.value = String(m).padStart(2, '0');
      opt.textContent = String(m).padStart(2, '0');
      minuteSelect.appendChild(opt);
    });
    wrap.appendChild(minuteSelect);

    lbl.appendChild(wrap);
    return {
      lbl, dateInput, hourSelect, minuteSelect,
      getValue: () => dateInput.value ? `${dateInput.value}T${hourSelect.value}:${minuteSelect.value}` : '',
    };
  }

  const titleRow = fieldRow('Título del evento', '', defaultTitle);
  titleRow.input.maxLength = 70;
  // Se elige en el horario local de quien arma la invitación y se muestra
  // en la invitación ya convertida a UTC (en formato 24 hs, sin AM/PM),
  // para que nadie del gremio tenga dudas sin importar en qué huso horario
  // esté ni qué navegador use.
  const whenRow = dateTimeRow('Fecha y hora (opcional — 24 hs, se muestra en UTC)');
  const notesRow = fieldRow('Notas para quien se anote (opcional)', 'Ej: Traé poción y comida en el inventario');
  notesRow.input.maxLength = 120;

  form.appendChild(titleRow.lbl);
  form.appendChild(whenRow.lbl);
  form.appendChild(notesRow.lbl);

  let channelRow = null;
  if (FIREBASE_ENABLED) {
    channelRow = fieldRow('Canal de Discord para publicar (ID, opcional)', 'Vacío = canal por defecto del bot');
    channelRow.input.maxLength = 30;
    form.appendChild(channelRow.lbl);
  }

  const genBtn = document.createElement('button');
  genBtn.type = 'button';
  genBtn.className = 'primary';
  genBtn.style.marginTop = '2px';
  genBtn.textContent = '🖼 Generar invitación';
  form.appendChild(genBtn);

  guide.appendChild(form);

  const previewWrap = document.createElement('div');
  previewWrap.id = 'invitePreviewWrap';
  previewWrap.style.marginTop = '18px';
  guide.appendChild(previewWrap);

  genBtn.onclick = async () => {
    const title = titleRow.input.value.trim() || defaultTitle;
    const when = formatWhenUTC(whenRow.getValue());
    const notes = notesRow.input.value.trim();
    const channelId = channelRow ? channelRow.input.value.trim() : '';
    genBtn.disabled = true;
    genBtn.textContent = '⏳ Generando...';
    try {
      const canvas = await buildInvitationCanvas({ title, when, notes, roster, label });
      renderInvitationPreview(canvas, title, invitationTextBlock(title, when, notes, roster), { title, when, notes, roster, channelId });
    } catch (err) {
      showToast('No se pudo generar la imagen ✕');
    } finally {
      genBtn.disabled = false;
      genBtn.textContent = '🖼 Generar invitación';
    }
  };

  document.getElementById('modalOverlay').classList.add('show');
}

function renderInvitationPreview(canvas, title, text, syncData) {
  const wrap = document.getElementById('invitePreviewWrap');
  if (!wrap) return;
  stopActiveSignupWatch();
  wrap.innerHTML = '';

  const img = document.createElement('img');
  img.src = canvas.toDataURL('image/png');
  img.alt = 'Vista previa de la invitación';
  wrap.appendChild(img);

  const actions = document.createElement('div');
  actions.className = 'invite-actions';

  const copyImgBtn = document.createElement('button');
  copyImgBtn.type = 'button';
  copyImgBtn.className = 'primary';
  copyImgBtn.textContent = '📋 Copiar imagen';
  copyImgBtn.onclick = () => {
    if (!navigator.clipboard || !window.ClipboardItem) {
      showToast('Tu navegador no permite copiar imágenes — usá "Descargar imagen" ✕');
      return;
    }
    try {
      const item = new ClipboardItem({
        'image/png': new Promise((resolve, reject) => {
          canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('sin blob')), 'image/png');
        }),
      });
      navigator.clipboard.write([item])
        .then(() => showToast('Imagen copiada — pegala en Discord con Ctrl+V ✔'))
        .catch(() => showToast('No se pudo copiar la imagen — probá "Descargar imagen" ✕'));
    } catch (err) {
      showToast('No se pudo copiar la imagen — probá "Descargar imagen" ✕');
    }
  };
  actions.appendChild(copyImgBtn);

  const dlBtn = document.createElement('button');
  dlBtn.type = 'button';
  dlBtn.className = 'ghost';
  dlBtn.textContent = '⬇ Descargar imagen';
  dlBtn.onclick = () => {
    const safe = (title || 'invitacion').replace(/[^a-z0-9áéíóúñ_-]+/gi, '_').slice(0, 60) || 'invitacion';
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = `invitacion_${safe}.png`;
    a.click();
  };
  actions.appendChild(dlBtn);

  const copyTextBtn = document.createElement('button');
  copyTextBtn.type = 'button';
  copyTextBtn.className = 'ghost';
  copyTextBtn.textContent = '📋 Copiar texto';
  copyTextBtn.onclick = () => {
    navigator.clipboard.writeText(text)
      .then(() => showToast('Texto copiado ✔'))
      .catch(() => showToast('No se pudo copiar el texto ✕'));
  };
  actions.appendChild(copyTextBtn);

  wrap.appendChild(actions);

  if (syncData) wrap.appendChild(buildLiveSyncSection(syncData));
}

/* Función para cortar el listener de Firebase de la lista de anotados en
   vivo que pueda haber quedado activo (se llama al generar una invitación
   nueva o al cerrar el modal) — evita dejar listeners colgados escuchando
   de más. */
let stopSignupWatch = null;
function stopActiveSignupWatch() {
  if (stopSignupWatch) { stopSignupWatch(); stopSignupWatch = null; }
}

/* Arma el bloque "Sincronización en vivo con Discord" que va debajo de los
   botones de copiar/descargar: si Firebase no está configurado en esta
   página, muestra solo una nota explicando cómo activarlo; si sí lo está,
   muestra el botón para publicar y, una vez publicado, la lista de quién
   se anotó a cada rol actualizándose en vivo. */
function buildLiveSyncSection({ title, when, notes, roster, channelId }) {
  const box = document.createElement('div');
  box.className = 'live-sync-box';

  if (!FIREBASE_ENABLED) {
    box.innerHTML = `<p class="live-sync-hint">🔌 La sincronización en vivo con Discord no está configurada en esta página — para activarla, completá <code>FIREBASE_CONFIG</code> en el archivo y tené el bot corriendo (ver <code>discord-bot/README.md</code>).</p>`;
    return box;
  }

  const head = document.createElement('div');
  head.className = 'live-sync-head';
  head.innerHTML = `<b>🔴 Sincronización en vivo con Discord</b>`;
  box.appendChild(head);

  const publishBtn = document.createElement('button');
  publishBtn.type = 'button';
  publishBtn.className = 'primary';
  publishBtn.textContent = '📡 Publicar y sincronizar con Discord';
  box.appendChild(publishBtn);

  const statusEl = document.createElement('div');
  statusEl.className = 'live-sync-status';
  box.appendChild(statusEl);

  const boardEl = document.createElement('div');
  boardEl.className = 'live-sync-board';
  box.appendChild(boardEl);

  function renderBoard(signups) {
    boardEl.innerHTML = '';
    const rolesPresentes = [...new Set(roster.map(s => s.role))];
    rolesPresentes.forEach(role => {
      const def = ROLES[role];
      const people = signups && signups[role] ? Object.values(signups[role]) : [];
      const row = document.createElement('div');
      row.className = 'live-sync-role-row';
      const namesText = people.length
        ? people.map(p => p.username).join(', ')
        : '— nadie anotado todavía —';
      row.innerHTML = `<span class="live-sync-role-tag">${def.icon} ${def.label} (${people.length})</span><span class="live-sync-role-names">${namesText}</span>`;
      boardEl.appendChild(row);
    });
  }

  publishBtn.onclick = () => {
    publishBtn.disabled = true;
    publishBtn.textContent = '⏳ Publicando...';
    statusEl.textContent = '';
    publishEventToDiscord({ title, when, notes, roster, channelId }, (status) => {
      if (status.state === 'waiting') {
        statusEl.textContent = '⏳ Esperando que el bot lo publique en Discord...';
      } else if (status.state === 'posted') {
        statusEl.textContent = '✅ Publicado en Discord — reaccionando en el mensaje se anota la gente acá abajo en vivo.';
        publishBtn.style.display = 'none';
        stopActiveSignupWatch();
        stopSignupWatch = watchEventSignups(status.eventId, renderBoard);
      } else if (status.state === 'error') {
        statusEl.textContent = `✕ ${status.message}`;
        publishBtn.disabled = false;
        publishBtn.textContent = '📡 Publicar y sincronizar con Discord';
      }
    });
  };

  return box;
}

/* Modal de inicio de sesión — usuario/contraseña simples, reutiliza el
   mismo modal genérico que la Guía/el picker de equipo. Deja bien claro
   que esto es solo una traba de interfaz (ver comentario en AUTH_USERS),
   no un sistema de seguridad real. */
function openLoginModal() {
  document.getElementById('modalTitle').textContent = 'Iniciar sesión';
  document.getElementById('modalText').style.display = 'none';
  const guide = document.getElementById('modalGuide');
  guide.style.display = '';
  guide.innerHTML = '';
  document.getElementById('modalFoot').style.display = 'none';
  document.getElementById('modalBox').classList.remove('wide');

  const form = document.createElement('form');
  form.className = 'invite-form';

  const userLabel = document.createElement('label');
  userLabel.className = 'invite-label';
  userLabel.innerHTML = '<span>Usuario</span>';
  const userInput = document.createElement('input');
  userInput.type = 'text';
  userInput.autocomplete = 'username';
  userInput.placeholder = 'pvpx';
  userLabel.appendChild(userInput);
  form.appendChild(userLabel);

  const passLabel = document.createElement('label');
  passLabel.className = 'invite-label';
  passLabel.innerHTML = '<span>Contraseña</span>';
  const passInput = document.createElement('input');
  passInput.type = 'password';
  passInput.autocomplete = 'current-password';
  passLabel.appendChild(passInput);
  form.appendChild(passLabel);

  const errorEl = document.createElement('div');
  errorEl.style.cssText = 'color:var(--red-bright);font-size:12.5px;min-height:16px;';
  form.appendChild(errorEl);

  const submitBtn = document.createElement('button');
  submitBtn.type = 'submit';
  submitBtn.className = 'primary';
  submitBtn.textContent = 'Ingresar';
  submitBtn.style.marginTop = '4px';
  form.appendChild(submitBtn);

  const note = document.createElement('p');
  note.className = 'live-sync-hint';
  note.style.marginTop = '16px';
  note.textContent = 'Esto es solo para evitar que el resto del gremio edite la comp sin querer — no es una contraseña de verdad, cualquiera con conocimientos técnicos podría saltarla.';
  form.appendChild(note);

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const ok = doLogin(userInput.value, passInput.value);
    if (!ok) {
      errorEl.textContent = 'Usuario o contraseña incorrectos.';
      passInput.value = '';
      passInput.focus();
      return;
    }
    document.getElementById('modalOverlay').classList.remove('show');
    const label = AUTH_USERS[currentAuthUser()].label;
    showToast(`Sesión iniciada como ${label} ✔`);
    renderAll();
  });

  guide.appendChild(form);
  document.getElementById('modalOverlay').classList.add('show');
  setTimeout(() => userInput.focus(), 60);
}

function pickerIcon(name, suffix) {
  const box = document.createElement('span');
  box.className = 'gear-picker-icon';
  box.textContent = '❔';
  const url = iconUrl(suffix);
  if (url) {
    const img = document.createElement('img');
    img.src = url;
    img.alt = name;
    img.onerror = () => { box.textContent = '❔'; };
    box.textContent = '';
    box.appendChild(img);
  }
  return box;
}

/* Modal para elegir manualmente una pieza de equipo (casco/capa/pecho/botas/
   off-hand) para un jugador puntual, sin importar qué traiga su build por
   defecto. `onSelect` recibe la clave elegida del catálogo, 'NONE' (solo si
   allowNone) o null para volver al valor por defecto de la build. */
function openGearPicker(pieceLabel, catalog, currentKey, allowNone, onSelect, showReset) {
  if (!requireEditor('editar el equipo')) return;
  document.getElementById('modalTitle').textContent = `Elegir ${pieceLabel}`;
  document.getElementById('modalText').style.display = 'none';
  const guide = document.getElementById('modalGuide');
  guide.style.display = '';
  guide.innerHTML = '';
  document.getElementById('modalFoot').style.display = 'none';
  document.getElementById('modalBox').classList.add('wide');

  const close = () => document.getElementById('modalOverlay').classList.remove('show');

  const actions = document.createElement('div');
  actions.className = 'gear-picker-actions';
  if (showReset !== false) {
    const resetBtn = document.createElement('button');
    resetBtn.type = 'button';
    resetBtn.className = 'ghost small';
    resetBtn.textContent = '↺ Usar el de la build (por defecto)';
    resetBtn.onclick = () => { onSelect(null); close(); };
    actions.appendChild(resetBtn);
  }
  if (allowNone) {
    const noneBtn = document.createElement('button');
    noneBtn.type = 'button';
    noneBtn.className = 'ghost small';
    noneBtn.textContent = '— Sin off-hand';
    noneBtn.onclick = () => { onSelect('NONE'); close(); };
    actions.appendChild(noneBtn);
  }
  if (actions.children.length) guide.appendChild(actions);

  // Buscador: solo tiene sentido si hay bastantes opciones para filtrar
  // (armas ~150, armadura ~27 por tipo) — con pocas (capas, off-hand
  // agrupado en 3) el filtro no ahorra nada y solo agrega ruido visual.
  const totalItems = Array.isArray(catalog)
    ? catalog.reduce((n, g) => n + Object.keys(g.entries).length, 0)
    : Object.keys(catalog).length;
  let searchInput = null;
  if (totalItems > 10) {
    searchInput = document.createElement('input');
    searchInput.type = 'text';
    searchInput.className = 'gear-picker-search';
    searchInput.placeholder = `🔍 Buscar entre ${totalItems} opciones…`;
    searchInput.autocomplete = 'off';
    guide.appendChild(searchInput);
  }

  function makeItem(key, name, suffix) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'gear-picker-item' + (key === currentKey ? ' active' : '');
    btn.appendChild(pickerIcon(name, suffix));
    const nm = document.createElement('span');
    nm.className = 'gear-picker-name';
    nm.textContent = shortEsName(name);
    btn.title = name;
    btn.dataset.search = normalizeSearch(name + ' ' + nm.textContent);
    btn.appendChild(nm);
    btn.onclick = () => { onSelect(key); close(); };
    return btn;
  }

  // El catálogo puede venir agrupado (array de {label, entries}) — por
  // familia de arma o por material/facción de armadura — o plano (dict
  // simple, como las capas). Agrupado: se muestra un título por sección
  // para que "se desplieguen separadas por los diferentes tipos que hay".
  const groupBlocks = [];
  if (Array.isArray(catalog)) {
    catalog.forEach(group => {
      const keys = Object.keys(group.entries);
      if (!keys.length) return;
      const h = document.createElement('div');
      h.className = 'gear-picker-group-title';
      h.textContent = group.label;
      guide.appendChild(h);
      const grid = document.createElement('div');
      grid.className = 'gear-picker-grid';
      keys.forEach(key => {
        const [name, suffix] = group.entries[key];
        grid.appendChild(makeItem(key, name, suffix));
      });
      guide.appendChild(grid);
      groupBlocks.push({ title: h, grid });
    });
  } else {
    const grid = document.createElement('div');
    grid.className = 'gear-picker-grid';
    Object.keys(catalog).forEach(key => {
      const [name, suffix] = catalog[key];
      grid.appendChild(makeItem(key, name, suffix));
    });
    guide.appendChild(grid);
  }

  if (searchInput) {
    searchInput.oninput = () => {
      const q = normalizeSearch(searchInput.value.trim());
      let anyVisibleTotal = false;
      guide.querySelectorAll('.gear-picker-item').forEach(btn => {
        const match = !q || btn.dataset.search.includes(q);
        btn.style.display = match ? '' : 'none';
        if (match) anyVisibleTotal = true;
      });
      groupBlocks.forEach(({ title, grid }) => {
        const anyVisible = Array.from(grid.children).some(c => c.style.display !== 'none');
        title.style.display = anyVisible ? '' : 'none';
        grid.style.display = anyVisible ? '' : 'none';
      });
      let empty = guide.querySelector('.gear-picker-empty');
      if (!anyVisibleTotal) {
        if (!empty) {
          empty = document.createElement('div');
          empty.className = 'gear-picker-empty';
          empty.textContent = 'Sin resultados — probá con otro nombre.';
          guide.appendChild(empty);
        }
      } else if (empty) {
        empty.remove();
      }
    };
    setTimeout(() => searchInput.focus(), 30);
  }

  document.getElementById('modalOverlay').classList.add('show');
}

/* ---------------- Tema claro / oscuro ---------------- */
let theme = 'dark';
function applyTheme() {
  const btn = document.getElementById('btnTheme');
  if (theme === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    btn.textContent = '☀️ Claro';
  } else {
    document.documentElement.removeAttribute('data-theme');
    btn.textContent = '🌙 Oscuro';
  }
}

/* Refleja el nombre del gremio en el título de la pestaña, el chip del
   header y el pie de página, para que se note claramente de qué gremio
   es la herramienta. */
function updateGuildBranding() {
  const name = (state.guildName || 'PVPX').trim() || 'PVPX';
  document.title = `${name} — Compositor de Grupos · Albion Online`;
  const brand = document.getElementById('brandTitle');
  if (brand) brand.textContent = name.toUpperCase();
}

/* ---------------- Eventos globales ---------------- */
document.addEventListener('DOMContentLoaded', () => {
  // Recupera el autoguardado de este navegador (si existe) antes del primer
  // render, así se retoma exactamente donde se dejó la última vez.
  const saved = loadFromStorage();
  if (saved) applyState(saved);
  if (!state.customBuilds.length) state.customBuilds.push(newCustomBuild('Mi build 1'));

  updateGuildBranding();
  // Si FIREBASE_CONFIG está completo, arranca la sincronización en vivo del
  // estado del gremio y el indicador "🔄 En vivo" del header — si no, no
  // hacen nada y la página sigue siendo 100% local, como siempre.
  initFirebaseSync();
  initSyncBadge();

  updateAuthUI();
  document.getElementById('btnAuth').onclick = () => {
    if (isEditor()) {
      doLogout();
      updateAuthUI();
      showToast('Sesión cerrada — quedaste en modo solo lectura');
      renderAll();
    } else {
      openLoginModal();
    }
  };

  document.getElementById('btnTheme').onclick = () => {
    theme = theme === 'dark' ? 'light' : 'dark';
    applyTheme();
  };
  applyTheme();

  document.getElementById('btnCopy').onclick = () => {
    openModal('Composición lista para Discord', textReport());
  };
  document.getElementById('btnInvite').onclick = () => {
    if (!currentInvitationRoster()) {
      showToast('La invitación está disponible en Composición y Avalón — elegí una build primero');
      return;
    }
    openInvitationModal();
  };
  document.getElementById('btnExport').onclick = () => {
    const guild = (state.guildName || 'gremio').replace(/[^a-z0-9áéíóúñ_-]+/gi, '_');
    const fecha = new Date().toISOString().slice(0, 10);
    const content = serializeState();
    downloadFile(`pvpx_respaldo_${guild}_${fecha}.json`, content, 'application/json');
    // Con sesión iniciada, además de bajar el archivo se guarda una copia
    // en el historial local de "Respaldos" (solo admin lo ve) — sin
    // sesión, exportar sigue funcionando igual (es una acción de lectura,
    // no de edición) pero no queda copia en ese historial.
    if (isEditor()) saveBackupSnapshot(content);
    showToast('Respaldo completo exportado ✔');
  };
  document.getElementById('btnImportTrigger').onclick = () => {
    if (!requireEditor('importar un respaldo')) return;
    document.getElementById('btnImport').click();
  };
  document.getElementById('btnImport').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (!requireEditor('importar un respaldo')) { e.target.value = ''; return; }
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        applyState(data);
        updateGuildBranding();
        renderAll();
        showToast('Respaldo importado ✔ — todo tu progreso quedó cargado');
      } catch (err) {
        showToast('Error al leer el archivo ✕');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  /* ---------------- Menú de acciones en celular (hamburguesa) ----------------
     En desktop el .toolbar se ve entero en el header. En celular no entra
     (quedaba en 2-3 filas de botones apretados) — se colapsa detrás de un
     botón ☰ que despliega los mismos botones como un menú prolijo, con un
     fondo oscuro atrás que cierra el menú al tocarlo afuera. Fuera del
     breakpoint mobile el CSS ignora estas clases por completo. */
  const mobileMenuBtn = document.getElementById('mobileMenuBtn');
  const mobileToolbar = document.getElementById('toolbar');
  const mobileBackdrop = document.getElementById('mobileMenuBackdrop');
  if (mobileMenuBtn && mobileToolbar && mobileBackdrop) {
    const closeMobileMenu = () => {
      mobileToolbar.classList.remove('mobile-open');
      mobileBackdrop.classList.remove('show');
      mobileMenuBtn.setAttribute('aria-expanded', 'false');
      mobileMenuBtn.textContent = '☰';
    };
    const openMobileMenu = () => {
      mobileToolbar.classList.add('mobile-open');
      mobileBackdrop.classList.add('show');
      mobileMenuBtn.setAttribute('aria-expanded', 'true');
      mobileMenuBtn.textContent = '✕';
    };
    mobileMenuBtn.onclick = () => {
      if (mobileToolbar.classList.contains('mobile-open')) closeMobileMenu(); else openMobileMenu();
    };
    mobileBackdrop.onclick = closeMobileMenu;
    // Tocar cualquier botón de acción adentro cierra el menú solo — si no,
    // queda tapando la pantalla después de exportar/cambiar tema/etc.
    mobileToolbar.addEventListener('click', (e) => {
      if (e.target.closest('button')) closeMobileMenu();
    });
    window.addEventListener('resize', () => { if (window.innerWidth > 640) closeMobileMenu(); });
  }

  document.getElementById('btnReset').onclick = () => {
    if (!requireEditor('reiniciar')) return;
    if (state.mode === 'balance') { showToast('El balance no se reinicia desde acá — quitá jugadores uno por uno con el ✕'); return; }
    if (SOLO_MODES.includes(state.mode)) {
      if (!confirm('¿Restaurar el equipamiento por defecto de la build de esta pestaña? Se perderán el arma y las piezas que hayas cambiado a mano.')) return;
      SOLO_BUILDS[state.mode].forEach(b => { state.soloOverrides[b.id] = { gear: {}, weapon: null }; });
      renderPanel();
      return;
    }
    if (!confirm('¿Reiniciar ESTA build a la plantilla sugerida? Se perderán los cambios de equipo hechos en esta build. (No afecta a tus otras builds guardadas, ni al Balance, ni a Solitario.)')) return;
    const entry = currentCompEntry();
    if (entry) entry.roster = buildSlotsFromTemplate(defaultTemplateFor(state.mode));
    renderPanel();
  };

  document.getElementById('btnHelp').onclick = () => {
    const rolesHtml = ROLE_KEYS.map(k => {
      const def = ROLES[k];
      const accent = ROLE_ACCENT[k] || 'var(--red)';
      return `<div class="guide-role-item" style="--accent:${accent}">
        <div class="guide-role-head"><span>${def.icon}</span><b>${def.label}</b></div>
        <div class="guide-role-desc">${def.desc}</div>
        <div class="guide-role-armor"><b>Armadura base:</b> ${def.armor}</div>
      </div>`;
    }).join('');

    const doctrinesHtml = Object.keys(ZVZ_VARIANTS).map(k => {
      const v = ZVZ_VARIANTS[k];
      return `<div class="guide-mode-item"><b>${v.icon} ${v.label}</b> — ${v.desc}</div>`;
    }).join('');

    const modesHtml = `
      <div class="guide-mode-item"><b>⚔️ ZVZ</b> — ${MODES.zvz.desc}. Podés crear hasta 4 grupos para un mismo evento (40/60/80 jugadores).</div>
      <div class="guide-mode-item"><b>🛡️ Grupales</b> — ${MODES.grupal.desc} (small-scale, hellgates, roads).</div>
      <div class="guide-mode-item"><b>⭐ Estática</b> — ${MODES.estatica.desc}.</div>
    `;

    const html = `
      <h4>Roles</h4>
      <div class="guide-roles">${rolesHtml}</div>
      <h4>Modalidades</h4>
      ${modesHtml}
      <h4>Doctrinas ZVZ</h4>
      ${doctrinesHtml}
      <h4>Balance de jugadores</h4>
      <div class="guide-mode-item">💰 Registrá el saldo de plata de cada miembro del gremio: sumalo cuando se reparte loot, restalo cuando alguien retira, y consultá el historial completo de movimientos de cada jugador — todo desde la pestaña <b>Balance</b> del menú principal.</div>
      <h4>Equipo de cada build</h4>
      <div class="guide-note">Cada build incluye arma, casco, pecho, botas y capa sugeridos, con íconos oficiales de Albion Online. Podés cambiar cualquier pieza desde los selects de cada tarjeta según lo que tenga disponible cada jugador.</div>
    `;
    openGuideModal('Guía rápida de roles y doctrinas', html);
  };

  document.getElementById('modalClose').onclick = () => { document.getElementById('modalOverlay').classList.remove('show'); stopActiveSignupWatch(); };
  document.getElementById('modalOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'modalOverlay') { e.currentTarget.classList.remove('show'); stopActiveSignupWatch(); }
  });
  document.getElementById('modalCopyBtn').onclick = () => {
    const ta = document.getElementById('modalText');
    ta.select();
    navigator.clipboard.writeText(ta.value).then(() => showToast('Copiado al portapapeles ✔'))
      .catch(() => { document.execCommand('copy'); showToast('Copiado al portapapeles ✔'); });
  };

  renderAll();
});

</script>
</body>
</html>
