/* ---------------- Render: pestaña Solitario (PvE / PvP) ---------------- */
/* La tarjeta de Solitario es un punto de partida totalmente editable, no
   una referencia fija: además de las piezas de armadura, acá también se
   puede cambiar el arma principal — eligiendo entre TODAS las armas de la
   herramienta (agrupadas por familia), no solo las del rol. El override
   guarda tanto las piezas (igual que slot.gear en el roster) como el arma
   elegida (null = usar la de la build sugerida). */
function soloOverrideFor(b) {
  let ov = state.soloOverrides[b.id];
  if (!ov || typeof ov.gear !== 'object') ov = { gear: {}, weapon: null };
  state.soloOverrides[b.id] = ov;
  return ov;
}

function buildSoloStatsChart(stats, accent) {
  const wrap = document.createElement('div');
  wrap.className = 'solo-stats';
  Object.keys(SOLO_STATS_LABELS).forEach(key => {
    const val = Math.max(0, Math.min(10, stats[key] || 0));
    const row = document.createElement('div');
    row.className = 'solo-stat-row';
    row.innerHTML = `
      <span class="solo-stat-label">${SOLO_STATS_LABELS[key]}</span>
      <span class="solo-stat-track"><span class="solo-stat-fill" style="width:${val * 10}%;background:linear-gradient(90deg, color-mix(in srgb, ${accent} 55%, transparent), ${accent})"></span></span>
      <span class="solo-stat-value">${val}/10</span>
    `;
    wrap.appendChild(row);
  });
  return wrap;
}

function buildSoloCard(b, accent) {
  const card = document.createElement('div');
  card.className = 'solo-card';
  card.style.setProperty('--accent', accent);

  const head = document.createElement('div');
  head.className = 'solo-card-head';
  head.innerHTML = `<div class="solo-card-title"><span>${b.icon}</span><span>${b.label}</span></div>`;
  card.appendChild(head);

  const ov = soloOverrideFor(b);
  const weapon = ov.weapon || b.weapon;
  const slot = { gear: ov.gear };

  const weaponEditableCfg = {
    pieceLabel: 'arma', catalog: WEAPON_PICKER_GROUPS, currentKey: weapon.name, allowNone: false, showReset: true,
    onPick: (key) => {
      if (key === null) {
        ov.weapon = null;
      } else {
        const found = MASTER_WEAPONS.find(w => w.name === key);
        if (found) ov.weapon = found;
      }
      ov.gear = {};
      renderPanel();
    },
  };
  card.appendChild(buildDoll(weapon, { icon: b.icon }, slot, weaponEditableCfg));

  const desc = document.createElement('p');
  desc.className = 'solo-desc';
  desc.textContent = b.desc;
  card.appendChild(desc);

  card.appendChild(buildSoloStatsChart(computeSoloStats(weapon, slot), accent));

  return card;
}

function buildSoloPanel() {
  const wrap = document.createElement('div');
  wrap.className = 'solo-panel';

  const note = document.createElement('div');
  note.className = 'solo-note';
  note.innerHTML = `⚠ Punto de partida de meta ago-2026 (temporada Radiant Wilds) — no son datos oficiales de Albion Online. Tocá el arma o cualquier pieza para elegir entre TODO el catálogo de la herramienta (agrupado por familia/material): el gráfico de abajo se recalcula según lo que dejes puesto.`;
  wrap.appendChild(note);

  const grid = document.createElement('div');
  grid.className = 'solo-grid';
  const accent = SOLO_ACCENT[state.mode] || 'var(--red)';
  SOLO_BUILDS[state.mode].forEach(b => grid.appendChild(buildSoloCard(b, accent)));
  wrap.appendChild(grid);

  return wrap;
}

/* ---------------- Biblioteca de Builds ----------------
   Galería de referencia con TODAS las builds ya definidas en la
   herramienta (las de cada rol + las armas sueltas del catálogo completo,
   el mismo MASTER_WEAPONS que usan los selectores de arma) — filtrable por
   rol y por tipo de arma, con buscador. Es de solo lectura: para armar una
   composición real se usan las pestañas de Composición / Solitario /
   Avalón; esto es un catálogo para consultar equipo rápido, con un botón
   para copiar cada build y pegarla directo en Discord. */
let buildsFilter = { search: '', role: 'all', family: 'all' };

/* Para cada build (por nombre), a qué rol(es) de ROLES pertenece. Una
   misma build puede repetirse en más de un rol; las armas sueltas
   agregadas solo para completar el catálogo del juego no pertenecen a
   ningún rol (quedan como "sin rol fijo"). */
function buildRoleReverseMap() {
  const map = {};
  ROLE_KEYS.forEach(roleKey => {
    (ROLES[roleKey].weapons || []).forEach(w => {
      if (!map[w.name]) map[w.name] = [];
      if (!map[w.name].includes(roleKey)) map[w.name].push(roleKey);
    });
  });
  return map;
}

/* ---------------- Modal de información/habilidades de un arma ----------
   Usa WEAPON_ABILITIES (datos oficiales, ver comentario junto a esa
   constante) para mostrar, al tocar el botón "ℹ️" de una tarjeta de la
   Biblioteca, qué habilidades tiene disponibles ese TIPO de arma. Ojo: en
   Albion cada jugador elige una habilidad activa por casilla (Q/W) y una
   pasiva entre varias opciones que se desbloquean con maestría — por eso
   se listan todas las opciones, no "las 3 que usa esta build puntual" (la
   Definitiva/R sí es siempre una sola, sin elección).
---------------------------------------------------------------------- */
const ATTACK_TYPE_ES = { magic: 'Mágico', melee: 'Cuerpo a cuerpo', ranged: 'A distancia' };

function weaponAbilitiesFor(u) {
  return (u && WEAPON_ABILITIES[u]) || null;
}

/* Ícono de una habilidad — mismo servicio oficial de renders de Albion que
   ya se usa para ítems, pero por el endpoint /v1/spell/ (en vez de /v1/item/)
   y usando el nombre único del hechizo (no el nombre visible). Investigado
   contra la documentación pública del servicio — igual que con los ítems,
   si el ícono puntual no carga se cae a un emoji genérico en vez de romper
   la tarjeta. */
function abilitySpellIconUrl(spellUnique) {
  if (!spellUnique) return null;
  return `https://render.albiononline.com/v1/spell/${spellUnique}.png?size=64&quality=1`;
}

function escapeHtmlAttr(s) {
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* Indicativo de cuál habilidad "conviene" tener seleccionada: no es un
   ranking de poder (eso sí sería un juicio de meta que no puedo verificar
   arma por arma sin caer en lo mismo que ya declinamos con Battle Hub) sino
   un dato objetivo sacado de los archivos del juego — cuánta maestría de
   combate hace falta invertir en esa arma para desbloquear cada opción.
   "Base" = viene desde el arma T4 sin invertir nada extra; "Maestría T3+"
   = hace falta subir maestría hasta ese nivel para poder elegirla. Sirve
   como guía real de progresión sin inventar un "pick recomendado". */
function abilityTierBadge(tier) {
  if (tier == null) return '';
  if (tier <= 1) return '<span class="ability-tier base">Base</span>';
  return `<span class="ability-tier">Maestría T${tier}+</span>`;
}

/* Elección de habilidad por casilla — guardada en ESTE dispositivo (localStorage).
   Esto es lo que reemplaza a "listar las 2-3 opciones como si estuvieran todas
   equipadas a la vez": en Albion elegís UNA por casilla (Q/W/Pasiva) entre las
   que se desbloquean con maestría de combate, así que acá dejamos que cada
   jugador marque la suya (queda resaltada con ✓) en vez de la herramienta
   imponer "la correcta" — eso sería copiar el pick puntual de un build de
   Battle Hub u otro sitio, algo que no vamos a reproducir (ver nota en el
   modal). El estado es 100% local: no se comparte ni se sube a ningún lado. */
const ABILITY_PICK_KEY = 'pvpx_ability_picks';
function loadAbilityPicks() {
  try {
    const raw = localStorage.getItem(ABILITY_PICK_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (err) { return {}; }
}
function saveAbilityPick(weaponU, slotKey, pickId) {
  try {
    const picks = loadAbilityPicks();
    picks[weaponU] = picks[weaponU] || {};
    picks[weaponU][slotKey] = pickId;
    localStorage.setItem(ABILITY_PICK_KEY, JSON.stringify(picks));
  } catch (err) { /* localStorage no disponible (modo privado, cuota llena, etc.) */ }
}
function selectAbility(weaponU, slotKey, pickId, el) {
  if (!requireEditor('elegir habilidades')) return;
  saveAbilityPick(weaponU, slotKey, pickId);
  const list = el.closest('.ability-list');
  if (list) list.querySelectorAll('.ability-item').forEach(li => li.classList.remove('chosen'));
  el.classList.add('chosen');
}

function abilityListHtml(list, weaponU, slotKey) {
  if (!list || !list.length) return '<p class="guide-role-armor">— sin datos —</p>';
  const picks = loadAbilityPicks();
  const savedPick = picks[weaponU] && picks[weaponU][slotKey];
  const selectable = list.length > 1;
  const items = list.map((entry, idx) => {
    const name = typeof entry === 'string' ? entry : entry.n;
    const spellU = typeof entry === 'string' ? null : entry.u;
    const tier = typeof entry === 'string' ? null : entry.t;
    const pickId = spellU || ('idx' + idx);
    const iconUrlStr = abilitySpellIconUrl(spellU);
    const iconHtml = iconUrlStr
      ? `<span class="ability-icon"><span class="fallback">✨</span><img src="${escapeHtmlAttr(iconUrlStr)}" alt="${escapeHtmlAttr(name)}" loading="lazy" onload="this.previousElementSibling.style.display='none'" onerror="this.remove()"></span>`
      : `<span class="ability-icon"><span class="fallback">✨</span></span>`;
    const isChosen = selectable && savedPick === pickId;
    const cls = 'ability-item' + (selectable ? ' selectable' : '') + (isChosen ? ' chosen' : '');
    const radioHtml = selectable ? `<span class="ability-radio">✓</span>` : '';
    const clickAttr = selectable
      ? ` onclick="selectAbility('${escapeHtmlAttr(weaponU)}','${escapeHtmlAttr(slotKey)}','${escapeHtmlAttr(pickId)}', this)"`
      : '';
    return `<li class="${cls}"${clickAttr}>${radioHtml}${iconHtml}<span class="ability-name">${name}</span>${abilityTierBadge(tier)}</li>`;
  }).join('');
  const hint = selectable ? '<p class="ability-hint">Tocá la que usa tu build para marcarla — es tu elección, se guarda solo en este dispositivo.</p>' : '';
  return hint + '<ul class="ability-list">' + items + '</ul>';
}

function openWeaponInfoModal(displayName, u) {
  const info = weaponAbilitiesFor(u);
  const family = weaponFamilyOf(u);
  let html = `<h4>⚔️ ${shortEsName(displayName)}</h4>`;
  if (!info) {
    html += `<p>Todavía no hay datos de habilidades cargados para esta arma.</p>`;
    openGuideModal('Información del arma', html);
    return;
  }
  const atkType = ATTACK_TYPE_ES[info.attacktype] || info.attacktype || '—';
  html += `<p><b>Familia:</b> ${family.label} &nbsp;·&nbsp; <b>Tipo de ataque:</b> ${atkType} &nbsp;·&nbsp; <b>Alcance:</b> ${info.attackrange || '—'} &nbsp;·&nbsp; <b>Cadencia de ataque:</b> ${info.attackspeed || '—'}/s</p>`;
  html += `<div class="guide-note">Fuente: datos oficiales del juego (no de sitios de terceros ni de imágenes de otras webs). En Q, W y la Pasiva elegís UNA opción entre varias que se desbloquean con maestría de combate — tocá la tuya en la lista para marcarla, queda guardada en este dispositivo. La etiqueta junto a cada una indica cuánta maestría hace falta para desbloquearla ("Base" = sin invertir nada extra). No es un ranking de "la mejor" ni el pick de ningún sitio en particular — depende de tu build y del contenido que juegues, así que la elección es tuya. Si el ícono de alguna habilidad no existe en el servicio oficial del juego, se muestra ✨ en su lugar. La Definitiva (R) siempre es la misma, sin elección.</div>`;
  html += `<h4>🅠 Habilidad activa — casilla 1 (Q)</h4>${abilityListHtml(info.q, u, 'q')}`;
  html += `<h4>🅦 Habilidad activa — casilla 2 (W)</h4>${abilityListHtml(info.w, u, 'w')}`;
  html += `<h4>🅡 Definitiva (R)</h4>${abilityListHtml(info.r, u, 'r')}`;
  html += `<h4>Pasiva</h4>${abilityListHtml(info.passive, u, 'passive')}`;
  openGuideModal('Información del arma', html);
}

/* ---------------- Etiquetas de "dónde se usa" cada build ----------------
   A diferencia de las etiquetas de rol (que vienen de ROLES), estas salen
   de recorrer TEMPLATES: para cada arma de MASTER_WEAPONS, en qué
   modalidades (ZVZ Estándar/Kite/Brawl, Grupales, Estática, Avalón Azul/
   Dorado) aparece como sugerencia por defecto. Es 100% de la propia
   herramienta — no depende de ningún sitio externo.
---------------------------------------------------------------------- */
const CONTENT_TYPE_LABELS = {
  'zvz.estandar': 'ZVZ Estándar',
  'zvz.kite': 'ZVZ Kite',
  'zvz.brawl': 'ZVZ Brawl',
  grupal: 'Grupales',
  estatica: 'Estática',
  avalon_azul: 'Avalón Azul',
  avalon_dorado: 'Avalón Dorado',
};

function buildContentTypeReverseMap() {
  const map = {};
  const addFrom = (entries, tagKey) => {
    entries.forEach(e => {
      const w = ROLES[e.role] && ROLES[e.role].weapons[e.weaponIdx];
      if (!w) return;
      if (!map[w.name]) map[w.name] = [];
      if (!map[w.name].includes(tagKey)) map[w.name].push(tagKey);
    });
  };
  addFrom(TEMPLATES.zvz.estandar, 'zvz.estandar');
  addFrom(TEMPLATES.zvz.kite, 'zvz.kite');
  addFrom(TEMPLATES.zvz.brawl, 'zvz.brawl');
  addFrom(TEMPLATES.grupal, 'grupal');
  addFrom(TEMPLATES.estatica, 'estatica');
  addFrom(TEMPLATES.avalon_azul, 'avalon_azul');
  addFrom(TEMPLATES.avalon_dorado, 'avalon_dorado');
  return map;
}

function buildLibraryCard(b, roles, contentTypes) {
  const family = weaponFamilyOf(b.u);
  const accent = roles.length ? (ROLE_ACCENT[roles[0]] || '#c8102e') : '#6b6b6b';

  const card = document.createElement('div');
  card.className = 'lib-card';
  card.style.setProperty('--accent', accent);

  const tagsWrap = document.createElement('div');
  tagsWrap.className = 'lib-tags';
  if (roles.length) {
    roles.forEach(rk => {
      const t = document.createElement('span');
      t.className = 'lib-tag';
      t.style.setProperty('--tag-accent', ROLE_ACCENT[rk] || '#c8102e');
      t.textContent = `${ROLES[rk].icon} ${ROLES[rk].label}`;
      tagsWrap.appendChild(t);
    });
  } else {
    const t = document.createElement('span');
    t.className = 'lib-tag neutral';
    t.textContent = '⚔ Sin rol fijo';
    tagsWrap.appendChild(t);
  }
  const famTag = document.createElement('span');
  famTag.className = 'lib-tag family';
  famTag.textContent = family.label;
  tagsWrap.appendChild(famTag);
  (contentTypes || []).forEach(ctKey => {
    const t = document.createElement('span');
    t.className = 'lib-tag content';
    t.textContent = CONTENT_TYPE_LABELS[ctKey] || ctKey;
    tagsWrap.appendChild(t);
  });
  card.appendChild(tagsWrap);

  const title = document.createElement('div');
  title.className = 'lib-card-title';
  title.textContent = shortEsName(b.name);
  title.title = b.name;
  card.appendChild(title);

  const doll = document.createElement('div');
  doll.className = 'paperdoll lib-doll';
  const weaponSlot = dollSlot(b.u ? [b.name, b.u] : null, '⚔️', 'Arma', 'weapon-slot');
  if (!b.u) {
    // Igual que en buildDoll: algunas "armas" son en realidad monturas sin
    // ícono de arma propiamente dicho — se muestran como casilla llena con
    // el nombre en vez de vacía.
    weaponSlot.classList.remove('empty'); weaponSlot.classList.add('filled');
    weaponSlot.title = b.name;
    const nm = weaponSlot.querySelector('.doll-name');
    if (nm) { nm.textContent = shortEsName(b.name); nm.title = b.name; }
  }
  doll.appendChild(weaponSlot);
  doll.appendChild(dollSlot(b.food, b.food ? '🍖' : '—', 'Comida', 'food-slot' + (b.food ? '' : ' na')));
  doll.appendChild(dollSlot(b.potion || DEFAULT_POTION, '🧪', 'Poción', 'potion-slot'));
  doll.appendChild(dollSlot(b.helm, '🪖', 'Casco', 'helm-slot'));
  doll.appendChild(dollSlot(b.cape, '🧣', 'Capa', 'cape-slot'));
  doll.appendChild(dollSlot(b.chest, '👕', 'Pecho', 'chest-slot'));
  doll.appendChild(dollSlot(b.off, b.off ? '📯' : '—', 'Off-hand', 'off-slot' + (b.off ? '' : ' na')));
  doll.appendChild(dollSlot(b.boots, '👢', 'Botas', 'boots-slot'));
  card.appendChild(doll);

  const copyBtn = document.createElement('button');
  copyBtn.type = 'button';
  copyBtn.className = 'ghost small lib-copy-btn';
  copyBtn.textContent = '📋 Copiar';
  copyBtn.title = 'Copiar esta build como texto para pegar en Discord';
  copyBtn.onclick = () => {
    const parts = [`⚔ ${shortEsName(b.name)}`];
    if (b.helm) parts.push(`🪖 ${shortEsName(b.helm[0])}`);
    if (b.chest) parts.push(`👕 ${shortEsName(b.chest[0])}`);
    if (b.boots) parts.push(`👢 ${shortEsName(b.boots[0])}`);
    if (b.cape) parts.push(`🧣 ${shortEsName(b.cape[0])}`);
    if (b.off) parts.push(`📯 ${shortEsName(b.off[0])}`);
    if (b.food) parts.push(`🍖 ${shortEsName(b.food[0])}`);
    const potion = b.potion || DEFAULT_POTION;
    if (potion) parts.push(`🧪 ${shortEsName(potion[0])}`);
    navigator.clipboard.writeText(parts.join(' / '))
      .then(() => showToast('Build copiada ✔'))
      .catch(() => showToast('No se pudo copiar — copiala manualmente'));
  };

  const actionsRow = document.createElement('div');
  actionsRow.className = 'lib-card-actions';
  actionsRow.appendChild(copyBtn);

  if (b.u && weaponAbilitiesFor(b.u)) {
    const infoBtn = document.createElement('button');
    infoBtn.type = 'button';
    infoBtn.className = 'ghost small lib-info-btn';
    infoBtn.textContent = 'ℹ️ Habilidades';
    infoBtn.title = 'Ver info y habilidades disponibles de esta arma';
    infoBtn.onclick = () => openWeaponInfoModal(b.name, b.u);
    actionsRow.appendChild(infoBtn);
  }
  card.appendChild(actionsRow);

  return card;
}

/* ---------------- "Mis builds" — builds propias del gremio ----------------
   A diferencia del catálogo de abajo (fijo, generado por la herramienta a
   partir de los datos del juego), esta sección la arma cada jugador a mano:
   elegís arma y equipo pieza por pieza (mismo editor con íconos que
   Composición/Solitario — click en cualquier casilla para cambiarla), le
   ponés nombre y etiquetas propias, y arrancás siempre con al menos 1 para
   editar. El botón "+ Agregar build" no tiene límite. Se guarda en este
   navegador; no hay backend compartido en tiempo real (ver nota en la
   sección) — compartir con el resto del gremio se hace exportando el
   archivo y que lo importen, sumando sus builds a las que ya tengan. */
function newCustomBuild(name) {
  return { id: uid(), name: name || 'Mi build', tags: [], customWeapon: null, gear: {} };
}

function parseTagsInput(str) {
  return (str || '')
    .split(',')
    .map(t => t.trim())
    .filter(Boolean)
    .filter((t, i, arr) => arr.findIndex(x => x.toLowerCase() === t.toLowerCase()) === i);
}

function allCustomBuildTags() {
  const set = new Set();
  state.customBuilds.forEach(cb => (cb.tags || []).forEach(t => set.add(t)));
  return [...set].sort((a, b) => a.localeCompare(b, 'es'));
}

let myBuildsFilter = { search: '', tag: 'all' };

function buildCustomBuildCard(cb) {
  const card = document.createElement('div');
  card.className = 'lib-card my-build-card';
  card.style.setProperty('--accent', '#3ecf6e');

  const headRow = document.createElement('div');
  headRow.className = 'my-build-head';
  const title = document.createElement('div');
  title.className = 'lib-card-title my-build-title';
  title.textContent = cb.name;
  title.title = isEditor() ? 'Click para renombrar' : '🔒 Iniciá sesión para renombrar';
  title.onclick = () => {
    if (!requireEditor('renombrar builds')) return;
    const nn = prompt('Nombre para esta build:', cb.name);
    if (nn === null) return;
    cb.name = nn.trim() || cb.name;
    renderPanel();
  };
  headRow.appendChild(title);
  if (state.customBuilds.length > 1) {
    const delBtn = document.createElement('button');
    delBtn.type = 'button';
    delBtn.className = 'my-build-del';
    delBtn.textContent = '🗑';
    delBtn.title = 'Eliminar esta build';
    delBtn.disabled = !isEditor();
    delBtn.onclick = () => {
      if (!requireEditor('eliminar builds')) return;
      if (!confirm(`¿Eliminar la build "${cb.name}"? Esta acción no se puede deshacer.`)) return;
      state.customBuilds = state.customBuilds.filter(x => x.id !== cb.id);
      renderPanel();
    };
    headRow.appendChild(delBtn);
  }
  card.appendChild(headRow);

  const tagsWrap = document.createElement('div');
  tagsWrap.className = 'lib-tags my-build-tags';
  (cb.tags || []).forEach(t => {
    const chip = document.createElement('span');
    chip.className = 'lib-tag neutral my-build-tag';
    chip.textContent = '🏷 ' + t;
    tagsWrap.appendChild(chip);
  });
  const tagBtn = document.createElement('button');
  tagBtn.type = 'button';
  tagBtn.className = 'my-build-tag-add';
  tagBtn.textContent = (cb.tags && cb.tags.length) ? '✎ etiquetas' : '+ etiqueta';
  tagBtn.title = 'Editar etiquetas (separadas por coma) — sirven para buscar esta build después';
  tagBtn.disabled = !isEditor();
  tagBtn.onclick = () => {
    if (!requireEditor('editar etiquetas')) return;
    const nn = prompt('Etiquetas para esta build, separadas por coma (ej: zvz, tank, avalón):', (cb.tags || []).join(', '));
    if (nn === null) return;
    cb.tags = parseTagsInput(nn);
    renderPanel();
  };
  tagsWrap.appendChild(tagBtn);
  card.appendChild(tagsWrap);

  const weapon = cb.customWeapon || MASTER_WEAPONS[0];
  const slot = { gear: cb.gear || (cb.gear = {}), customWeapon: cb.customWeapon };
  const weaponEditableCfg = {
    pieceLabel: 'arma', catalog: WEAPON_PICKER_GROUPS, currentKey: weapon.name, allowNone: false, showReset: false,
    onPick: (key) => {
      const found = MASTER_WEAPONS.find(w => w.name === key);
      if (found) cb.customWeapon = found;
      cb.gear = {};
      renderPanel();
    },
  };
  card.appendChild(buildDoll(weapon, { icon: '⚔️' }, slot, weaponEditableCfg));

  const actionsRow = document.createElement('div');
  actionsRow.className = 'lib-card-actions';
  const copyBtn = document.createElement('button');
  copyBtn.type = 'button';
  copyBtn.className = 'ghost small lib-copy-btn';
  copyBtn.textContent = '📋 Copiar';
  copyBtn.title = 'Copiar esta build como texto para pegar en Discord';
  copyBtn.onclick = () => {
    const parts = [`⚔ ${shortEsName(weapon.name)}`];
    const helm = effectivePiece(slot, weapon, 'helm'); if (helm) parts.push(`🪖 ${shortEsName(helm[0])}`);
    const chest = effectivePiece(slot, weapon, 'chest'); if (chest) parts.push(`👕 ${shortEsName(chest[0])}`);
    const boots = effectivePiece(slot, weapon, 'boots'); if (boots) parts.push(`👢 ${shortEsName(boots[0])}`);
    const cape = effectivePiece(slot, weapon, 'cape'); if (cape) parts.push(`🧣 ${shortEsName(cape[0])}`);
    const off = effectivePiece(slot, weapon, 'off'); if (off) parts.push(`📯 ${shortEsName(off[0])}`);
    const food = effectivePiece(slot, weapon, 'food'); if (food) parts.push(`🍖 ${shortEsName(food[0])}`);
    const potion = effectivePiece(slot, weapon, 'potion'); if (potion) parts.push(`🧪 ${shortEsName(potion[0])}`);
    navigator.clipboard.writeText(`${cb.name}: ` + parts.join(' / '))
      .then(() => showToast('Build copiada ✔'))
      .catch(() => showToast('No se pudo copiar — copiala manualmente'));
  };
  actionsRow.appendChild(copyBtn);
  if (weapon.u && weaponAbilitiesFor(weapon.u)) {
    const infoBtn = document.createElement('button');
    infoBtn.type = 'button';
    infoBtn.className = 'ghost small lib-info-btn';
    infoBtn.textContent = 'ℹ️ Habilidades';
    infoBtn.title = 'Ver info y habilidades disponibles de esta arma';
    infoBtn.onclick = () => openWeaponInfoModal(weapon.name, weapon.u);
    actionsRow.appendChild(infoBtn);
  }
  card.appendChild(actionsRow);

  return card;
}

  function applyMyBuildsFilters() {
    const q = normalizeSearch(searchInput.value);
    let visible = 0;
    entries.forEach(({ el, cb, searchText }) => {
      let ok = true;
      if (myBuildsFilter.tag !== 'all') ok = (cb.tags || []).includes(myBuildsFilter.tag);
      if (ok && q) ok = searchText.includes(q);
      el.style.display = ok ? '' : 'none';
      if (ok) visible++;
    });
    countEl.textContent = `${visible} de ${state.customBuilds.length} builds propias`;
    emptyMsg.style.display = visible ? 'none' : '';
  }

  searchInput.oninput = () => { myBuildsFilter.search = searchInput.value; applyMyBuildsFilters(); };
  applyMyBuildsFilters();

  addBtn.type = 'button';
  addBtn.className = 'small ghost my-build-add-btn';

  addBtn.disabled = !isEditor();
  addBtn.onclick = () => {
    if (!requireEditor('crear builds')) return;
    state.customBuilds.push(newCustomBuild(`Mi build ${state.customBuilds.length + 1}`));
    renderPanel();
  };
  wrap.appendChild(addBtn);

  return wrap;
}

  roleOptions.forEach(opt => {

    pill.type = 'button';
    pill.className = 'lib-pill' + (buildsFilter.role === opt.key ? ' active' : '');
    pill.style.setProperty('--tag-accent', ROLE_ACCENT[opt.key] || '#c8102e');
    pill.innerHTML = `<span>${opt.icon}</span><span>${opt.label}</span>`;
    pill.onclick = () => {
      buildsFilter.role = opt.key;
      rolePills.forEach(p => p.el.classList.toggle('active', p.key === opt.key));
      applyFilters();
    };
    roleRow.appendChild(pill);
    rolePills.push({ key: opt.key, el: pill });
  });
  filterBar.appendChild(roleRow);

  famRow.className = 'lib-filter-row';
  const famLabel = document.createElement('span');
  famLabel.className = 'lib-filter-label';
  famLabel.textContent = 'Tipo de arma:';
  famRow.appendChild(famLabel);
  const famSelect = document.createElement('select');
  famSelect.className = 'lib-family-select';
  const allFamOpt = document.createElement('option');
  allFamOpt.value = 'all'; allFamOpt.textContent = 'Todas las armas';
  famSelect.appendChild(allFamOpt);
  WEAPON_PICKER_GROUPS.forEach(g => {
    const opt = document.createElement('option');
    opt.value = g.label;
    opt.textContent = `${g.label} (${Object.keys(g.entries).length})`;
    famSelect.appendChild(opt);
  });
  famSelect.value = buildsFilter.family;
  famRow.appendChild(famSelect);
  filterBar.appendChild(famRow);

  const resetBtn = document.createElement('button');
  resetBtn.type = 'button';
  resetBtn.className = 'ghost small lib-reset-btn';
  resetBtn.textContent = '✕ Limpiar filtros';
  resetBtn.onclick = () => { buildsFilter = { search: '', role: 'all', family: 'all' }; renderPanel(); };
  filterBar.appendChild(resetBtn);

  wrap.appendChild(filterBar);

  const countEl = document.createElement('div');
  countEl.className = 'lib-count';
  wrap.appendChild(countEl);

  const grid = document.createElement('div');
  grid.className = 'lib-grid';
  const emptyMsg = document.createElement('div');
  emptyMsg.className = 'lib-empty';
  emptyMsg.textContent = 'Ninguna build coincide con esos filtros — probá con otra búsqueda o quitá algún filtro.';
  grid.appendChild(emptyMsg);

  const entries = MASTER_WEAPONS.map(b => {
    const roles = roleMap[b.name] || [];
    const contentTypes = contentTypeMap[b.name] || [];
    const el = buildLibraryCard(b, roles, contentTypes);
    grid.appendChild(el);
    return { el, roles, family: weaponFamilyOf(b.u).label, searchText: normalizeSearch(b.name) };
  });
  wrap.appendChild(grid);

  function applyFilters() {
    buildsFilter.search = searchInput.value;
    buildsFilter.family = famSelect.value;
    const q = normalizeSearch(searchInput.value);
    let visible = 0;
    entries.forEach(({ el, roles, family, searchText }) => {
      let ok = true;
      if (buildsFilter.role === 'none') ok = !roles.length;
      else if (buildsFilter.role !== 'all') ok = roles.includes(buildsFilter.role);
      if (ok && buildsFilter.family !== 'all') ok = family === buildsFilter.family;
      if (ok && q) ok = searchText.includes(q);
      el.style.display = ok ? '' : 'none';
      if (ok) visible++;
    });
    countEl.textContent = `${visible} de ${MASTER_WEAPONS.length} builds`;
    emptyMsg.style.display = visible ? 'none' : '';
  }

  searchInput.oninput = applyFilters;
  famSelect.onchange = applyFilters;
  applyFilters();

  return wrap;
}

/* ---------------- Render: pestaña de Balance ---------------- */
/* Paleta para los avatares de jugador — un color consistente por nombre
   (mismo criterio de tono medio que ROLE_ACCENT) para darle más identidad
   visual a cada fila del balance. */
const AVATAR_PALETTE = ['#d4a017', '#3d7dca', '#2e9e5b', '#9b59b6', '#1fada0', '#c9327a', '#c81e3a'];
function avatarColor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return AVATAR_PALETTE[h % AVATAR_PALETTE.length];
}
function avatarHtml(name, extraClass) {
  return `<span class="balance-avatar${extraClass ? ' ' + extraClass : ''}" style="background:${avatarColor(name)}">${name.charAt(0).toUpperCase()}</span>`;
}

function buildBalancePanel() {
  const wrap = document.createElement('div');
  wrap.className = 'balance-panel';

  const totalBal = state.balances.reduce((s, p) => s + p.balance, 0);
  const positiveCount = state.balances.filter(p => p.balance > 0).length;

  const head = document.createElement('div');
  head.className = 'roster-head';
  head.innerHTML = `<h2>💰 Balance del gremio</h2>`;
  wrap.appendChild(head);

  const stats = document.createElement('div');
  stats.className = 'summary-strip';
  stats.innerHTML = `
    <div class="stat"><b>${state.balances.length}</b>Jugadores registrados</div>
    <div class="stat balance-stat-total"><b>${fmtMoney(totalBal)}</b>Saldo total del gremio</div>
    <div class="stat"><b>${positiveCount}</b>Con saldo a favor</div>
  `;
  wrap.appendChild(stats);

  const addRow = document.createElement('div');
  addRow.className = 'balance-toolbar';
  addRow.innerHTML = `
    <input type="text" id="balNewName" class="player-input" placeholder="Nombre del jugador nuevo...">
    <button type="button" class="ghost" id="balAddPlayerBtn">+ Agregar jugador al balance</button>
  `;
  wrap.appendChild(addRow);
  const nameInput = addRow.querySelector('#balNewName');
  const doAddPlayer = () => {
    if (!requireEditor('agregar jugadores al balance')) return;
    const p = addBalancePlayer(nameInput.value);
    if (p) { renderPanel(); showToast(`${p.name} agregado al balance ✔`); }
    else showToast('Escribí un nombre válido');
  };
  addRow.querySelector('#balAddPlayerBtn').onclick = doAddPlayer;
  nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') doAddPlayer(); });
  // A diferencia del nombre en un casillero de la composición, este campo
  // SÍ requiere sesión — acá se está dando de alta gente nueva en el
  // balance de plata del gremio, no anotándose uno mismo en un rol.
  nameInput.disabled = !isEditor();
  addRow.querySelector('#balAddPlayerBtn').disabled = !isEditor();

  if (!state.balances.length) {
    const empty = document.createElement('div');
    empty.className = 'empty-msg';
    empty.textContent = 'Todavía no agregaste jugadores al balance. Sumá el primero arriba para empezar a registrar saldo.';
    wrap.appendChild(empty);
    return wrap;
  }

  const moveCard = document.createElement('div');
  moveCard.className = 'balance-move-card';
  const playerOptions = state.balances.map(p => `<option value="${p.id}">${p.name} (${fmtMoney(p.balance)})</option>`).join('');
  moveCard.innerHTML = `
    <div class="balance-move-title">💸 Registrar movimiento</div>
    <div class="balance-move-form">
      <select id="balMovePlayer">${playerOptions}</select>
      <input type="number" id="balMoveAmount" placeholder="Monto" min="0" step="1">
      <input type="text" id="balMoveNote" placeholder="Nota (opcional) — ej. loot ZVZ 18/08">
      <button type="button" class="primary small" id="balAddBtn">+ Agregar saldo</button>
      <button type="button" class="ghost small" id="balSubBtn">− Quitar saldo</button>
    </div>
  `;
  wrap.appendChild(moveCard);
  if (!isEditor()) {
    moveCard.querySelector('#balMovePlayer').disabled = true;
    moveCard.querySelector('#balMoveAmount').disabled = true;
    moveCard.querySelector('#balMoveNote').disabled = true;
    moveCard.querySelector('#balAddBtn').disabled = true;
    moveCard.querySelector('#balSubBtn').disabled = true;
  }

  function doMove(sign) {
    if (!requireEditor('registrar movimientos de balance')) return;
    const playerId = moveCard.querySelector('#balMovePlayer').value;
    const amount = Math.abs(Number(moveCard.querySelector('#balMoveAmount').value));
    const note = moveCard.querySelector('#balMoveNote').value;
    if (!amount) { showToast('Ingresá un monto válido'); return; }
    addBalanceMovement(playerId, amount * sign, note);
    renderPanel();
    showToast(sign > 0 ? 'Saldo agregado ✔' : 'Saldo descontado ✔');
  }
  moveCard.querySelector('#balAddBtn').onclick = () => doMove(1);
  moveCard.querySelector('#balSubBtn').onclick = () => doMove(-1);

  const table = document.createElement('div');
  table.className = 'balance-table';
  const tHead = document.createElement('div');
  tHead.className = 'balance-row balance-row-head';
  tHead.innerHTML = `<div>Jugador</div><div>Saldo</div><div>Movs.</div><div></div>`;
  table.appendChild(tHead);

  [...state.balances].sort((a, b) => b.balance - a.balance).forEach(p => {
    const row = document.createElement('div');
    row.className = 'balance-row';
    const cls = p.balance > 0 ? 'positive' : (p.balance < 0 ? 'negative' : '');
    row.innerHTML = `
      <div class="balance-name-cell">${avatarHtml(p.name)}<span class="balance-name">${p.name}</span></div>
      <div class="balance-amount ${cls}">${fmtMoney(p.balance)}</div>
      <div class="balance-count">${p.history.length} mov.</div>
      <div class="balance-actions">
        <button type="button" class="small ghost balHistBtn">Historial</button>
        <button type="button" class="small ghost balDelBtn" title="Quitar jugador del balance">✕</button>
      </div>
    `;
    row.querySelector('.balHistBtn').onclick = () => {
      const hCls = p.balance > 0 ? 'positive' : (p.balance < 0 ? 'negative' : '');
      let itemsHtml;
      if (!p.history.length) {
        itemsHtml = `<div class="empty-msg">Todavía no hay movimientos registrados para ${p.name}.</div>`;
      } else {
        itemsHtml = p.history.map(h => {
          const d = new Date(h.ts);
          const fecha = d.toLocaleDateString('es-ES') + ' · ' + d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
          const iCls = h.delta > 0 ? 'positive' : 'negative';
          const sign = h.delta > 0 ? '+' : '';
          return `
            <div class="bal-hist-item ${iCls}">
              <div class="bal-hist-item-amount">${sign}${fmtMoney(h.delta)}</div>
              <div class="bal-hist-item-meta">
                <span class="bal-hist-date">${fecha}</span>
                ${h.note ? `<span class="bal-hist-note">${h.note}</span>` : ''}
              </div>
            </div>`;
        }).join('');
      }
      const html = `
        <div class="bal-hist-summary">
          ${avatarHtml(p.name, 'large')}
          <div>
            <div class="bal-hist-summary-name">${p.name}</div>
            <div class="bal-hist-summary-amount ${hCls}">${fmtMoney(p.balance)}</div>
          </div>
        </div>
        <div class="bal-hist-list">${itemsHtml}</div>
      `;
      openGuideModal('Historial de movimientos', html);
    };
    row.querySelector('.balDelBtn').disabled = !isEditor();
    row.querySelector('.balDelBtn').onclick = () => {
      if (!requireEditor('quitar jugadores del balance')) return;
      if (!confirm(`¿Quitar a ${p.name} del balance? Se perderá su historial.`)) return;
      removeBalancePlayer(p.id);
      renderPanel();
    };
    table.appendChild(row);
  });
  wrap.appendChild(table);

  return wrap;
}

function serializeState() {
  return JSON.stringify({
    version: 2,
    guildName: state.guildName,
    mode: state.mode,
    lastCompMode: state.lastCompMode,
    lastSoloMode: state.lastSoloMode,
    lastAvalonMode: state.lastAvalonMode,
    zvzVariant: state.zvzVariant,
    comps: state.comps,
    balances: state.balances,
    soloOverrides: state.soloOverrides,
    customBuilds: state.customBuilds,
    /* Habilidades elegidas por arma (ver ABILITY_PICK_KEY) — viven en una
       clave de localStorage aparte, pero se suman acá para que el respaldo
       de "Exportar todo" sea realmente TODO lo que se haya hecho en la
       herramienta, no solo las composiciones. */
    abilityPicks: loadAbilityPicks(),
  }, null, 2);
}

/* Aplica un objeto de estado (exportado con serializeState, o leído del
   localStorage del navegador) al estado actual — se usa tanto al importar un
   archivo .json a mano como al recuperar el autoguardado al abrir la
   página. Tolera datos viejos/incompletos (de una versión anterior de la
   herramienta) sin romper: todo lo que falte se queda con su valor actual. */
function applyState(data) {
  if (!data || typeof data !== 'object') return;
  state.guildName = data.guildName || state.guildName;
  state.mode = data.mode || state.mode;
  state.zvzVariant = (data.zvzVariant && ZVZ_VARIANTS[data.zvzVariant]) ? data.zvzVariant : state.zvzVariant;
  if (data.comps && typeof data.comps === 'object') {
    COMPOSABLE_MODES.forEach(m => {
      const incoming = data.comps[m];
      if (incoming && Array.isArray(incoming.list) && incoming.list.length) {
        state.comps[m] = {
          active: Math.min(Math.max(0, incoming.active || 0), incoming.list.length - 1),
          list: incoming.list,
        };
      }
    });
  } else if (data.zvzGroups || data.grupal || data.estatica || data.avalon_azul || data.avalon_dorado) {
    // Respaldo de una versión anterior (sin builds con nombre) — se migra
    // cada roster suelto a una lista de 1 sola build llamada "Grupo N"/"1".
    if (Array.isArray(data.zvzGroups) && data.zvzGroups.length) {
      state.comps.zvz = {
        active: Math.min(Math.max(0, data.zvzActive || 0), data.zvzGroups.length - 1),
        list: data.zvzGroups.map((roster, i) => ({ id: uid(), name: `Grupo ${i + 1}`, roster })),
      };
    }
    ['grupal', 'estatica', 'avalon_azul', 'avalon_dorado'].forEach(m => {
      if (Array.isArray(data[m]) && data[m].length) {
        state.comps[m] = { active: 0, list: [{ id: uid(), name: `${MODES[m].label} 1`, roster: data[m] }] };
      }
    });
  }
  state.lastCompMode = COMP_MODES.includes(state.mode) ? state.mode : (data.lastCompMode || state.lastCompMode || 'zvz');
  state.lastSoloMode = SOLO_MODES.includes(state.mode) ? state.mode : (data.lastSoloMode || state.lastSoloMode || 'solo_pve');
  state.lastAvalonMode = AVALON_MODES.includes(state.mode) ? state.mode : (data.lastAvalonMode || state.lastAvalonMode || 'avalon_azul');
  state.balances = data.balances || state.balances;
  state.soloOverrides = data.soloOverrides || state.soloOverrides;
  /* customBuilds se SUMA en vez de reemplazar — a diferencia del resto del
     estado, esto es lo que permite que el gremio junte builds de varios
     archivos exportados sin perder las propias en cada importación. Se
     descartan por id repetido (ya la tenías) para poder reimportar el mismo
     archivo sin duplicar. */
  if (Array.isArray(data.customBuilds) && data.customBuilds.length) {
    const existingIds = new Set(state.customBuilds.map(cb => cb.id));
    data.customBuilds.forEach(cb => {
      if (cb && cb.id && !existingIds.has(cb.id)) {
        state.customBuilds.push(cb);
        existingIds.add(cb.id);
      }
    });
  }
  /* abilityPicks también se SUMA (no reemplaza) — mismo criterio que
     customBuilds: importar un respaldo no debe borrar habilidades que ya
     habías elegido en este dispositivo para otras armas. */
  if (data.abilityPicks && typeof data.abilityPicks === 'object') {
    try {
      const current = loadAbilityPicks();
      Object.keys(data.abilityPicks).forEach(weaponU => {
        current[weaponU] = Object.assign({}, current[weaponU], data.abilityPicks[weaponU]);
      });
      localStorage.setItem(ABILITY_PICK_KEY, JSON.stringify(current));
    } catch (err) { /* localStorage no disponible */ }
  }
}

/* ---------------- Autoguardado en el navegador ----------------
   El autoguardado en localStorage de este navegador queda SIEMPRE activo,
   esté o no Firebase configurado: es lo que hace que al cerrar la pestaña
   y volver a abrirla todo siga como estaba, y además sirve de respaldo por
   si en algún momento no hay conexión con Firebase. Cuando FIREBASE_ENABLED
   está activo, cada guardado además dispara (con un pequeño debounce) una
   sincronización hacia el resto del gremio — ver scheduleSyncPush() más
   abajo, junto al resto de la sección de Firebase. Si Firebase no está
   configurado, ese paso extra simplemente no hace nada y esto se comporta
   exactamente como el autoguardado 100% local de siempre: por eso queda
   además el botón "Exportar" para bajar un respaldo en .json a mano. */
const STORAGE_KEY = 'pvpx_albion_comp_state_v2';
function saveToStorage() {
  try { localStorage.setItem(STORAGE_KEY, serializeState()); } catch (err) { /* localStorage no disponible (modo privado, cuota llena, etc.) — se sigue usando la app sin autoguardado */ }
  scheduleSyncPush();
}
function loadFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (err) {
    return null;
  }
}

function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------------- Historial de respaldos (solo lo ve "admin") ----------------
   Cada vez que alguien CON SESIÓN INICIADA usa "⬇ Exportar todo", además
   de bajar el archivo se guarda una copia para que "admin" la pueda
   revisar y volver a bajar después desde la pestaña "Respaldos".

   Con FIREBASE_ENABLED, esa copia se guarda en Firebase (compartida: admin
   la ve sin importar desde qué dispositivo se haya exportado). Sin
   Firebase configurado, se guarda en el localStorage de este navegador
   nomás — el mismo comportamiento de siempre. Se guardan hasta
   BACKUP_HISTORY_MAX copias — al superarlo se descarta la más vieja. */
const BACKUP_HISTORY_KEY = 'pvpx_backup_history';
const BACKUP_HISTORY_MAX = 30;

// Cache en memoria de los respaldos de Firebase, mantenida al día por el
// listener de initFirebaseBackupsListener(); null = todavía no llegó el
// primer snapshot (Firebase tarda un toque en responder la primera vez).
let firebaseBackupsCache = null;
let backupsListenerAttached = false;

function initFirebaseBackupsListener() {
  if (!FIREBASE_ENABLED || backupsListenerAttached) return;
  const db = getFirebaseDb();
  if (!db) return;
  backupsListenerAttached = true;
  db.ref('backups').on('value', (snap) => {
    const val = snap.val() || {};
    firebaseBackupsCache = Object.keys(val)
      .map(id => Object.assign({ id }, val[id]))
      .sort((a, b) => (b.ts || 0) - (a.ts || 0));
    // Si justo se está mirando la pestaña Respaldos, refrescarla en vivo
    // (por ejemplo, cuando otro dispositivo acaba de exportar).
    if (state.mode === 'backups') renderPanel();
  }, (err) => {
    console.error('No se pudo leer el historial de respaldos de Firebase:', err);
  });
}

function loadBackupHistory() {
  if (FIREBASE_ENABLED) return firebaseBackupsCache || [];
  try {
    const raw = localStorage.getItem(BACKUP_HISTORY_KEY);
    const list = raw ? JSON.parse(raw) : [];
    return Array.isArray(list) ? list : [];
  } catch (err) { return []; }
}
function saveBackupSnapshot(content) {
  const entry = {
    ts: Date.now(),
    user: currentAuthUser() || '—',
    guildName: state.guildName || 'PVPX',
    content,
  };
  if (FIREBASE_ENABLED) {
    const db = getFirebaseDb();
    if (!db) return;
    db.ref('backups').push(entry).catch(err => {
      console.error('No se pudo guardar el respaldo en Firebase:', err);
    });
    // Poda las copias más viejas por encima de BACKUP_HISTORY_MAX — best
    // effort, no bloquea ni condiciona el guardado de arriba.
    db.ref('backups').once('value').then(snap => {
      const val = snap.val() || {};
      const ids = Object.keys(val).sort((a, b) => (val[a].ts || 0) - (val[b].ts || 0));
      while (ids.length > BACKUP_HISTORY_MAX) db.ref('backups/' + ids.shift()).remove();
    }).catch(() => {});
    return;
  }
  try {
    const list = loadBackupHistory();
    list.unshift(Object.assign({ id: uid() }, entry));
    while (list.length > BACKUP_HISTORY_MAX) list.pop();
    localStorage.setItem(BACKUP_HISTORY_KEY, JSON.stringify(list));
  } catch (err) { /* localStorage lleno o no disponible — no rompe el export en sí */ }
}
function deleteBackupSnapshot(id) {
  if (FIREBASE_ENABLED) {
    const db = getFirebaseDb();
    if (db) db.ref('backups/' + id).remove().catch(err => console.error('No se pudo borrar el respaldo:', err));
    return;
  }
  try {
    const list = loadBackupHistory().filter(b => b.id !== id);
    localStorage.setItem(BACKUP_HISTORY_KEY, JSON.stringify(list));
  } catch (err) {}
}
function clearBackupHistory() {
  if (FIREBASE_ENABLED) {
    const db = getFirebaseDb();
    if (db) db.ref('backups').remove().catch(err => console.error('No se pudo vaciar el historial:', err));
    return;
  }
  try { localStorage.removeItem(BACKUP_HISTORY_KEY); } catch (err) {}
}

/* ---------------- Render: pestaña "Respaldos" (solo la ve admin) ----------------
   Lista cada copia de "⬇ Exportar todo" hecha con sesión iniciada EN ESTE

    : 'Cada vez que alguien exporta con "⬇ Exportar todo" estando logueado (pvpx o admin), acá queda una copia — pensado para cuando se está iterando la página seguido y conviene tener respaldos a mano. <b>Es local a este navegador</b>: si alguien exporta desde su propio celular o PC, esa copia se guarda EN ESE dispositivo, no aparece acá.';
  wrap.appendChild(note);

  const countEl = document.createElement('div');
  const fbUnreachable = FIREBASE_ENABLED && !getFirebaseDb();
  const loading = FIREBASE_ENABLED && !fbUnreachable && firebaseBackupsCache === null;
  countEl.style.cssText = 'font-size:13px;color:var(--grey-dim);';
  countEl.textContent = fbUnreachable

  headRow.appendChild(countEl);

      const msg = FIREBASE_ENABLED
        ? '¿Borrar TODO el historial de respaldos compartido del gremio? Los archivos que ya se bajaron a algún PC/celular no se ven afectados.'
        : '¿Borrar TODO el historial de respaldos guardado en este navegador? Los archivos que ya bajaste a tu PC/celular no se ven afectados.';
      if (!confirm(msg)) return;
      clearBackupHistory();
      renderPanel();
      showToast('Historial de respaldos vaciado ✔');
    };
    headRow.appendChild(clearBtn);
  }
  wrap.appendChild(headRow);

  if (fbUnreachable) {
    const errMsg = document.createElement('div');
    errMsg.className = 'empty-msg';
    errMsg.textContent = 'No se pudo conectar con la base de datos en vivo ahora mismo — revisá tu conexión y volvé a intentar en un rato. Mientras tanto no se puede ver el historial compartido de respaldos.';
    wrap.appendChild(errMsg);
    return wrap;
  }
  if (loading) {
    const loadingMsg = document.createElement('div');
    loadingMsg.className = 'empty-msg';
    loadingMsg.textContent = 'Conectando con la base de datos en vivo…';
    wrap.appendChild(loadingMsg);
    return wrap;
  }

  if (!list.length) {
    const empty = document.createElement('div');
    empty.className = 'empty-msg';
    empty.textContent = FIREBASE_ENABLED
      ? 'Todavía no hay respaldos guardados — van a ir apareciendo acá cada vez que pvpx o admin usen "⬇ Exportar todo", desde cualquier dispositivo.'
      : 'Todavía no hay respaldos guardados — van a ir apareciendo acá cada vez que pvpx o admin usen "⬇ Exportar todo" en este navegador.';
    wrap.appendChild(empty);
    return wrap;
  }

  const table = document.createElement('div');
  table.className = 'backup-list';
  list.forEach(b => {
    const row = document.createElement('div');
    row.className = 'backup-row';
    const d = new Date(b.ts);
    const fecha = d.toLocaleDateString('es-ES') + ' · ' + d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    const sizeKb = (new Blob([b.content]).size / 1024).toFixed(1);
    const userLabel = AUTH_USERS[b.user] ? AUTH_USERS[b.user].label : b.user;
    row.innerHTML = `
      <div class="backup-row-main">

      </div>

      downloadFile(`pvpx_respaldo_${guildSafe}_${fechaArchivo}.json`, b.content, 'application/json');
    };
    row.querySelector('.backupDelBtn').onclick = () => {
      if (!confirm('¿Quitar este respaldo del historial? (no afecta al archivo si ya lo bajaste)')) return;
      deleteBackupSnapshot(b.id);
      renderPanel();
    };
    table.appendChild(row);
  });
  wrap.appendChild(table);

  return wrap;
}

function textReport() {
  const lines = [];
  lines.push(`═══ ${state.guildName || 'PVPX'} — Composición Albion Online ═══`);
  lines.push('');
  function rosterBlock(title, roster, max) {
    lines.push(`### ${title} (${roster.length}/${max})`);
    roster.forEach((s, i) => {
      const def = ROLES[s.role];
      const w = s.customWeapon || def.weapons[s.weaponIdx] || def.weapons[0];
      const name = s.player.trim() || '— sin asignar —';
      const pieces = [
        effectivePiece(s, w, 'helm'),
        effectivePiece(s, w, 'chest'),
        effectivePiece(s, w, 'boots'),
        effectivePiece(s, w, 'cape'),
        effectivePiece(s, w, 'off'),
        effectivePiece(s, w, 'food'),
        effectivePiece(s, w, 'potion'),
      ];
      const gear = pieces.filter(Boolean).map(p => p[0]).join(' / ');
      lines.push(`${i + 1}. ${def.icon} ${def.label} | ${w.name}${gear ? ' [' + gear + ']' : ''} | ${name}`);
    });
    lines.push('');
  }
  if (state.mode === 'zvz') {
    lines.push(`Doctrina ZVZ: ${ZVZ_VARIANTS[state.zvzVariant].label}`);
    lines.push('');
    state.comps.zvz.list.forEach(entry => rosterBlock(`ZVZ — ${entry.name}`, entry.roster, 20));
  } else if (COMPOSABLE_MODES.includes(state.mode)) {
    const bucket = state.comps[state.mode];
    const entry = bucket.list[bucket.active];
    rosterBlock(`${MODES[state.mode].label} — ${entry.name}`, entry.roster, MODES[state.mode].max);
  } else if (SOLO_MODES.includes(state.mode)) {
    lines.push(`### Builds en solitario — ${MODES[state.mode].label}`);
    lines.push('');
    SOLO_BUILDS[state.mode].forEach((b, i) => {
      const ov = soloOverrideFor(b);
      const weapon = ov.weapon || b.weapon;
      const slot = { gear: ov.gear };
      const pieces = [
        effectivePiece(slot, weapon, 'helm'),
        effectivePiece(slot, weapon, 'chest'),
        effectivePiece(slot, weapon, 'boots'),
        effectivePiece(slot, weapon, 'cape'),
        effectivePiece(slot, weapon, 'off'),
      ];
      const gear = pieces.filter(Boolean).map(p => p[0]).join(' / ');
      lines.push(`${i + 1}. ${b.icon} ${b.label} | ${weapon.name}${gear ? ' [' + gear + ']' : ''}`);
    });
    lines.push('');
  } else if (state.mode === 'balance') {
    const total = state.balances.reduce((s, p) => s + p.balance, 0);
    lines.push(`### Balance de jugadores (saldo total: ${fmtMoney(total)})`);
    [...state.balances].sort((a, b) => b.balance - a.balance).forEach((p, i) => {
      lines.push(`${i + 1}. ${p.name} — ${fmtMoney(p.balance)}`);
    });
    lines.push('');
  }
  return lines.join('\n');
}

/* ---------------- Invitación para Discord (imagen + texto) ----------------
   Genera una tarjeta de invitación con la build actual, lista para pegar en
   Discord y que la gente se anote: arriba el título del evento y la lista
   de equipo por rol en texto (arma / pecho / casco / botas), abajo un grid
   visual con los íconos reales de cada pieza (vía Render Service de Albion;
   si algún ícono no carga, se usa un emoji de respaldo — la imagen nunca se
   rompe por eso). Se puede copiar la imagen directo al portapapeles (para
   pegar con Ctrl+V en el chat de Discord), descargarla como PNG, o copiar
   solo el texto. */

/* Roster + metadatos de la build actualmente mostrada, sin importar la
   pestaña (ZVZ toma el grupo activo, no todos los grupos a la vez — cada
   grupo se anuncia por separado). Devuelve null en Solitario/Balance,
   donde no aplica una "build" para invitar gente. */
function currentInvitationRoster() {
  if (state.mode === 'zvz') {
    const bucket = state.comps.zvz;
    const entry = bucket.list[bucket.active];
    return entry ? { entry, roster: entry.roster, label: `ZVZ · ${ZVZ_VARIANTS[state.zvzVariant].label}` } : null;
  }
  if (COMPOSABLE_MODES.includes(state.mode)) {
    const bucket = state.comps[state.mode];
    const entry = bucket.list[bucket.active];
    return entry ? { entry, roster: entry.roster, label: MODES[state.mode].label } : null;
  }
  return null;
}

function invitationGearLine(slot) {
  const def = ROLES[slot.role];
  const w = slot.customWeapon || def.weapons[slot.weaponIdx] || def.weapons[0];
  const helm = effectivePiece(slot, w, 'helm');
  const chest = effectivePiece(slot, w, 'chest');
  const boots = effectivePiece(slot, w, 'boots');
  const cape = effectivePiece(slot, w, 'cape');
  const food = effectivePiece(slot, w, 'food');
  const potion = effectivePiece(slot, w, 'potion');
  const parts = [shortEsName(w.name), chest && chest[0], helm && helm[0], boots && boots[0]].filter(Boolean);
  return { def, weapon: w, helm, chest, boots, cape, food, potion, text: parts.join(' / ') };
}

/* Convierte el valor de un <input type="datetime-local"> — interpretado
   como la hora LOCAL de quien arma la invitación, que es como el navegador
   entrega ese valor — a un texto legible en horario UTC, para que
   cualquiera del gremio pueda convertirlo a su propio huso sin ambigüedad
   ni depender de que todos estén en la misma zona horaria. */
function formatWhenUTC(datetimeLocalValue) {
  if (!datetimeLocalValue) return '';
  const d = new Date(datetimeLocalValue);
  if (isNaN(d.getTime())) return '';
  try {
    const fmt = new Intl.DateTimeFormat('es-AR', {
      weekday: 'short', day: '2-digit', month: 'short', year: 'numeric',
      hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'UTC',
    });
    return `${fmt.format(d)} UTC`;
  } catch (err) {
    return `${d.toISOString().slice(0, 16).replace('T', ' ')} UTC`;
  }
}

function invitationTextBlock(title, when, notes, roster) {

  if (notes) { lines.push(''); lines.push(`📌 ${notes}`); }
  lines.push('');
  lines.push('✅ ¡Anotate respondiendo a este mensaje con tu rol y arma disponible!');
  return lines.join('\n');
}

/* ---------------- Sincronización en vivo del estado del gremio (opcional) ---
   Reutiliza el mismo FIREBASE_CONFIG/getFirebaseDb de arriba (pensado en un
   principio solo para publicar invitaciones en Discord) para sincronizar en
   vivo TODO el estado compartido del gremio entre todos los dispositivos

   .json a mano para que todos vean lo mismo — cada cambio de alguien con
   sesión iniciada se ve reflejado en las demás pantallas casi al instante.

   Qué se sincroniza (y por qué eso, no más):
   - guildName, doctrina ZVZ (zvzVariant), composiciones (comps), balance
     de plata (balances), overrides de equipo en Solitario (soloOverrides)
     y "Mis builds" (customBuilds) — todo dato que el gremio arma en
     conjunto y tiene sentido que todos vean igual.
   NO se sincroniza (queda 100% local a cada dispositivo, a propósito):
   - en qué pestaña estás parado (mode/lastCompMode/lastSoloMode/
     lastAvalonMode) — si no, con que alguien cambie de pestaña en su
     celular le saltaría la pantalla a todos los demás;
   - las habilidades elegidas por arma (ABILITY_PICK_KEY) — es elección
     personal de cada uno, ver el comentario ahí arriba;
   - la sesión iniciada (AUTH_KEY) — cada dispositivo inicia sesión aparte.

   Si FIREBASE_CONFIG no está completo (FIREBASE_ENABLED=false, el caso por
   defecto), toda esta sección queda inactiva sin tocar nada más: la
   herramienta sigue funcionando exactamente igual que siempre, 100% local
   a este navegador, con Exportar/Importar como única forma de pasar datos
   entre dispositivos — igual que antes de que existiera esta sección. */
const SYNC_FIELDS = ['guildName', 'zvzVariant', 'comps', 'balances', 'soloOverrides', 'customBuilds'];
let suppressSyncPush = false;
let syncPushTimer = null;
let lastPushedSyncJSON = null;
let syncListenerAttached = false;
/* Se pone en true recién cuando llega el PRIMER snapshot de Firebase (o se
   confirma que la base está vacía) — hasta entonces, scheduleSyncPush() no
   manda nada. Esto evita un bug real: si se dejara subir apenas carga la
   página, en una conexión lenta el primer autoguardado (con la copia local
   de ESTE dispositivo, que puede estar vieja) podía llegar a subirse ANTES
   de que llegara la versión compartida real — pisándola por completo. Con
   este freno, este dispositivo primero se pone al día con lo que ya había,
   y solo después empieza a mandar sus propios cambios. */
let syncReady = false;

function buildSyncPayload() {
  const payload = {};
  SYNC_FIELDS.forEach(k => { payload[k] = state[k]; });
  return payload;
}

/* Aplica un snapshot recibido de Firebase — a diferencia de applyState()
   (pensada para IMPORTAR un archivo a mano, donde customBuilds se suma
   para no perder lo propio), acá Firebase es la fuente de verdad del
   gremio: se reemplaza cada campo tal cual llega, borrados incluidos, para
   que este dispositivo quede en espejo exacto de lo que hay en la nube. */
function applyRemoteState(data) {
  if (!data || typeof data !== 'object') return;
  suppressSyncPush = true;
  try {
    if (typeof data.guildName === 'string' && data.guildName.trim()) state.guildName = data.guildName;
    if (data.zvzVariant && ZVZ_VARIANTS[data.zvzVariant]) state.zvzVariant = data.zvzVariant;
    if (data.comps && typeof data.comps === 'object') {
      COMPOSABLE_MODES.forEach(m => {
        if (data.comps[m] && Array.isArray(data.comps[m].list)) state.comps[m] = data.comps[m];
      });
    }
    if (Array.isArray(data.balances)) state.balances = data.balances;
    if (data.soloOverrides && typeof data.soloOverrides === 'object') state.soloOverrides = data.soloOverrides;
    if (Array.isArray(data.customBuilds)) state.customBuilds = data.customBuilds;
    updateGuildBranding();
    renderAll();
  } finally {
    // El renderAll() de arriba ya disparó saveToStorage() → scheduleSyncPush(),
    // pero quedó frenado por suppressSyncPush; acá se marca este payload
    // como "ya sincronizado" para no reenviarlo de eco en cuanto se libere.
    lastPushedSyncJSON = JSON.stringify(buildSyncPayload());
    suppressSyncPush = false;
  }
}

function pushSyncStateNow() {
  const db = getFirebaseDb();
  if (!db) return;
  const payload = buildSyncPayload();
  const json = JSON.stringify(payload);
  if (json === lastPushedSyncJSON) return; // sin cambios reales desde el último envío
  lastPushedSyncJSON = json;
  db.ref('guildState').set(payload).catch(err => {
    console.error('No se pudo sincronizar con Firebase:', err);
  });
}

function scheduleSyncPush() {
  if (!FIREBASE_ENABLED || suppressSyncPush || !syncReady) return;
  clearTimeout(syncPushTimer);
  syncPushTimer = setTimeout(pushSyncStateNow, 500);
}

/* Se conecta una sola vez, llamado desde DOMContentLoaded. El primer
   snapshot decide el arranque: si Firebase ya tenía datos del gremio
   (caso normal), este dispositivo los adopta; si Firebase está vacío
   (recién configurado), este dispositivo sube lo que ya tenía como punto
   de partida. Hasta que ese primer snapshot llega (o falla), scheduleSyncPush()
   queda frenado por syncReady — ver el comentario ahí arriba. De ahí en
   más, cualquier cambio que llegue de OTRO dispositivo se aplica en vivo
   sin recargar la página. */
function initFirebaseSync() {
  if (!FIREBASE_ENABLED || syncListenerAttached) return;
  const db = getFirebaseDb();
  if (!db) return;
  syncListenerAttached = true;
  let first = true;
  db.ref('guildState').on('value', (snap) => {
    const data = snap.val();
    if (first) {
      first = false;
      if (data) applyRemoteState(data);
      else pushSyncStateNow();
      syncReady = true;
      return;
    }
    applyRemoteState(data);
  }, (err) => {
    console.error('Sincronización con Firebase interrumpida:', err);
  });
}

function genEventId() {
  return 'evt_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
