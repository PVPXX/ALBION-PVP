  const headRow = document.createElement('div');
  headRow.className = 'my-build-head';
  const title = document.createElement('div');
  title.className = 'lib-card-title my-build-title';
  title.textContent = cb.name;
  title.title = isEditor() ? 'Click para renombrar' : '🔒 Iniciá sesión para renombrar';
  title.onclick = () => {
    if (!requireEditor('renombrar builds')) return;
    const nn = prompt('Nombre para esta build:', cb.name);
    if (nn === null) return;
    cb.name = nn.trim() || cb.name;
    renderPanel();
  };
  headRow.appendChild(title);

  const dupBtn = document.createElement('button');
  dupBtn.type = 'button';
  dupBtn.className = 'my-build-del';
  dupBtn.textContent = '⧉';
  dupBtn.title = 'Duplicar esta build';
  dupBtn.disabled = !isEditor();
  dupBtn.onclick = () => {
    if (!requireEditor('duplicar builds')) return;
    const clone = { id: uid(), name: `${cb.name} (copia)`, tags: (cb.tags || []).slice(), type: 'solo', customWeapon: cb.customWeapon || null, gear: Object.assign({}, cb.gear || {}) };
    const idx = state.customBuilds.indexOf(cb);
    state.customBuilds.splice(idx + 1, 0, clone);
    renderPanel();
    showToast('Build duplicada ✔');
  };
  headRow.appendChild(dupBtn);

  const delBtn = document.createElement('button');
  delBtn.type = 'button';
  delBtn.className = 'my-build-del';
  delBtn.textContent = '🗑';
  delBtn.title = 'Eliminar esta build';
  delBtn.disabled = !isEditor();
  delBtn.onclick = () => {
    if (!requireEditor('eliminar builds')) return;
    if (!confirm(`¿Eliminar la build "${cb.name}"? Esta acción no se puede deshacer.`)) return;
    state.customBuilds = state.customBuilds.filter(x => x.id !== cb.id);
    renderPanel();
  };
  headRow.appendChild(delBtn);
  card.appendChild(headRow);

  const tagsWrap = document.createElement('div');
  tagsWrap.className = 'lib-tags my-build-tags';
  (cb.tags || []).forEach(t => {
    const chip = document.createElement('span');
    chip.className = 'lib-tag neutral my-build-tag';
    chip.textContent = '🏷 ' + t;
    tagsWrap.appendChild(chip);
  });
  const tagBtn = document.createElement('button');
  tagBtn.type = 'button';
  tagBtn.className = 'my-build-tag-add';
  tagBtn.textContent = (cb.tags && cb.tags.length) ? '✎ etiquetas' : '+ etiqueta';
  tagBtn.title = 'Editar etiquetas (separadas por coma) — sirven para buscar esta build después';
  tagBtn.disabled = !isEditor();
  tagBtn.onclick = () => {
    if (!requireEditor('editar etiquetas')) return;
    const nn = prompt('Etiquetas para esta build, separadas por coma (ej: zvz, tank, avalón):', (cb.tags || []).join(', '));
    if (nn === null) return;
    cb.tags = parseTagsInput(nn);
    renderPanel();
  };
  tagsWrap.appendChild(tagBtn);
  card.appendChild(tagsWrap);

  const weapon = cb.customWeapon || MASTER_WEAPONS[0];
  const slot = { gear: cb.gear || (cb.gear = {}), customWeapon: cb.customWeapon };
  const weaponEditableCfg = {
    pieceLabel: 'arma', catalog: WEAPON_PICKER_GROUPS, currentKey: weapon.name, allowNone: false, showReset: false,
    onPick: (key) => {
      const found = MASTER_WEAPONS.find(w => w.name === key);
      if (found) cb.customWeapon = found;
      cb.gear = {};
      renderPanel();
    },
  };
  card.appendChild(buildDoll(weapon, { icon: '⚔️' }, slot, weaponEditableCfg));

  card.appendChild(buildSoloStatsChart(computeSoloStats(weapon, slot), '#3ecf6e'));

  const actionsRow = document.createElement('div');
  actionsRow.className = 'lib-card-actions';
  const copyBtn = document.createElement('button');
  copyBtn.type = 'button';
  copyBtn.className = 'ghost small lib-copy-btn';
  copyBtn.textContent = '📋 Copiar';
  copyBtn.title = 'Copiar esta build como texto para pegar en Discord';
  copyBtn.onclick = () => {
    const parts = [`⚔ ${shortEsName(weapon.name)}`];
    const helm = effectivePiece(slot, weapon, 'helm'); if (helm) parts.push(`🪖 ${shortEsName(helm[0])}`);
    const chest = effectivePiece(slot, weapon, 'chest'); if (chest) parts.push(`👕 ${shortEsName(chest[0])}`);
    const boots = effectivePiece(slot, weapon, 'boots'); if (boots) parts.push(`👢 ${shortEsName(boots[0])}`);
    const cape = effectivePiece(slot, weapon, 'cape'); if (cape) parts.push(`🧣 ${shortEsName(cape[0])}`);
    const off = effectivePiece(slot, weapon, 'off'); if (off) parts.push(`📯 ${shortEsName(off[0])}`);
    const food = effectivePiece(slot, weapon, 'food'); if (food) parts.push(`🍖 ${shortEsName(food[0])}`);
    const potion = effectivePiece(slot, weapon, 'potion'); if (potion) parts.push(`🧪 ${shortEsName(potion[0])}`);
    navigator.clipboard.writeText(`${cb.name}: ` + parts.join(' / '))
      .then(() => showToast('Build copiada ✔'))
      .catch(() => showToast('No se pudo copiar — copiala manualmente'));
  };
  actionsRow.appendChild(copyBtn);
  if (weapon.u && weaponAbilitiesFor(weapon.u)) {
    const infoBtn = document.createElement('button');
    infoBtn.type = 'button';
    infoBtn.className = 'ghost small lib-info-btn';
    infoBtn.textContent = 'ℹ️ Habilidades';
    infoBtn.title = 'Ver info y habilidades disponibles de esta arma';
    infoBtn.onclick = () => openWeaponInfoModal(weapon.name, weapon.u);
    actionsRow.appendChild(infoBtn);
  }
  card.appendChild(actionsRow);

  return card;
}

/* Paleta para los avatares de jugador — un color consistente por nombre
   (mismo criterio de tono medio que ROLE_ACCENT) para darle más identidad
   visual a cada fila del balance. */
const AVATAR_PALETTE = ['#d4a017', '#3d7dca', '#2e9e5b', '#9b59b6', '#1fada0', '#c9327a', '#c81e3a'];
function avatarColor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return AVATAR_PALETTE[h % AVATAR_PALETTE.length];
}
function avatarHtml(name, extraClass) {
  return `<span class="balance-avatar${extraClass ? ' ' + extraClass : ''}" style="background:${avatarColor(name)}">${name.charAt(0).toUpperCase()}</span>`;
}

/* ---------------- Exportar / Importar ---------------- */
function serializeState() {
  return JSON.stringify({
    version: 2,
    guildName: state.guildName,
    mode: state.mode,
    balances: state.balances,
    customBuilds: state.customBuilds,
    migratedGroupBuilds: state.migratedGroupBuilds,
    /* Habilidades elegidas por arma (ver ABILITY_PICK_KEY) — viven en una
       clave de localStorage aparte, pero se suman acá para que el respaldo
       de "Exportar todo" sea realmente TODO lo que se haya hecho en la
       herramienta, no solo las builds. */
    abilityPicks: loadAbilityPicks(),
  }, null, 2);
}

/* ---------------- Migración de datos viejos a Builds ----------------
   Antes de unificar todo en la pestaña Builds, Composición/Avalón guardaban
   rosters en `comps` (por modalidad) y Solitario en `soloOverrides` (por
   build fija). Esta migración corre UNA sola vez (ver state.migratedGroupBuilds,
   un campo sincronizado) y convierte esos datos viejos en customBuilds
   nuevos, para que ninguna composición ni build en solitario que el gremio
   ya tenía guardada desaparezca con la actualización. */

/* Normaliza CUALQUIERA de los dos formatos viejos de `comps` que llegó a
   existir (con builds con nombre, o el bien viejo de un solo roster suelto
   por modalidad) a una única forma { modo: { list: [...] } }, o null si no
   hay nada de eso en `data`. */
function normalizeLegacyComps(data) {
  if (data.comps && typeof data.comps === 'object') return data.comps;
  if (data.zvzGroups || data.grupal || data.estatica || data.avalon_azul || data.avalon_dorado) {
    const out = {};
    if (Array.isArray(data.zvzGroups) && data.zvzGroups.length) {
      out.zvz = { list: data.zvzGroups.map((roster, i) => ({ id: uid(), name: `Grupo ${i + 1}`, roster })) };
    }
    ['grupal', 'estatica', 'avalon_azul', 'avalon_dorado'].forEach(m => {
      if (Array.isArray(data[m]) && data[m].length) {
        out[m] = { list: [{ id: uid(), name: `${m} 1`, roster: data[m] }] };
      }
    });
    return out;
  }
  return null;
}

const LEGACY_MODE_LABELS = { zvz: 'ZVZ', grupal: 'Grupales', estatica: 'Estática', avalon_azul: 'Avalón Azul', avalon_dorado: 'Avalón Dorado' };

/* Devuelve la lista de customBuilds NUEVOS (con id nuevo) que representan
   todo lo que hubiera en `data.comps`/`data.zvzGroups`/etc. y en
   `data.soloOverrides` — no toca `state` para nada, es pura. */
function migrateLegacyCompsAndSolo(data) {
  const out = [];
  const legacyComps = normalizeLegacyComps(data);
  if (legacyComps) {
    Object.keys(LEGACY_MODE_LABELS).forEach(mode => {
      const bucket = legacyComps[mode];
      if (!bucket || !Array.isArray(bucket.list)) return;
      bucket.list.forEach(entry => {
        if (!entry || !Array.isArray(entry.roster)) return;
        out.push({
          id: uid(),
          name: entry.name || LEGACY_MODE_LABELS[mode],
          tags: [LEGACY_MODE_LABELS[mode]],
          type: 'group',
          roster: entry.roster,
        });
      });
    });
  }
  if (data.soloOverrides && typeof data.soloOverrides === 'object') {
    SOLO_MODES.forEach(soloMode => {
      (SOLO_BUILDS[soloMode] || []).forEach(b => {
        const ov = data.soloOverrides[b.id] || null;
        out.push({
          id: uid(),
          name: b.label,
          tags: [soloMode === 'solo_pve' ? 'PvE' : 'PvP'],
          type: 'solo',
          customWeapon: (ov && ov.weapon) || null,
          gear: (ov && ov.gear) || {},
        });
      });
    });
  }
  return out;
}

/* Corre la migración una sola vez — se llama tanto desde applyState()
   (importar un archivo / autoguardado local) como desde applyRemoteState()
   (snapshot de Firebase), SIEMPRE después de que `state.customBuilds` ya
   tenga su valor base para este `data` (el merge/reemplazo normal) — las
   builds migradas se agregan ARRIBA de eso, nunca antes, para no perderlas
   si algo más las llegara a pisar. Una vez migrado, se marca el flag para
   siempre (local y, si hay sync, para todo el gremio) y no se vuelve a
   correr — evita duplicar builds en cada carga. */
function applyLegacyMigrationIfNeeded(data) {
  if (!data) return;
  if (data.migratedGroupBuilds) { state.migratedGroupBuilds = true; return; }
  if (state.migratedGroupBuilds) return; // ya se migró antes (en este dispositivo u otro)
  const hasLegacy = !!normalizeLegacyComps(data) || (data.soloOverrides && typeof data.soloOverrides === 'object');
  // OJO: si este `data` puntual no trae nada viejo para migrar, NO se marca
  // el flag todavía — a propósito. Puede ser que este `data` sea el estado
  // local ya en formato nuevo (nada que migrar acá) mientras Firebase
  // todavía tenga los datos viejos reales del gremio sin migrar: si
  // marcáramos el flag acá, cuando ese snapshot real llegara después ya
  // no se migraría nunca y se perderían esos datos.
  if (!hasLegacy) return;
  const migrated = migrateLegacyCompsAndSolo(data);
  if (migrated.length) {
    const existingIds = new Set(state.customBuilds.map(cb => cb.id));
    migrated.forEach(cb => {
      if (!existingIds.has(cb.id)) {
        state.customBuilds.push(cb);
        existingIds.add(cb.id);
      }
    });
  }
  state.migratedGroupBuilds = true;
}

/* Aplica un objeto de estado (exportado con serializeState, o leído del
   localStorage del navegador) al estado actual — se usa tanto al importar un
   archivo .json a mano como al recuperar el autoguardado al abrir la
   página. Tolera datos viejos/incompletos (de una versión anterior de la
   herramienta) sin romper: todo lo que falte se queda con su valor actual. */
function applyState(data) {
  if (!data || typeof data !== 'object') return;
  state.guildName = data.guildName || state.guildName;
  /* data.mode puede traer un valor de una versión vieja (zvz/solo_pve/etc.)
     que ya no existe — se ignora en ese caso y se deja el modo actual. */
  if (data.mode === 'balance' || data.mode === 'backups' || data.mode === 'builds') state.mode = data.mode;
  state.balances = data.balances || state.balances;
  /* customBuilds se SUMA en vez de reemplazar — a diferencia del resto del
     estado, esto es lo que permite que el gremio junte builds de varios
     archivos exportados sin perder las propias en cada importación. Se
     descartan por id repetido (ya la tenías) para poder reimportar el mismo
     archivo sin duplicar. */
  if (Array.isArray(data.customBuilds) && data.customBuilds.length) {
    const existingIds = new Set(state.customBuilds.map(cb => cb.id));
    data.customBuilds.forEach(cb => {
      if (cb && cb.id && !existingIds.has(cb.id)) {
        state.customBuilds.push(cb);
        existingIds.add(cb.id);
      }
    });
  }
  applyLegacyMigrationIfNeeded(data);
  /* abilityPicks también se SUMA (no reemplaza) — mismo criterio que
     customBuilds: importar un respaldo no debe borrar habilidades que ya
     habías elegido en este dispositivo para otras armas. */
  if (data.abilityPicks && typeof data.abilityPicks === 'object') {
    try {
      const current = loadAbilityPicks();
      Object.keys(data.abilityPicks).forEach(weaponU => {
        current[weaponU] = Object.assign({}, current[weaponU], data.abilityPicks[weaponU]);
      });
      localStorage.setItem(ABILITY_PICK_KEY, JSON.stringify(current));
    } catch (err) { /* localStorage no disponible */ }
  }
}

/* ---------------- Autoguardado en el navegador ----------------
   El autoguardado en localStorage de este navegador queda SIEMPRE activo,
   esté o no Firebase configurado: es lo que hace que al cerrar la pestaña
   y volver a abrirla todo siga como estaba, y además sirve de respaldo por
   si en algún momento no hay conexión con Firebase. Cuando FIREBASE_ENABLED
   está activo, cada guardado además dispara (con un pequeño debounce) una
   sincronización hacia el resto del gremio — ver scheduleSyncPush() más
   abajo, junto al resto de la sección de Firebase. Si Firebase no está
   configurado, ese paso extra simplemente no hace nada y esto se comporta
   exactamente como el autoguardado 100% local de siempre: por eso queda
   además el botón "Exportar" para bajar un respaldo en .json a mano. */
const STORAGE_KEY = 'pvpx_albion_comp_state_v2';
function saveToStorage() {
  try { localStorage.setItem(STORAGE_KEY, serializeState()); } catch (err) { /* localStorage no disponible (modo privado, cuota llena, etc.) — se sigue usando la app sin autoguardado */ }
  scheduleSyncPush();
}
function loadFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (err) {
    return null;
  }
}

function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------------- Usuarios / modo solo-lectura ----------------
   Esta herramienta es un solo archivo HTML sin backend: cualquier "login"
   acá es una traba de INTERFAZ para que el resto del gremio no reordene
   la comp sin querer — NO es seguridad real. El código de esta página
   (contraseñas incluidas) queda a la vista de cualquiera que abra las
   herramientas de desarrollador del navegador o mire el archivo. Sirve
   para evitar ediciones accidentales, no para proteger algo sensible.

   - Sin sesión iniciada: se puede navegar libremente entre pestañas y
     escribir el propio nombre en un casillero de jugador de la
     composición, pero no se puede tocar nada más (roles, armas, equipo,
     builds, balance, doctrina, etc.)
   - "pvpx": acceso de edición completo a todo.
   - "admin": lo mismo que "pvpx" más la pestaña "Respaldos" — guarda una
     copia de cada "Exportar todo" hecho con sesión iniciada, para bajarla
     de nuevo después. Ese historial también es 100% local a ESTE
     navegador — no se sincroniza entre dispositivos distintos. */
const AUTH_USERS = {
  pvpx: { password: 'PVPX-Gremio26', role: 'editor', label: 'PVPX' },
  admin: { password: 'admin0026%', role: 'admin', label: 'admin' },
};
const AUTH_KEY = 'pvpx_auth_user';
function currentAuthUser() {
  try {
    const u = localStorage.getItem(AUTH_KEY);
    return (u && AUTH_USERS[u]) ? u : null;
  } catch (err) { return null; }
}
function isEditor() { return currentAuthUser() !== null; }

function doLogin(username, password) {

/* ---------------- Historial de respaldos (solo lo ve "admin") ----------------
   Cada vez que alguien CON SESIÓN INICIADA usa "⬇ Exportar todo", además
   de bajar el archivo se guarda una copia para que "admin" la pueda
   revisar y volver a bajar después desde la pestaña "Respaldos".

   Con FIREBASE_ENABLED, esa copia se guarda en Firebase (compartida: admin
   la ve sin importar desde qué dispositivo se haya exportado). Sin
   Firebase configurado, se guarda en el localStorage de este navegador
   nomás — el mismo comportamiento de siempre. Se guardan hasta
   BACKUP_HISTORY_MAX copias — al superarlo se descarta la más vieja. */
const BACKUP_HISTORY_KEY = 'pvpx_backup_history';
const BACKUP_HISTORY_MAX = 30;

// Cache en memoria de los respaldos de Firebase, mantenida al día por el
// listener de initFirebaseBackupsListener(); null = todavía no llegó el
// primer snapshot (Firebase tarda un toque en responder la primera vez).
let firebaseBackupsCache = null;
let backupsListenerAttached = false;

function initFirebaseBackupsListener() {
  if (!FIREBASE_ENABLED || backupsListenerAttached) return;
  const db = getFirebaseDb();
  if (!db) return;
  backupsListenerAttached = true;
  db.ref('backups').on('value', (snap) => {
    const val = snap.val() || {};
    firebaseBackupsCache = Object.keys(val)
      .map(id => Object.assign({ id }, val[id]))
      .sort((a, b) => (b.ts || 0) - (a.ts || 0));
    // Si justo se está mirando la pestaña Respaldos, refrescarla en vivo
    // (por ejemplo, cuando otro dispositivo acaba de exportar).
    if (state.mode === 'backups') renderPanel();
  }, (err) => {
    console.error('No se pudo leer el historial de respaldos de Firebase:', err);
  });
}

function loadBackupHistory() {
  if (FIREBASE_ENABLED) return firebaseBackupsCache || [];
  try {
    const raw = localStorage.getItem(BACKUP_HISTORY_KEY);
    const list = raw ? JSON.parse(raw) : [];
    return Array.isArray(list) ? list : [];
  } catch (err) { return []; }
}
function saveBackupSnapshot(content, name) {
  const entry = {
    ts: Date.now(),
    user: currentAuthUser() || '—',
    guildName: state.guildName || 'PVPX',
    name: (name || '').trim(),
    content,
  };
  if (FIREBASE_ENABLED) {
    const db = getFirebaseDb();
    if (!db) return;
    db.ref('backups').push(entry).catch(err => {
      console.error('No se pudo guardar el respaldo en Firebase:', err);
    });
    // Poda las copias más viejas por encima de BACKUP_HISTORY_MAX — best
    // effort, no bloquea ni condiciona el guardado de arriba.
    db.ref('backups').once('value').then(snap => {
      const val = snap.val() || {};
      const ids = Object.keys(val).sort((a, b) => (val[a].ts || 0) - (val[b].ts || 0));
      while (ids.length > BACKUP_HISTORY_MAX) db.ref('backups/' + ids.shift()).remove();
    }).catch(() => {});
    return;
  }
  try {
    const list = loadBackupHistory();
    list.unshift(Object.assign({ id: uid() }, entry));
    while (list.length > BACKUP_HISTORY_MAX) list.pop();
    localStorage.setItem(BACKUP_HISTORY_KEY, JSON.stringify(list));
  } catch (err) { /* localStorage lleno o no disponible — no rompe el export en sí */ }
}
function deleteBackupSnapshot(id) {
  if (FIREBASE_ENABLED) {
    const db = getFirebaseDb();
    if (db) db.ref('backups/' + id).remove().catch(err => console.error('No se pudo borrar el respaldo:', err));
    return;
  }
  try {
    const list = loadBackupHistory().filter(b => b.id !== id);
    localStorage.setItem(BACKUP_HISTORY_KEY, JSON.stringify(list));
  } catch (err) {}
}
/* Cambia SOLO el nombre de un respaldo ya guardado (ver "✎ Renombrar" en la
   pestaña Respaldos) — no toca su contenido ni su fecha. */
function updateBackupName(id, name) {
  const clean = (name || '').trim();
  if (FIREBASE_ENABLED) {
    const db = getFirebaseDb();
    if (db) db.ref('backups/' + id + '/name').set(clean).catch(err => console.error('No se pudo renombrar el respaldo:', err));
    return;
  }
  try {
    const list = loadBackupHistory();
    const entry = list.find(b => b.id === id);
    if (entry) entry.name = clean;
    localStorage.setItem(BACKUP_HISTORY_KEY, JSON.stringify(list));
  } catch (err) {}
}
function clearBackupHistory() {
  if (FIREBASE_ENABLED) {
    const db = getFirebaseDb();
    if (db) db.ref('backups').remove().catch(err => console.error('No se pudo vaciar el historial:', err));
    return;
  }
  try { localStorage.removeItem(BACKUP_HISTORY_KEY); } catch (err) {}
}
/* Restaura un respaldo DIRECTO sobre el estado actual — el botón "📥
   Cargar" de cada fila. A diferencia de lo que antes era "Importar todo"
   (bajar el .json y volver a subirlo a mano), esto aplica el contenido en
   el momento. Usa el mismo applyState() de siempre: customBuilds y
   abilityPicks se SUMAN a lo que ya tenías (no se pierde nada propio),
   balances/nombre del gremio/modo se REEMPLAZAN por los del respaldo — el
   mismo comportamiento que tuvo "Importar todo" toda la vida. */
function loadBackupIntoState(content) {
  try {
    const data = JSON.parse(content);
    applyState(data);
    updateGuildBranding();
    renderAll();
    showToast('Respaldo cargado ✔ — todo tu progreso quedó restaurado');
  } catch (err) {
    showToast('Error al leer este respaldo ✕');
  }
}

/* ---------------- Render: pestaña "Respaldos" (solo la ve admin) ----------------
   Lista cada copia de "⬇ Exportar todo" hecha con sesión iniciada EN ESTE
   NAVEGADOR, la más reciente primero, con hora/fecha, quién la generó y su
   tamaño — con botón para bajarla de nuevo o quitarla del historial. */
function buildBackupsPanel() {
  const wrap = document.createElement('div');
  wrap.className = 'backups-panel';

  if (!isAdminUser()) {
    wrap.innerHTML = '<div class="empty-msg">🔒 Esta pestaña es solo para el usuario admin.</div>';
    return wrap;
  }
  if (FIREBASE_ENABLED) initFirebaseBackupsListener();

  const note = document.createElement('div');
  note.className = 'guide-note';
  note.style.marginBottom = '18px';
  note.innerHTML = FIREBASE_ENABLED
    ? 'Tocá "💾 Hacer respaldo" para guardar una copia del estado actual (todas las builds, el Balance y las habilidades elegidas) — pensado para tener puntos de restauración a mano. <b>Se comparte entre todos los dispositivos</b> gracias a la base de datos en la nube: no importa desde qué celular o PC se haya hecho, admin las ve todas acá. Con "📥 Cargar" se restaura un respaldo directo, sin tener que bajar ni volver a subir ningún archivo.'
    : 'Tocá "💾 Hacer respaldo" para guardar una copia del estado actual (todas las builds, el Balance y las habilidades elegidas) — pensado para tener puntos de restauración a mano. <b>Es local a este navegador</b>: un respaldo hecho en otro celular o PC se guarda EN ESE dispositivo, no aparece acá. Con "📥 Cargar" se restaura un respaldo directo, sin tener que bajar ni volver a subir ningún archivo.';
  wrap.appendChild(note);

  const list = loadBackupHistory();

  const headRow = document.createElement('div');
  headRow.style.cssText = 'display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;';
  const countEl = document.createElement('div');
  const fbUnreachable = FIREBASE_ENABLED && !getFirebaseDb();
  const loading = FIREBASE_ENABLED && !fbUnreachable && firebaseBackupsCache === null;
  countEl.style.cssText = 'font-size:13px;color:var(--grey-dim);';
  countEl.textContent = fbUnreachable
    ? '⚠️ Sin conexión con la base de datos'
    : loading
    ? 'Cargando historial…'
    : `${list.length} respaldo${list.length === 1 ? '' : 's'} guardado${list.length === 1 ? '' : 's'}${FIREBASE_ENABLED ? '' : ' en este navegador'}`;
  headRow.appendChild(countEl);

  const headBtns = document.createElement('div');
  headBtns.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;';
  const makeBackupBtn = document.createElement('button');
  makeBackupBtn.type = 'button';
  makeBackupBtn.className = 'small primary';
  makeBackupBtn.textContent = '💾 Hacer respaldo';
  makeBackupBtn.title = 'Guarda una copia del estado actual (builds, Balance y habilidades elegidas) en este historial';
  makeBackupBtn.onclick = () => {
    const fechaLabel = new Date().toLocaleDateString('es-ES') + ' ' + new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    const nn = prompt('Nombre para este respaldo (opcional):', `Respaldo ${fechaLabel}`);
    if (nn === null) return;
    saveBackupSnapshot(serializeState(), nn);
    renderPanel();
    showToast('Respaldo guardado ✔');
  };
  headBtns.appendChild(makeBackupBtn);
  if (list.length) {
    const clearBtn = document.createElement('button');
    clearBtn.type = 'button';
    clearBtn.className = 'small ghost';
    clearBtn.textContent = '🗑 Vaciar historial';
    clearBtn.onclick = () => {
      const msg = FIREBASE_ENABLED
        ? '¿Borrar TODO el historial de respaldos compartido del gremio? Los archivos que ya se bajaron a algún PC/celular no se ven afectados.'
        : '¿Borrar TODO el historial de respaldos guardado en este navegador? Los archivos que ya bajaste a tu PC/celular no se ven afectados.';
      if (!confirm(msg)) return;
      clearBackupHistory();
      renderPanel();
      showToast('Historial de respaldos vaciado ✔');
    };
    headBtns.appendChild(clearBtn);
  }
  headRow.appendChild(headBtns);
  wrap.appendChild(headRow);

  if (fbUnreachable) {
    const errMsg = document.createElement('div');
    errMsg.className = 'empty-msg';
    errMsg.textContent = 'No se pudo conectar con la base de datos en vivo ahora mismo — revisá tu conexión y volvé a intentar en un rato. Mientras tanto no se puede ver el historial compartido de respaldos.';
    wrap.appendChild(errMsg);
    return wrap;
  }
  if (loading) {
    const loadingMsg = document.createElement('div');
    loadingMsg.className = 'empty-msg';
    loadingMsg.textContent = 'Conectando con la base de datos en vivo…';
    wrap.appendChild(loadingMsg);
    return wrap;
  }

  if (!list.length) {
    const empty = document.createElement('div');
    empty.className = 'empty-msg';
    empty.textContent = 'Todavía no hay respaldos guardados — tocá "💾 Hacer respaldo" arriba para crear el primero.';
    wrap.appendChild(empty);
    return wrap;
  }

  const table = document.createElement('div');
  table.className = 'backup-list';
  list.forEach(b => {
    const row = document.createElement('div');
    row.className = 'backup-row';
    const d = new Date(b.ts);
    const fecha = d.toLocaleDateString('es-ES') + ' · ' + d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    const sizeKb = (new Blob([b.content]).size / 1024).toFixed(1);
    const userLabel = AUTH_USERS[b.user] ? AUTH_USERS[b.user].label : b.user;
    row.innerHTML = `
      <div class="backup-row-main">
        <input type="text" class="backup-name-input" placeholder="🕒 ${fecha}" value="${escapeHtmlAttr(b.name || '')}" title="Tocá para ponerle nombre a este respaldo">
        <div class="backup-row-date">🕒 ${fecha}</div>
        <div class="backup-row-meta">👤 ${userLabel} · 🏰 ${b.guildName} · ${sizeKb} KB</div>
      </div>
      <div class="backup-row-actions">
        <button type="button" class="small primary backupLoadBtn" title="Restaura este respaldo ahora mismo, sin bajar ni subir ningún archivo">📥 Cargar</button>
        <button type="button" class="small ghost backupDlBtn">⬇ Descargar</button>
        <button type="button" class="small ghost backupDelBtn" title="Quitar del historial">🗑</button>
      </div>
    `;
    const nameInput = row.querySelector('.backup-name-input');
    const commitName = () => {
      const nv = nameInput.value.trim();
      if (nv === (b.name || '')) return;
      b.name = nv;
      updateBackupName(b.id, nv);
    };
    nameInput.addEventListener('blur', commitName);
    nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') nameInput.blur(); });
    row.querySelector('.backupLoadBtn').onclick = () => {
      if (!confirm(`¿Cargar "${b.name || fecha}"? Tus builds y habilidades actuales se conservan (las del respaldo se SUMAN), pero el Balance y el nombre del gremio se reemplazan por los del respaldo.`)) return;
      loadBackupIntoState(b.content);
    };
    row.querySelector('.backupDlBtn').onclick = () => {
      const fechaArchivo = d.toISOString().slice(0, 10);
      const guildSafe = (b.guildName || 'gremio').replace(/[^a-z0-9áéíóúñ_-]+/gi, '_');
      downloadFile(`pvpx_respaldo_${guildSafe}_${fechaArchivo}.json`, b.content, 'application/json');
    };
    row.querySelector('.backupDelBtn').onclick = () => {
      if (!confirm('¿Quitar este respaldo del historial? (no afecta al archivo si ya lo bajaste)')) return;
      deleteBackupSnapshot(b.id);
      renderPanel();
    };
    table.appendChild(row);
  });
  wrap.appendChild(table);

  return wrap;
}

function textReport() {
  const lines = [];
  lines.push(`═══ ${state.guildName || 'PVPX'} — Builds Albion Online ═══`);
  lines.push('');
  function rosterBlock(title, roster) {
    lines.push(`### ${title} (${roster.length} jugador${roster.length === 1 ? '' : 'es'})`);
    roster.forEach((s, i) => {
      const def = ROLES[s.role];
      const w = s.customWeapon || def.weapons[s.weaponIdx] || def.weapons[0];
      const name = s.player.trim() || '— sin asignar —';
      const pieces = [
        effectivePiece(s, w, 'helm'),
        effectivePiece(s, w, 'chest'),
        effectivePiece(s, w, 'boots'),
        effectivePiece(s, w, 'cape'),
        effectivePiece(s, w, 'off'),
        effectivePiece(s, w, 'food'),
        effectivePiece(s, w, 'potion'),
      ];
      const gear = pieces.filter(Boolean).map(p => p[0]).join(' / ');
      lines.push(`${i + 1}. ${def.icon} ${def.label} | ${w.name}${gear ? ' [' + gear + ']' : ''} | ${name}`);
    });
    lines.push('');
  }
  if (state.mode === 'balance') {
    const total = state.balances.reduce((s, p) => s + p.balance, 0);
    lines.push(`### Balance de jugadores (saldo total: ${fmtMoney(total)})`);
    [...state.balances].sort((a, b) => b.balance - a.balance).forEach((p, i) => {
      lines.push(`${i + 1}. ${p.name} — ${fmtMoney(p.balance)}`);
    });
    lines.push('');
    return lines.join('\n');
  }
  const build = currentOpenBuild();
  if (build) {
    rosterBlock(`Build grupal — ${build.name}`, build.roster);
    return lines.join('\n');
  }
  // No hay ninguna build grupal abierta — se listan todas las builds
  // guardadas del gremio a modo de índice.
  if (state.customBuilds.length) {
    lines.push('### Mis builds');
    state.customBuilds.forEach((cb, i) => {
      const type = buildTypeOf(cb);
      lines.push(`${i + 1}. ${type === 'group' ? '👥' : '🗡️'} ${cb.name}${type === 'group' ? ` (${cb.roster.length} jugadores)` : ''}`);
    });
    lines.push('');
  } else {
    lines.push('(Todavía no hay builds guardadas)');
  }
  return lines.join('\n');
}

/* ---------------- Invitación para Discord (imagen + texto) ----------------
   Genera una tarjeta de invitación con la build actual, lista para pegar en

   de equipo por rol en texto (arma / pecho / casco / botas), abajo un grid

   si algún ícono no carga, se usa un emoji de respaldo — la imagen nunca se
   rompe por eso). Se puede copiar la imagen directo al portapapeles (para

/* Roster + metadatos de la build grupal actualmente ABIERTA en el editor
   (ver state.openBuildId) — devuelve null si no hay ninguna abierta (estás
   en la biblioteca de "Mis builds", en Balance o en Respaldos), donde no
   aplica una "build" puntual para invitar gente. */
function currentInvitationRoster() {
  const build = currentOpenBuild();
  return build ? { entry: build, roster: build.roster, label: '📚 Build' } : null;
}

function invitationGearLine(slot) {
  const def = ROLES[slot.role];
  const w = slot.customWeapon || def.weapons[slot.weaponIdx] || def.weapons[0];
  const helm = effectivePiece(slot, w, 'helm');
  const chest = effectivePiece(slot, w, 'chest');
  const boots = effectivePiece(slot, w, 'boots');
  const cape = effectivePiece(slot, w, 'cape');
  const food = effectivePiece(slot, w, 'food');
  const potion = effectivePiece(slot, w, 'potion');
  const parts = [shortEsName(w.name), chest && chest[0], helm && helm[0], boots && boots[0]].filter(Boolean);
  return { def, weapon: w, helm, chest, boots, cape, food, potion, text: parts.join(' / ') };
}

/* Convierte el valor de un <input type="datetime-local"> — interpretado
   como la hora LOCAL de quien arma la invitación, que es como el navegador
   entrega ese valor — a un texto legible en horario UTC, para que
   cualquiera del gremio pueda convertirlo a su propio huso sin ambigüedad
   ni depender de que todos estén en la misma zona horaria. */
function formatWhenUTC(datetimeLocalValue) {
  if (!datetimeLocalValue) return '';
  const d = new Date(datetimeLocalValue);
  if (isNaN(d.getTime())) return '';
  try {
    const fmt = new Intl.DateTimeFormat('es-AR', {
      weekday: 'short', day: '2-digit', month: 'short', year: 'numeric',
      hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'UTC',
    });
    return `${fmt.format(d)} UTC`;
  } catch (err) {
    return `${d.toISOString().slice(0, 16).replace('T', ' ')} UTC`;
  }
}

function invitationTextBlock(title, when, notes, roster) {
  const lines = [];
  lines.push(`📢 ${title}`);
  if (when) lines.push(`🗓️ ${when}`);
  lines.push('');
  lines.push('Composición requerida:');
  roster.forEach(s => {
    const g = invitationGearLine(s);
    lines.push(`- ${g.def.icon} ${g.def.label}: ${g.text}.`);
  });
  if (notes) { lines.push(''); lines.push(`📌 ${notes}`); }
  lines.push('');
  lines.push('✅ ¡Anotate respondiendo a este mensaje con tu rol y arma disponible!');
  return lines.join('\n');
}
