<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PVPX — Compositor de Grupos · Albion Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<!-- Solo se usan si completás FIREBASE_CONFIG dentro del script de esta
     página, para la sincronización en vivo con el bot de Discord (carpeta
     discord-bot/, ver su README.md) — si no lo completás, esta parte de la
     invitación simplemente no aparece y el resto de la herramienta sigue
     funcionando igual. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-database-compat.min.js" defer></script>
<style>
  :root{
    --bg:#0a0a0a;
    --bg-alt:#131313;
    --panel:#161616;
    --panel-2:#1d1d1d;
    --border:#2a2a2a;
    --red:#c8102e;
    --red-bright:#ff2d43;
    --red-dim:#5c0f18;
    --white:#f4f4f4;
    --grey:#9a9a9a;
    --grey-dim:#666;
    --radius:10px;
    --header-grad-1:#0d0d0d;
    --header-grad-2:#0a0a0a;
    --shadow-a:rgba(0,0,0,.55);
  }
  [data-theme="light"]{
    --bg:#f3f1ee;
    --bg-alt:#faf8f5;
    --panel:#fbf9f6;
    --panel-2:#efece7;
    --border:#ddd8cf;
    --red:#c8102e;
    --red-bright:#e0122f;
    --red-dim:#f6d3d8;
    --white:#181614;
    --grey:#5a5650;
    --grey-dim:#8a857c;
    --header-grad-1:#faf8f5;
    --header-grad-2:#f3f1ee;
    --shadow-a:rgba(0,0,0,.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(200,16,46,.10), transparent 45%),
      radial-gradient(circle at 85% 10%, rgba(200,16,46,.07), transparent 40%),
      var(--bg);
    color:var(--white);
    font-family:'Rajdhani',sans-serif;
    min-height:100vh;
    padding-bottom:60px;
    transition:background .2s,color .2s;
  }
  h1,h2,h3,.brand{font-family:'Cinzel',serif;}
  ::selection{background:var(--red);color:#fff;}

  /* ---------- Header ---------- */
  header.top{
    background:linear-gradient(180deg, var(--header-grad-1) 0%, var(--header-grad-2) 100%);
    border-bottom:3px solid transparent;
    border-image:linear-gradient(90deg, transparent, var(--red-bright) 20%, var(--red-bright) 80%, transparent) 1;
    padding:20px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    position:sticky;
    top:0;
    z-index:50;
    box-shadow:0 4px 22px var(--shadow-a);
  }
  .brand-block{display:flex;align-items:center;gap:18px;}
  .crest{
    width:64px;height:64px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #2a0006, #000);
    border:3px solid var(--red);
    display:flex;align-items:center;justify-content:center;
    font-size:30px;
    box-shadow:0 0 0 4px color-mix(in srgb, var(--red) 18%, transparent), 0 0 22px rgba(200,16,46,.65) inset, 0 0 18px rgba(200,16,46,.5);
    flex-shrink:0;
  }
  .brand-titles h1{
    margin:0;font-size:30px;letter-spacing:3px;color:var(--white);
    font-weight:900;text-transform:uppercase;
    text-shadow:0 0 22px rgba(200,16,46,.65), 0 2px 0 rgba(0,0,0,.4);
  }
  .brand-titles .sub{font-size:12px;color:var(--grey);letter-spacing:2px;text-transform:uppercase;margin-top:2px;}
  .sync-badge{
    font-size:11.5px;font-weight:700;letter-spacing:.4px;
    padding:4px 10px;border-radius:20px;flex-shrink:0;white-space:nowrap;
    background:color-mix(in srgb, #2ecc71 16%, transparent);
    color:#2ecc71;border:1px solid color-mix(in srgb, #2ecc71 40%, transparent);
  }
  .sync-badge.offline{
    background:color-mix(in srgb, #e0a72a 16%, transparent);
    color:#e0a72a;border-color:color-mix(in srgb, #e0a72a 40%, transparent);
  }
  .sync-badge.error{
    background:color-mix(in srgb, #e0473a 18%, transparent);
    color:#ff6b5e;border-color:color-mix(in srgb, #e0473a 45%, transparent);
  }

  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .toolbar-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .toolbar-divider{width:1px;align-self:stretch;min-height:22px;background:var(--border);}

  /* Botón ☰ que reemplaza el toolbar en celular (ver @media más abajo) —
     oculto en desktop, donde el toolbar entero se ve siempre. */
  .mobile-menu-btn{
    display:none;
    width:42px;height:42px;flex-shrink:0;
    align-items:center;justify-content:center;
    background:var(--panel);border:1px solid var(--border);border-radius:9px;
    color:var(--white);font-size:19px;line-height:1;cursor:pointer;
    transition:.15s;
  }
  .mobile-menu-btn:hover{border-color:var(--red);background:var(--panel-2);}
  .mobile-menu-btn[aria-expanded="true"]{border-color:var(--red);color:var(--red-bright);}
  .mobile-menu-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:45;}
  button, .btn{
    font-family:'Rajdhani',sans-serif;
    font-weight:600;
    letter-spacing:.4px;
    cursor:pointer;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--white);
    padding:9px 14px;
    font-size:13.5px;
    transition:.15s ease;
    display:inline-flex;align-items:center;gap:6px;
  }
  button:hover{border-color:var(--red);background:var(--panel-2);}
  button:active{transform:scale(.97);}
  button.primary{background:var(--red);border-color:var(--red);color:#fff;}
  button.primary:hover{background:var(--red-bright);border-color:var(--red-bright);}
  button.ghost{background:transparent;}
  button.small{padding:5px 9px;font-size:12px;border-radius:6px;}
  button:disabled{opacity:.35;cursor:not-allowed;}
  input[type=file]{display:none;}

  /* ---------- Menú unificado de modalidad (Composición / Balance) ---------- */
  .mode-bar{
    display:flex;
    flex-direction:column;
    gap:10px;
    padding:22px 28px 0;
  }
  .mode-menu{
    display:inline-flex;
    gap:5px;
    background:linear-gradient(165deg, var(--panel-2), var(--panel));
    border:1px solid var(--border);
    border-radius:34px;
    padding:6px;
    flex-wrap:wrap;
    box-shadow:0 4px 16px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.03);
  }
  .mode-item{
    display:inline-flex;align-items:center;gap:8px;
    padding:11px 24px;
    border-radius:28px;
    border:none;
    background:transparent;
    color:var(--grey);
    font-family:'Cinzel',serif;
    font-weight:800;
    font-size:14.5px;
    letter-spacing:.6px;
    text-transform:uppercase;
    cursor:pointer;
    transition:.18s;
  }
  .mode-item span:first-child{font-size:17px;}
  .mode-item:hover:not(.active){background:var(--panel-2);color:var(--white);}
  .mode-item.active{
    background:linear-gradient(120deg, var(--red-bright), var(--red));
    color:#fff;
    box-shadow:0 4px 16px rgba(200,16,46,.5), inset 0 1px 0 rgba(255,255,255,.25);
    transform:translateY(-1px);
  }
  .mode-desc{font-size:12.5px;color:var(--grey);font-style:italic;padding-left:6px;}

  /* Sub-menú dentro de la pestaña "Composición" para elegir ZVZ / Grupales /
     Estática — más chico que el menú principal para marcar que es un
     selector secundario dentro de la misma pestaña. */
  .submode-menu{
    display:inline-flex;
    gap:4px;
    background:var(--bg-alt);
    border:1px solid var(--border);
    border-radius:28px;
    padding:5px;
    flex-wrap:wrap;
    margin-left:2px;
    box-shadow:inset 0 1px 4px rgba(0,0,0,.25);
  }
  .submode-item{
    display:inline-flex;align-items:center;gap:6px;
    padding:8px 18px;
    border-radius:22px;
    border:none;
    background:transparent;
    color:var(--grey);
    font-family:'Rajdhani',sans-serif;
    font-weight:700;
    font-size:13.5px;
    letter-spacing:.3px;
    cursor:pointer;
    transition:.15s;
  }
  .submode-item:hover:not(.active){background:var(--panel-2);color:var(--white);}
  .submode-item.active{
    background:linear-gradient(120deg, var(--red-bright), var(--red));
    color:#fff;
    box-shadow:0 3px 10px rgba(200,16,46,.4);
  }

  main{padding:18px 28px 40px;}
  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:22px;
  }

  /* ---------- Summary strip ---------- */
  .summary-strip{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:18px;
  }
  .stat{
    background:var(--bg-alt);
    border:1px solid var(--border);
    border-left:3px solid var(--red);
    border-radius:8px;
    padding:8px 14px;
    font-size:13px;
    color:var(--grey);
    min-width:120px;
  }
  .stat b{display:block;color:var(--white);font-size:18px;font-family:'Cinzel',serif;}

  /* ---------- Group tabs (ZVZ) ---------- */
  .group-bar{
    display:flex;align-items:center;gap:6px;margin-bottom:18px;flex-wrap:wrap;
    background:linear-gradient(165deg, var(--panel-2), var(--panel));
    border:1px solid var(--border);border-radius:26px;padding:6px;
    box-shadow:0 3px 12px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.03);
  }
  .group-tab{
    display:inline-flex;align-items:center;gap:6px;
    padding:8px 14px 8px 20px;border-radius:20px;border:none;
    background:transparent;color:var(--grey);font-weight:800;font-size:13.5px;cursor:pointer;
    letter-spacing:.4px;transition:.16s;font-family:'Rajdhani',sans-serif;
  }
  .group-tab:hover:not(.active){background:var(--panel-2);color:var(--white);}
  .group-tab.active{
    background:linear-gradient(120deg, var(--red-bright), var(--red));
    border-color:var(--red);color:#fff;
    box-shadow:0 4px 14px rgba(200,16,46,.45), inset 0 1px 0 rgba(255,255,255,.2);
    transform:translateY(-1px);
  }
  .group-tab .count{opacity:.8;font-size:11px;}
  /* Doctrina (Kite/Brawl) sin sesión iniciada — se ve pero avisa que está
     bloqueada en vez de comportarse como si nada (el click igual no hace
     nada, esto es solo para que no parezca roto). */
  .group-tab.locked{opacity:.55;cursor:not-allowed;}
  .group-tab.locked:hover{background:transparent;color:var(--grey);}
  .tab-rename-btn{
    background:rgba(255,255,255,.08);border:none;color:inherit;opacity:.75;cursor:pointer;
    font-size:11px;line-height:1;padding:4px 6px;border-radius:8px;transition:.14s;
  }
  .tab-rename-btn:hover{opacity:1;background:rgba(255,255,255,.22);}

  /* ---------- Gear picker (equipment editing) ---------- */
  .doll-slot.editable{cursor:pointer;position:relative;}
  .doll-slot.editable .doll-icon-box{transition:.15s;}
  .doll-slot.editable:hover .doll-icon-box{
    border-color:var(--red-bright);
    box-shadow:0 0 0 2px color-mix(in srgb, var(--red-bright) 40%, transparent), 0 0 14px rgba(200,16,46,.4);
  }
  .doll-edit-hint{
    position:absolute;top:2px;right:2px;
    width:18px;height:18px;border-radius:50%;
    background:var(--red-bright);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:10px;opacity:0;transition:.15s;
    box-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  .doll-slot.editable:hover .doll-edit-hint{opacity:1;}
  .gear-picker-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .gear-picker-search{
    width:100%;box-sizing:border-box;
    background:#0a0a0a;border:1px solid var(--border);color:#f0f0f0;
    border-radius:8px;padding:10px 14px;margin-bottom:16px;
    font-family:'Rajdhani',sans-serif;font-size:14.5px;
  }
  .gear-picker-search::placeholder{color:var(--grey-dim);}
  .gear-picker-search:focus{outline:none;border-color:var(--red-bright);}
  .gear-picker-empty{
    color:var(--grey);font-size:13px;text-align:center;
    padding:26px 10px;font-style:italic;
  }
  .gear-picker-grid{
    display:grid;grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));gap:10px;
  }
  .gear-picker-item{
    display:flex;flex-direction:column;align-items:center;gap:8px;
    padding:12px 8px;border-radius:12px;border:1px solid var(--border);
    background:var(--bg-alt);cursor:pointer;transition:.15s;
    font-family:'Rajdhani',sans-serif;
  }
  .gear-picker-item:hover{border-color:var(--red-bright);background:var(--panel-2);transform:translateY(-2px);}
  .gear-picker-item.active{
    border-color:var(--red-bright);
    background:color-mix(in srgb, var(--red-bright) 14%, var(--bg-alt));
    box-shadow:0 0 0 1px var(--red-bright), 0 4px 14px rgba(200,16,46,.3);
  }
  .gear-picker-icon{
    width:56px;height:56px;border-radius:10px;background:var(--panel);
    display:flex;align-items:center;justify-content:center;font-size:26px;
    border:1px solid var(--border);overflow:hidden;
  }
  .gear-picker-icon img{width:100%;height:100%;object-fit:contain;}
  .gear-picker-name{font-size:12px;color:var(--white);text-align:center;font-weight:600;line-height:1.25;}
  .gear-picker-group-title{
    font-family:'Cinzel',serif;font-weight:800;font-size:12.5px;color:var(--white);
    text-transform:uppercase;letter-spacing:.6px;
    margin:18px 0 8px;padding-left:10px;
    border-left:3px solid var(--red-bright);
  }
  .gear-picker-group-title:first-child{margin-top:0;}

  /* ---------- Roster grid ---------- */
  .roster-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .roster-head h2{margin:0;font-size:18px;color:var(--white);}
  .fill-bar-wrap{flex:1;min-width:160px;max-width:320px;height:8px;background:#000;border-radius:5px;overflow:hidden;border:1px solid var(--border);}
  .fill-bar{height:100%;background:linear-gradient(90deg,var(--red-dim),var(--red-bright));transition:.25s;}
  .quick-controls{display:flex;gap:6px;}

  /* ---------- Roster: tarjeta grande vertical (Grupales / Estática) ----------
     Es el layout por defecto. Para ZVZ (grupos de hasta 20) se sobreescribe
     más abajo con .grid-row a una fila horizontal angosta, para que entren
     muchos más jugadores de un vistazo sin scrollear tanto. */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
    gap:14px;
  }
  .slot-card{
    --accent:var(--red);
    background:var(--bg-alt);
    background:linear-gradient(165deg, color-mix(in srgb, var(--accent) 20%, var(--bg-alt)) 0%, var(--bg-alt) 58%);
    border:1px solid var(--border);
    border-top:3px solid var(--accent);
    border-radius:12px;
    padding:15px 13px 13px;
    position:relative;
    overflow:hidden;
    transition:.15s;
    box-shadow:0 2px 10px rgba(0,0,0,.18);
  }
  .slot-card:hover{border-color:var(--accent);box-shadow:0 6px 20px -3px color-mix(in srgb, var(--accent) 60%, transparent);}
  .slot-card::after{
    content:attr(data-role-icon);
    position:absolute;top:-16px;right:-8px;
    font-size:76px;line-height:1;opacity:.07;
    pointer-events:none;transform:rotate(8deg);
  }

  /* Cinta de rol — ícono + label */
  .role-badge{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--accent);
    color:#050505;
    font-weight:800;
    font-size:12.5px;
    letter-spacing:.2px;
    padding:5px 13px 5px 10px;
    border-radius:18px;
    font-family:'Rajdhani',sans-serif;
    margin-bottom:11px;
    position:relative;z-index:1;
  }

  /* Muñeco de equipo (paperdoll). Por defecto (Solitario / Biblioteca / Mis
     builds) sigue siendo la disposición en cruz de 3x3, grande, con nombre
     debajo de cada pieza. Dentro de una fila de roster (.slot-card) se
     override más abajo a una tira horizontal chica de solo íconos. */
  .paperdoll{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,auto);
    gap:9px;
    margin-bottom:12px;
    position:relative;
    z-index:1;
  }
  .doll-slot{display:flex;flex-direction:column;align-items:stretch;gap:4px;}
  .doll-icon-box{
    width:100%;aspect-ratio:1;
    border-radius:9px;
    background:#000;
    border:2px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;position:relative;
  }
  .doll-slot.filled .doll-icon-box{
    border-color:var(--accent);
    box-shadow:0 0 0 1px rgba(0,0,0,.45) inset, 0 0 11px -1px color-mix(in srgb, var(--accent) 75%, transparent);
    background:radial-gradient(circle at 50% 40%, #1a1a1a, #000);
  }
  .doll-slot.empty .doll-icon-box{opacity:.32;border-style:dashed;}
  .doll-slot.na .doll-icon-box{opacity:.18;border-style:dashed;}
  .doll-icon-box img{width:80%;height:80%;object-fit:contain;filter:drop-shadow(0 1px 3px rgba(0,0,0,.7));}
  .doll-icon-box .fallback{font-size:28px;}
  .doll-icon-box .tier-badge{
    position:absolute;top:-1px;right:-1px;
    background:var(--accent);color:#050505;
    font-size:8px;font-weight:800;letter-spacing:.4px;
    padding:1px 4px;border-radius:0 7px 0 7px;
    font-family:'Rajdhani',sans-serif;
  }
  .doll-label{display:flex;flex-direction:column;align-items:center;text-align:center;line-height:1.2;padding:0 1px;}
  .doll-tag{
    font-size:8.5px;font-weight:800;letter-spacing:.4px;
    color:var(--grey-dim);text-transform:uppercase;
  }
  .doll-name{
    font-size:11px;font-weight:600;color:var(--grey);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;word-break:break-word;
  }
  .weapon-slot{grid-column:1;grid-row:2;}
  .helm-slot{grid-column:2;grid-row:1;}
  .cape-slot{grid-column:3;grid-row:1;}
  .chest-slot{grid-column:2;grid-row:2;}
  .off-slot{grid-column:3;grid-row:2;}
  .potion-slot{grid-column:1;grid-row:3;}
  .boots-slot{grid-column:2;grid-row:3;}
  .food-slot{grid-column:3;grid-row:3;}

  .role-select, .weapon-select{
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--white);
    padding:8px 10px;
    border-radius:7px;
    font-family:'Rajdhani',sans-serif;
    font-size:13.5px;
    font-weight:600;
    outline:none;
    width:100%;
  }
  .role-select{color:var(--red-bright);text-overflow:ellipsis;font-weight:700;}
  .role-select:focus, .weapon-select:focus, .player-input:focus{border-color:var(--accent);}
  .selects{
    display:flex;flex-direction:column;gap:8px;
    position:relative;z-index:1;
  }
  .player-input{
    width:100%;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--white);
    padding:8px 10px;
    border-radius:6px;
    font-size:14.5px;
    outline:none;
  }
  .player-input::placeholder{color:var(--grey-dim);}
  .slot-card .player-input{margin-top:10px;}
  .remove-slot{
    position:absolute;top:10px;right:10px;z-index:2;
    width:26px;height:26px;border-radius:50%;
    background:transparent;border:1px solid var(--border);
    color:var(--grey);font-size:13px;line-height:1;
    display:flex;align-items:center;justify-content:center;padding:0;
  }
  .remove-slot:hover{background:var(--red);border-color:var(--red);color:#fff;}

  .add-slot-card{
    border:1.5px dashed var(--border);
    border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    color:var(--grey);
    font-weight:700;
    cursor:pointer;
    min-height:96px;
    padding:8px;
    background:transparent;
    font-size:14px;
  }
  .add-slot-card:hover{border-color:var(--red);color:var(--red-bright);}
  .add-slot-card:disabled{opacity:.3;cursor:not-allowed;}

  /* ---------- Roster en FILA — solo ZVZ (grupos grandes, hasta 20) ----------
     El JS marca la grilla con la clase extra .grid-row únicamente cuando
     state.mode === 'zvz'; Grupales y Estática se quedan con la tarjeta
     grande de arriba. Todo acá está scopeado a ".grid-row .slot-card" para
     no tocar Solitario / Biblioteca / Mis builds, que comparten .paperdoll. */
  .grid.grid-row{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  /* CSS Grid en vez de flex para la fila: así cada columna (rol, cada
     pieza de equipo, arma seleccionada, nombre) tiene un ancho FIJO propio
     y coincide exactamente de una fila a la siguiente, sin importar que
     "Caller / IC" sea más largo que "Tanque" — con flex eso corría todo lo
     de la derecha out of alignment. .paperdoll pasa a "display:contents"
     para que sus 8 casillas sean columnas directas de esta grilla. */
  .grid-row .slot-card{
    background:var(--bg-alt);
    background:linear-gradient(100deg, color-mix(in srgb, var(--accent) 14%, var(--bg-alt)) 0%, var(--bg-alt) 40%);
    border-top:1px solid var(--border);
    border-left:3px solid var(--accent);
    border-radius:9px;
    padding:8px 34px 8px 11px;
    display:grid;
    grid-template-columns:170px repeat(8, 58px) 150px 1fr;
    align-items:center;
    column-gap:8px;
    row-gap:6px;
    box-shadow:none;
  }
  .grid-row .slot-card:hover{box-shadow:0 3px 12px -3px color-mix(in srgb, var(--accent) 55%, transparent);}
  .grid-row .slot-card::after{display:none;}
  .grid-row .role-badge{
    order:0;margin-bottom:0;white-space:nowrap;
    padding:4px 10px 4px 8px;font-size:11.5px;gap:5px;
    width:100%;box-sizing:border-box;overflow:hidden;text-overflow:ellipsis;
  }
  .grid-row .paperdoll{display:contents;}
  .grid-row .doll-slot{width:58px;gap:0;}
  .grid-row .doll-icon-box{border-radius:8px;border-width:1px;}
  .grid-row .doll-icon-box .fallback{font-size:23px;}
  .grid-row .doll-icon-box .tier-badge{font-size:7.5px;padding:0 3px;}
  .grid-row .doll-label{display:none;}
  .grid-row .weapon-slot{order:1;grid-column:auto;grid-row:auto;}
  .grid-row .helm-slot{order:2;grid-column:auto;grid-row:auto;}
  .grid-row .chest-slot{order:3;grid-column:auto;grid-row:auto;}
  .grid-row .cape-slot{order:4;grid-column:auto;grid-row:auto;}
  .grid-row .off-slot{order:5;grid-column:auto;grid-row:auto;}
  .grid-row .boots-slot{order:6;grid-column:auto;grid-row:auto;}
  .grid-row .food-slot{order:7;grid-column:auto;grid-row:auto;}
  .grid-row .potion-slot{order:8;grid-column:auto;grid-row:auto;}
  /* En ZVZ el weapon-select ya no existe (redundante con clickear el
     ícono de arma del muñeco) — .selects queda con solo el role-select. */
  .grid-row .selects{order:9;width:100%;}
  .grid-row .selects .role-select{width:100%;}
  .grid-row .slot-card .player-input{
    order:10;margin-top:0;width:100%;
    padding:6px 9px;font-size:13px;
  }
  .grid-row .remove-slot{
    top:50%;right:8px;transform:translateY(-50%);
    width:20px;height:20px;font-size:12px;
  }

  @media (max-width:980px){
    .grid-row .slot-card{
      display:flex;align-items:center;flex-wrap:wrap;gap:8px;
      padding:9px 34px 9px 10px;
    }
    .grid-row .paperdoll{display:flex;flex-wrap:wrap;gap:5px;}
    .grid-row .role-badge{width:auto;flex:0 0 auto;overflow:visible;text-overflow:clip;}
    .grid-row .selects{width:auto;flex:1 1 150px;min-width:130px;}
    .grid-row .slot-card .player-input{width:auto;flex:1 1 150px;min-width:110px;}
  }

  .empty-msg{color:var(--grey);font-size:13px;padding:20px;text-align:center;border:1px dashed var(--border);border-radius:10px;}

  /* ---------- Role legend ---------- */

  .legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--grey);}
  .legend-item .dot{width:10px;height:10px;border-radius:3px;background:var(--red);}

  /* ---------- Pestaña Solitario (PvE / PvP) ---------- */

  }

    width:100%;
    max-width:560px;
    background:var(--bg-alt);
    background:linear-gradient(165deg, color-mix(in srgb, var(--accent) 20%, var(--bg-alt)) 0%, var(--bg-alt) 58%);
    border:1px solid var(--border);

  .solo-stat-value{

  /* ---------- Biblioteca de Builds ---------- */
  .lib-filters{
    display:flex;flex-direction:column;gap:12px;
    background:var(--bg-alt);border:1px solid var(--border);border-radius:12px;
    padding:16px;margin-bottom:16px;
  }

    width:100%;box-sizing:border-box;

    border-radius:8px;padding:10px 14px;
    font-family:'Rajdhani',sans-serif;font-size:14.5px;
  }
  .lib-search::placeholder{color:var(--grey-dim);}
  .lib-search:focus{outline:none;border-color:var(--red-bright);}
  .lib-filter-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .lib-filter-label{
    font-size:11.5px;font-weight:800;color:var(--grey-dim);

    cursor:pointer;transition:.15s;

  .lib-count{font-size:12.5px;color:var(--grey-dim);margin-bottom:12px;}
  .lib-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
    gap:14px;
  }
  .lib-empty{
    grid-column:1/-1;

  }
  .lib-card{
    --accent:var(--red);
    background:var(--bg-alt);
    background:linear-gradient(165deg, color-mix(in srgb, var(--accent) 18%, var(--bg-alt)) 0%, var(--bg-alt) 58%);
    border:1px solid var(--border);
    border-top:3px solid var(--accent);
    border-radius:12px;
    padding:13px 12px 12px;

  .my-build-tag-add{

  /* ---------- Pestaña de Balance de jugadores ---------- */
  .balance-panel .summary-strip{margin-bottom:20px;}
  .balance-stat-total{border-left-color:#2e9e5b;}
  .balance-stat-total b{color:#2e9e5b;}

  .balance-toolbar{
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;
    margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--border);
  }
  .balance-toolbar .player-input{margin-top:0;flex:1;min-width:220px;max-width:300px;font-size:15px;}

  .balance-move-card{
    background:linear-gradient(165deg, color-mix(in srgb, var(--red) 10%, var(--bg-alt)) 0%, var(--bg-alt) 60%);
    border:1px solid var(--border);border-radius:12px;
    padding:16px;margin-bottom:22px;
  }
  .balance-move-title{
    font-family:'Cinzel',serif;font-weight:700;font-size:15px;color:var(--white);

  .balance-move-form select, .balance-move-form input{

    padding:9px 11px;border-radius:7px;font-family:'Rajdhani',sans-serif;font-size:14.5px;outline:none;
  }

  .balance-move-form input[type=number]{width:130px;font-family:'Cinzel',serif;font-weight:700;}
  .balance-move-form input[type=text]{flex:1;min-width:180px;}
  .balance-move-form select:focus, .balance-move-form input:focus{border-color:var(--red);}

  .balance-table{border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .balance-row{
    display:grid;grid-template-columns:2.2fr 1.1fr 90px 160px;align-items:center;
    gap:10px;padding:13px 16px;border-bottom:1px solid var(--border);
    transition:.12s;
  }
  .balance-row:not(.balance-row-head):hover{background:var(--bg-alt);}
  .balance-row:last-child{border-bottom:none;}
  .balance-row-head{
    background:var(--bg-alt);color:var(--grey-dim);font-size:11.5px;font-weight:800;
    text-transform:uppercase;letter-spacing:.5px;
  }
  .balance-name-cell{display:flex;align-items:center;gap:10px;min-width:0;}
  .balance-avatar{
    width:32px;height:32px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    color:#050505;font-family:'Cinzel',serif;font-weight:800;font-size:14px;
    box-shadow:0 2px 6px rgba(0,0,0,.35);

  .balance-amount{font-family:'Cinzel',serif;font-weight:800;font-size:17px;color:var(--grey);}
  .balance-amount.positive{color:#2e9e5b;}
  .balance-amount.negative{color:var(--red-bright);}
  .balance-count{font-size:13px;color:var(--grey-dim);}
  .balance-actions{display:flex;gap:6px;justify-content:flex-end;}

  .bal-hist-summary{
    display:flex;align-items:center;gap:14px;
    background:var(--bg-alt);border:1px solid var(--border);border-radius:12px;
    padding:16px;margin-bottom:18px;
  }
  .bal-hist-summary-name{font-family:'Cinzel',serif;font-weight:700;font-size:17px;color:var(--white);}
  .bal-hist-summary-amount{font-family:'Cinzel',serif;font-weight:800;font-size:22px;color:var(--grey);margin-top:2px;}
  .bal-hist-summary-amount.positive{color:#2e9e5b;}
  .bal-hist-summary-amount.negative{color:var(--red-bright);}
  .bal-hist-list{display:flex;flex-direction:column;gap:8px;}
  .bal-hist-item{
    display:flex;justify-content:space-between;align-items:center;gap:14px;
    background:var(--bg-alt);border:1px solid var(--border);border-left:3px solid var(--grey-dim);
    border-radius:9px;padding:11px 14px;

  .bal-hist-item.positive{border-left-color:#2e9e5b;}
  .bal-hist-item.negative{border-left-color:var(--red-bright);}
  .bal-hist-item-amount{font-family:'Cinzel',serif;font-weight:800;font-size:16px;color:var(--grey);flex-shrink:0;}
  .bal-hist-item.positive .bal-hist-item-amount{color:#2e9e5b;}
  .bal-hist-item.negative .bal-hist-item-amount{color:var(--red-bright);}

  /* ---------- Pestaña "Respaldos" (solo admin) ---------- */
  .backup-list{display:flex;flex-direction:column;gap:8px;}
  .backup-row{
    display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;

    border-radius:9px;padding:11px 14px;
  }
  .backup-row-date{font-family:'Cinzel',serif;font-weight:700;font-size:14px;color:var(--white);}
  .backup-row-meta{font-size:12.5px;color:var(--grey-dim);margin-top:2px;}
  .backup-row-actions{display:flex;gap:6px;flex-shrink:0;}
  .backup-name-input{

  .backup-name-input::placeholder{color:var(--grey-dim);font-weight:700;opacity:.7;}

  .backup-name-input:focus{border-color:var(--red);background:var(--panel-2);outline:none;}

  footer{
    text-align:center;color:var(--grey-dim);font-size:11.5px;padding:24px;
  }

  /* Modal for text export */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.75);
    display:none;align-items:center;justify-content:center;z-index:100;padding:20px;
  }
  .modal-overlay.show{display:flex;}
  .modal{
    background:var(--panel);border:1px solid var(--red);border-radius:12px;
    max-width:640px;width:100%;max-height:80vh;display:flex;flex-direction:column;
    box-shadow:0 0 40px rgba(200,16,46,.3);

  .modal-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  .modal-head h3{margin:0;font-size:16px;}
  .modal-body{padding:16px 18px;overflow:auto;}
  .modal-body textarea{
    width:100%;min-height:340px;background:#0a0a0a;border:1px solid var(--border);

    resize:vertical;
  }
  .modal-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}

  /* ---------- Guía (modal con contenido HTML, títulos marcados) ---------- */
  .guide-content{font-size:13.5px;line-height:1.55;color:var(--grey);}
  .guide-content h4{
    font-family:'Cinzel',serif;color:var(--red-bright);font-size:15.5px;
    text-transform:uppercase;letter-spacing:1px;
    margin:22px 0 12px;padding-bottom:7px;border-bottom:2px solid var(--red);
  }
  .guide-content h4:first-child{margin-top:0;}
  .guide-content b{color:var(--white);}
  .guide-content ul{margin:6px 0 12px;padding-left:20px;}
  .guide-content li{margin-bottom:4px;}
  .ability-list{list-style:none;margin:6px 0 12px;padding:0;display:flex;flex-direction:column;gap:6px;}
  .ability-item{display:flex;align-items:center;gap:10px;}
  .ability-icon{
    width:30px;height:30px;flex:0 0 30px;
    border-radius:7px;background:#000;border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .ability-icon img{width:100%;height:100%;object-fit:contain;}
  .ability-icon .fallback{font-size:14px;}
  .ability-name{font-size:13.5px;color:var(--grey);flex:1;}
  .ability-tier{
    flex:0 0 auto;
    font-family:'Rajdhani',sans-serif;font-weight:800;font-size:10px;letter-spacing:.3px;
    padding:3px 8px;border-radius:12px;white-space:nowrap;
    background:transparent;color:var(--red-bright);border:1px solid var(--red);
  }
  .ability-tier.base{color:#3ecf6e;border-color:#3ecf6e;}
  .ability-hint{font-size:11px;color:var(--grey-dim);font-style:italic;margin:2px 0 6px;}

    cursor:pointer;padding:4px 8px;border-radius:8px;margin:0 -8px;
    transition:background .12s ease;
  }
  .ability-item.selectable:hover{background:var(--panel-2);}

   https://render.albiononline.com/v1/item/{UNIQUENAME}.png?quality=1
   Si un ícono no carga (nombre no exacto / cambios de la API) se usa un
   emoji de respaldo para que la tarjeta nunca se vea rota.

/* Excepción al TIER por defecto: a diferencia de armas/armaduras (que SÍ
   existen en T8 para todo lo que usa esta herramienta, verificado contra
   los datos oficiales del juego), varias comidas y pociones NO tienen
   versión T8 — su tope real es más bajo (T6 o T7). Pedir el ícono T8 para
   esas devuelve 404 y el ícono nunca carga. Se verificó tope por tope
   contra los datos oficiales antes de armar esta tabla (no es un ajuste a
   ojo): Ensalada T6, Tortilla/Pastel/Asado T7, Curación/Energía T6,
   Resistencia/Purificadora/Ácido/Calmante/Revivir/Pegajosa T7 — el resto
   (Estofado, Sándwich, Invisibilidad, Furia, Veneno, Recolección,
   Infernal, Tornado) sí llega a T8 y no necesita excepción. */
const ICON_TIER_OVERRIDE = {

  MEAL_OMELETTE: 'T7', MEAL_OMELETTE_FISH: 'T7', MEAL_OMELETTE_AVALON: 'T7',

};
function iconUrl(suffix) {
  if (!suffix) return null;
  const tier = ICON_TIER_OVERRIDE[suffix] || TIER;
  return `https://render.albiononline.com/v1/item/${tier}_${suffix}.png?quality=1&size=80`;
}

/* ---------------- Catálogo de piezas de armadura (verificadas) ---------- */

   aparte a mano. */
function materialFromSuffix(suffix) {
  if (!suffix) return 'leather';
  if (suffix.includes('PLATE')) return 'plate';
  if (suffix.includes('CLOTH')) return 'cloth';

const MATERIAL_LABEL = { plate: 'Placa', leather: 'Cuero', cloth: 'Tela' };
function groupArmorDict(dict) {
  const buckets = { plate: {}, leather: {}, cloth: {} };
  Object.keys(dict).forEach(key => {
    buckets[materialFromSuffix(dict[key][1])][key] = dict[key];
  });
  return ['plate', 'leather', 'cloth']
    .filter(m => Object.keys(buckets[m]).length)
    .map(m => ({ label: MATERIAL_LABEL[m], entries: buckets[m] }));

   comparten una raíz de texto común por categoría (p. ej. "Cuerno" incluye

  Object.keys(dict).forEach(key => {
    const cat = OFF_CATEGORY[dict[key][1]] || 'tome';

  });
  return order.filter(o => Object.keys(buckets[o]).length).map(o => ({ label: OFF_CATEGORY_LABEL[o], entries: buckets[o] }));
}

function clamp10(n) { return Math.max(0, Math.min(10, Math.round(n))); }
function computeSoloStats(weapon, slot) {
  const fam = weaponFamilyOf(weapon.u);
  const base = fam.stats;
  const chestPiece = effectivePiece(slot, weapon, 'chest');
  const armorMod = ARMOR_MOD[materialFromSuffix(chestPiece ? chestPiece[1] : null)];
  const offPiece = effectivePiece(slot, weapon, 'off');
  const offMod = (offPiece && OFF_MOD[offPiece[1]]) || {};
  const foodPiece = effectivePiece(slot, weapon, 'food');
  const foodMod = (foodPiece && FOOD_MOD[foodPiece[1]]) || {};
  const potionPiece = effectivePiece(slot, weapon, 'potion');
  const potionMod = (potionPiece && POTION_MOD[potionPiece[1]]) || {};
  const out = {};
  Object.keys(SOLO_STATS_LABELS).forEach(k => {
    out[k] = clamp10((base[k] || 0) + (armorMod[k] || 0) + (offMod[k] || 0) + (foodMod[k] || 0) + (potionMod[k] || 0));
  });
  return out;
}

/* Helper para armar una build completa: arma + set de armadura + capa (+ offhand y comida opcionales) */
function build(name, weaponU, helmKey, chestKey, bootsKey, capeKey, off, foodKey) {
  return {
    name,
    u: weaponU,
    helm: helmKey ? HELM[helmKey] : null,
    chest: chestKey ? CHEST[chestKey] : null,
    boots: bootsKey ? BOOTS[bootsKey] : null,
    cape: capeKey ? CAPE[capeKey] : null,
    off: off || null, // [nombre, uniquename]
    food: foodKey ? FOOD[foodKey] : null,
  };
}

/* ---------------- Familias de armas (para el picker "todas las del juego" y
   para estimar estadísticas) ----------------
   Cada familia agrupa armas por arquetipo (ej. todos los báculos de fuego
   juntos) usando un patrón sobre el uniquename — así no hace falta mantener
   una lista aparte a mano por cada arma nueva que se agregue. El orden
   importa: se evalúa de arriba a abajo y gana el primer patrón que matchee
   (ej. las ballestas se chequean antes que los arcos porque "CROSSBOW"
   contiene "BOW"). */
/* Familias de armas — agrupadas EXACTAMENTE como Albion las separa en sus
   propias 17 categorías de arma principal (Guerrero: Espada/Hacha/Maza/
   Martillo/Lanza/Guantes de Guerra/Ballesta · Cazador: Arco/Bastón de
   Combate/Báculo Cambiaformas/Daga/Báculo de Naturaleza · Mago: Báculo de
   Fuego/Escarcha/Arcano/Sagrado/Amaldecido), no por una lectura suelta del
   nombre interno de cada ítem. Esto corrige varios casos donde el ítem
   interno de Albion NO coincide con lo que el nombre en español sugeriría:
   Alabarda y Guadañas de un filo (Infernal Scythe / Crystal Reaper) son
   oficialmente HACHAS, no lanzas ni su propia familia; la Guadaña Gemela
   (Soulscythe) y el Báculo de Doble Filo son oficialmente BASTÓN DE
   COMBATE (Quarterstaff); Cantoclaro (Evensong) y Canción del Alba
   (Dawnsong) son Báculo Arcano/de Fuego, no "Puños" (su ítem interno
   contiene "RINGPAIR" pero no son guantes); Espadas Duales es ESPADA, no
   daga; y Desangradora (Bloodletter) es oficialmente DAGA, no un "Estoque"
   aparte (Albion no tiene una categoría de arma separada para estoques).
   El ORDEN importa: `weaponFamilyOf` devuelve la primera familia cuyo
   patrón matchea, así que las familias cuyo texto interno es "más
   específico" (Ballestas antes que Arcos, porque todo CROSSBOW contiene
   también "BOW"; Bastón de Combate antes que Hachas, porque Guadaña
   Gemela es TWINSCYTHE y contiene "SCYTHE") van primero. */

}

/* Catálogo completo de armas de la herramienta: junta las de los 7 roles de
   Composición + las extra de arriba, sin duplicados. Es lo que se muestra
   al editar el arma de cualquier jugador — tanto en Solitario como en
   cualquier build de Composición/Avalón — ya que ahí no hay restricción
   por rol, se ofrecen todas, agrupadas por familia.
   El identificador de cada arma para deduplicar/buscar es SIEMPRE
   `w.name` (nunca `w.u`): varias entradas comparten el mismo ítem interno
   de Albion (`u`) pero representan variantes de build con nombre propio y
   armadura por defecto distinta — por ejemplo "Báculo de Fuego" y "Báculo
   de Fuego (Flamígero) (Azul/Dorado)" son, para el juego, el mismo ítem
   (MAIN_FIRESTAFF), pero acá son dos opciones separadas a propósito. Si se
   dedupicara por `u` se perdería una de las dos (eso es lo que pasaba con
   el Flamígero antes de este arreglo) y además, al haber dos armas con la
   misma `u`, buscar "la elegida" por `u` sería ambiguo — por eso todo el
   resto del código (el selector de arma, el ícono del muñeco, Solitario)
   también busca y compara por `name`, no por `u`. */
function buildMasterWeaponCatalog() {
  const seen = new Set();
  const list = [];
  ROLE_KEYS.forEach(rk => {
    ROLES[rk].weapons.forEach(w => {
      if (seen.has(w.name)) return;
      seen.add(w.name);
      list.push(w);
    });
  });
  SOLO_EXTRA_WEAPONS.forEach(w => {
    if (seen.has(w.name)) return;
    seen.add(w.name);
    list.push(w);
  });
  return list;
}
const MASTER_WEAPONS = buildMasterWeaponCatalog();

function weaponPickerGroups() {
  const byLabel = {};
  MASTER_WEAPONS.forEach(w => {
    const fam = weaponFamilyOf(w.u);
    if (!byLabel[fam.label]) byLabel[fam.label] = {};
    byLabel[fam.label][w.name] = [w.name, w.u];
  });
  const orderedLabels = [...WEAPON_FAMILIES.map(f => f.label), WEAPON_FAMILY_MOUNT.label, WEAPON_FAMILY_OTHER.label];
  const seenLabels = new Set();
  const groups = [];
  orderedLabels.forEach(label => {
    if (seenLabels.has(label)) return;
    seenLabels.add(label);
    if (byLabel[label]) groups.push({ label, entries: byLabel[label] });
  });
  return groups;
}

/* Devuelve el índice del arma dentro de un rol dado su nombre exacto (para plantillas) */
function widx(role, name) {
  const i = ROLES[role].weapons.findIndex(w => w.name === name);
  return i >= 0 ? i : 0;
}

/* ---------------- Plantillas por modalidad ----------------
   Cada plantilla define, en orden, el rol (y opcionalmente el arma exacta)
   de cada slot sugerido. El usuario puede agregar/quitar/cambiar libremente.
------------------------------------------------------------- */
function tpl(role, name, count) {
  const arr = [];
  for (let i = 0; i < count; i++) arr.push({ role, weaponIdx: name ? widx(role, name) : 0 });
  return arr;
}
function flat(...groups) { return [].concat(...groups); }

/* Pieza efectiva a mostrar/usar para un slot: si el jugador editó esa pieza
   a mano (slot.gear[type]) se usa esa; si no, se usa la de la build por
   defecto. 'NONE' es un override explícito para "sin off-hand". */
function effectivePiece(slot, weapon, type) {
  const override = slot.gear && slot.gear[type];
  if (override === 'NONE') return null;
  if (override) {
    const dict = type === 'helm' ? HELM : type === 'chest' ? CHEST : type === 'boots' ? BOOTS : type === 'cape' ? CAPE : type === 'food' ? FOOD : type === 'potion' ? POTIONS : OFF;
    return dict[override] || weapon[type];
  }
  // La poción es la única pieza con un valor por defecto "de la herramienta"
  // en vez de "de la build" — ninguna build trae una poción propia asignada
  // (ver comentario junto a DEFAULT_POTION), así que sin override se usa
  // siempre ese default, salvo que el jugador la haya sacado a mano.
  if (type === 'potion') return weapon.potion || DEFAULT_POTION;
  return weapon[type];
}

/* ---------------- Balance de jugadores ---------------- */
let balUidCounter = 1;
function balUid() { return 'bal_' + (balUidCounter++) + '_' + Math.random().toString(36).slice(2, 7); }

function fmtMoney(n) {
  const sign = n < 0 ? '-' : '';
  return sign + '$' + Math.abs(Math.round(n)).toLocaleString('es-ES');
}

function findBalancePlayer(id) {
  return state.balances.find(p => p.id === id);
}

function addBalancePlayer(name) {
  const clean = (name || '').trim();
  if (!clean) return null;
  const existing = state.balances.find(p => p.name.toLowerCase() === clean.toLowerCase());
  if (existing) return existing;
  const p = { id: balUid(), name: clean, balance: 0, history: [] };
  state.balances.push(p);
  return p;
}

function addBalanceMovement(playerId, delta, note) {
  const p = findBalancePlayer(playerId);
  if (!p || !delta) return;
  p.balance += delta;
  p.history.unshift({ id: balUid(), delta, note: (note || '').trim(), ts: Date.now() });
}

function removeBalancePlayer(playerId) {
  state.balances = state.balances.filter(p => p.id !== playerId);
}

/* Devuelve el customBuild de tipo 'group' abierto actualmente en el editor
   de roster (state.openBuildId), o null si no hay ninguno abierto — en ese
   caso el panel de Builds muestra la biblioteca ("Mis builds") en vez del
   editor. */
function currentOpenBuild() {
  if (!state.openBuildId) return null;
  const cb = state.customBuilds.find(b => b.id === state.openBuildId);
  return (cb && buildTypeOf(cb) === 'group') ? cb : null;
}
function currentRoster() {
  const build = currentOpenBuild();
  return build ? build.roster : [];
}
function setCurrentRoster(newRoster) {
  const build = currentOpenBuild();
  if (build) build.roster = newRoster;
}

   del gremio, individuales o grupales, de cualquier tamaño — reemplaza a lo
   que antes eran Composición/Solitario/Avalón por separado), "Balance" y
   "Respaldos" (solo admin) — sin sub-pestañas: cada sección es una sola
   pantalla. */
const SECTIONS = {
  builds: { label: 'Builds', icon: '📚' },
  balance: { label: 'Balance', icon: '💰' },
  /* Solo aparece en el menú (ver renderModeBar) cuando hay sesión iniciada
     como "admin" — el resto del gremio ni la ve. */
  backups: { label: 'Respaldos', icon: '🗄️' },
};
function currentSection() {
  if (state.mode === 'balance') return 'balance';
  if (state.mode === 'backups') return 'backups';
  return 'builds';
}

function renderModeBar() {
  const bar = document.getElementById('modeBar');
  bar.innerHTML = '';

  const menu = document.createElement('div');
  menu.className = 'mode-menu';
  for (const key of Object.keys(SECTIONS)) {
    if (key === 'backups' && !isAdminUser()) continue;
    const s = SECTIONS[key];
    const item = document.createElement('button');
    item.type = 'button';
    item.className = 'mode-item' + (currentSection() === key ? ' active' : '');
    item.innerHTML = `<span>${s.icon}</span><span>${s.label}</span>`;
    item.onclick = () => {
      if (currentSection() === key) return;
      state.mode = key;
      renderAll();
    };
    menu.appendChild(item);
  }
  bar.appendChild(menu);

  const desc = document.createElement('div');
  desc.className = 'mode-desc';
  desc.textContent = MODES[state.mode].desc;
  bar.appendChild(desc);
}

/* ---------------- Plantillas rápidas dentro del editor de una build grupal ---
   Reemplaza a la vieja "Doctrina ZVZ" (que solo aplicaba a la modalidad
   ZVZ): ahora cualquier build grupal, sin importar su tamaño, puede arrancar
   desde cualquiera de estas plantillas — siguen viviendo en TEMPLATES, la
   misma data de siempre, así que el equipo sugerido por rol no cambió. */
const QUICK_TEMPLATES = [
  { key: 'zvz_kite', label: 'ZVZ · Kite', icon: '🏃', get: () => TEMPLATES.zvz.kite },
  { key: 'zvz_brawl', label: 'ZVZ · Brawl', icon: '🥊', get: () => TEMPLATES.zvz.brawl },
  { key: 'zvz_estandar', label: 'ZVZ · Estándar', icon: '⚔️', get: () => TEMPLATES.zvz.estandar },
  { key: 'grupal', label: 'Grupales', icon: '🛡️', get: () => TEMPLATES.grupal },
  { key: 'estatica', label: 'Estática', icon: '⭐', get: () => TEMPLATES.estatica },
  { key: 'avalon_azul', label: 'Avalón Azul', icon: '🔵', get: () => TEMPLATES.avalon_azul },
  { key: 'avalon_dorado', label: 'Avalón Dorado', icon: '🟡', get: () => TEMPLATES.avalon_dorado },
];

function buildTemplateBar(build) {
  const wrap = document.createElement('div');
  wrap.className = 'group-bar';
  const label = document.createElement('div');
  label.style.cssText = 'font-size:12px;color:var(--grey);align-self:center;margin-right:4px;';
  label.textContent = 'Empezar desde:';
  wrap.appendChild(label);

  QUICK_TEMPLATES.forEach(t => {
    const tab = document.createElement('div');
    tab.className = 'group-tab' + (isEditor() ? '' : ' locked');
    tab.title = isEditor() ? `Reemplaza el roster actual con la plantilla "${t.label}"` : '🔒 Iniciá sesión para usar plantillas';
    tab.innerHTML = `${t.icon} ${t.label}`;
    tab.onclick = () => {
      if (!requireEditor('usar una plantilla')) return;
      if (build.roster.length && !confirm(`¿Reemplazar el roster actual (${build.roster.length} jugadores) con la plantilla "${t.label}"? Se perderán los nombres y el equipo asignados en esta build.`)) return;
      build.roster = buildSlotsFromTemplate(t.get());
      renderPanel();
    };
    wrap.appendChild(tab);
  });

  const clearTab = document.createElement('div');
  clearTab.className = 'group-tab' + (isEditor() ? '' : ' locked');
  clearTab.title = isEditor() ? 'Vaciar el roster de esta build' : '🔒 Iniciá sesión para vaciar el roster';
  clearTab.innerHTML = '🗑 Vaciar';
  clearTab.onclick = () => {
    if (!requireEditor('vaciar el roster')) return;
    if (!build.roster.length) return;
    if (!confirm('¿Vaciar el roster de esta build? Se perderán todos los jugadores asignados.')) return;
    build.roster = [];
    renderPanel();
  };
  wrap.appendChild(clearTab);

  return wrap;
}

/* Agrega/quita un slot de jugador de la build grupal abierta. Se usan tanto
   desde la tarjeta "+ Agregar jugador" como desde los botones rápidos +/-
   del encabezado, para cubrir el caso de eventos donde no se completan
   todos los roles hasta el máximo establecido. */
function addPlayerSlot() {
  if (!requireEditor('agregar jugadores')) return;
  if (!currentOpenBuild()) return;
  const r = currentRoster();
  if (r.length >= GROUP_BUILD_MAX) { showToast(`Ya alcanzaste el máximo de ${GROUP_BUILD_MAX} jugadores`); return; }
  r.push({ id: uid(), role: 'dps_melee', weaponIdx: 0, player: '', gear: {} });
  setCurrentRoster(r);
  renderPanel();
}
function removeLastPlayerSlot() {
  if (!requireEditor('quitar jugadores')) return;
  const r = currentRoster();
  if (!r.length) { showToast('No hay jugadores para quitar'); return; }
  r.pop();
  setCurrentRoster(r);
  renderPanel();
}

/* ---------------- Render: panel principal ---------------- */
function renderPanel() {
  // Si quedó guardado state.mode === 'backups' de una sesión de admin
  // anterior pero ya no hay sesión de admin activa (se cerró sesión, o se
  // abrió el archivo/respaldo en otro dispositivo), no se puede quedar
  // mostrando esa pestaña — se manda a Builds como si nunca hubiese estado
  // ahí.
  if (state.mode === 'backups' && !isAdminUser()) state.mode = 'builds';

  // Cualquier redibujado real del panel — venga de donde venga (un blur de
  // input como el de abajo, el listener de focusout, una acción normal del
  // usuario, etc.) — ya deja la pantalla al día, así que cualquier
  // redibujado remoto pendiente queda satisfecho acá. Si esto se dejara
  // solo en el listener de focusout, un input con su propio handler de
  // blur (ver playerInput más abajo) que llama a renderPanel()
  // directamente reemplaza el DOM ANTES de que el focusout llegue a
  // burbujear hasta #panel, y la bandera quedaría prendida para siempre.
  pendingRemoteRenderNeeded = false;

  saveToStorage();
  const panel = document.getElementById('panel');
  panel.innerHTML = '';

  if (state.mode === 'balance') {
    panel.appendChild(buildBalancePanel());
    return;
  }

  if (state.mode === 'backups') {
    panel.appendChild(buildBackupsPanel());
    return;
  }

  // Acá state.mode es siempre 'builds': o hay una build grupal abierta para
  // editar su roster, o se muestra la biblioteca de "Mis builds".
  const openBuild = currentOpenBuild();
  if (openBuild) {
    panel.appendChild(buildGroupEditorPanel(openBuild));
  } else {
    panel.appendChild(buildBuildsLibraryPanel());
  }
}

function buildSummaryStrip(roster) {
  const wrap = document.createElement('div');
  wrap.className = 'summary-strip';

  const counts = {};
  roster.forEach(s => counts[s.role] = (counts[s.role] || 0) + 1);
  const filled = roster.filter(s => s.player.trim()).length;

  const stats = [[`Jugadores`, roster.length]];
  stats.push([`Nombres asignados`, `${filled}/${roster.length}`]);
  for (const key of ROLE_KEYS) {
    if (counts[key]) stats.push([ROLES[key].label, counts[key]]);
  }

  stats.forEach(([label, val]) => {
    const s = document.createElement('div');
    s.className = 'stat';
    s.innerHTML = `<b>${val}</b>${label}`;
    wrap.appendChild(s);
  });
  return wrap;
}

/* ---------------- Editor de roster de una build grupal ----------------
   Pantalla enfocada a la que se entra desde una tarjeta de "Mis builds"
   (ver buildGroupBuildCard) — muestra el resumen, la barra de plantillas
   rápidas, el encabezado con nombre editable y controles +/-, la grilla de
   jugadores y la leyenda de roles. En rosters de más de 9 jugadores se usa
   el layout compacto en fila (antes reservado solo a ZVZ) para que quepan
   cómodamente builds grandes tipo ZVZ de 20+. */
function buildGroupEditorPanel(build) {
  const wrap = document.createElement('div');

  const backRow = document.createElement('div');
  backRow.className = 'back-row';
  const backBtn = document.createElement('button');
  backBtn.type = 'button';
  backBtn.className = 'ghost small';
  backBtn.textContent = '← Volver a Mis builds';
  backBtn.onclick = () => { state.openBuildId = null; renderPanel(); };
  backRow.appendChild(backBtn);
  wrap.appendChild(backRow);

  wrap.appendChild(buildSummaryStrip(build.roster));
  wrap.appendChild(buildTemplateBar(build));

  const head = document.createElement('div');
  head.className = 'roster-head';
  const titleEl = document.createElement('h2');
  titleEl.textContent = build.name;
  titleEl.title = isEditor() ? 'Click para renombrar' : '🔒 Iniciá sesión para renombrar';
  titleEl.style.cursor = isEditor() ? 'pointer' : 'default';
  titleEl.onclick = () => {
    if (!requireEditor('renombrar builds')) return;
    const nn = prompt('Nombre para esta build:', build.name);
    if (nn === null) return;
    const clean = nn.trim();
    if (clean) { build.name = clean; renderPanel(); }
  };
  head.appendChild(titleEl);
  const countInfo = document.createElement('div');
  countInfo.style.cssText = 'font-size:13px;color:var(--grey);';
  countInfo.textContent = `${build.roster.length} jugador${build.roster.length === 1 ? '' : 'es'}`;
  head.appendChild(countInfo);

  const quickControls = document.createElement('div');
  quickControls.className = 'quick-controls';
  quickControls.innerHTML = `
    <button type="button" class="small ghost" id="quickRemove" title="Quitar el último jugador de la lista">− Quitar</button>
    <button type="button" class="small ghost" id="quickAdd" title="Agregar un jugador extra a la lista">+ Agregar</button>
  `;
  head.appendChild(quickControls);
  wrap.appendChild(head);
  head.querySelector('#quickAdd').onclick = addPlayerSlot;
  head.querySelector('#quickRemove').onclick = removeLastPlayerSlot;
  head.querySelector('#quickAdd').disabled = !isEditor();
  head.querySelector('#quickRemove').disabled = !isEditor();

  const compact = build.roster.length > 9;
  const grid = document.createElement('div');
  grid.className = 'grid' + (compact ? ' grid-row' : '');
  build.roster.forEach((slot, idx) => grid.appendChild(buildSlotCard(slot, idx, compact)));

  if (build.roster.length < GROUP_BUILD_MAX) {
    const addCard = document.createElement('button');
    addCard.className = 'add-slot-card';
    addCard.disabled = !isEditor();
    addCard.innerHTML = '+ Agregar jugador';
    addCard.onclick = addPlayerSlot;
    grid.appendChild(addCard);
  }
  wrap.appendChild(grid);

  wrap.appendChild(buildLegend());
  return wrap;
}

/* Colores de acento por rol — un tono claramente distinto por rol (ninguno se
   repite) para que cada tarjeta se identifique de un vistazo, manteniendo
   luminosidad media para que se lea bien tanto en tema oscuro como claro. */
const ROLE_ACCENT = {
  caller: '#d4a017',        // dorado — líder / IC
  tanque: '#3d7dca',        // azul acero — primera línea / escudo
  sanador: '#2e9e5b',       // verde esmeralda — sanación
  soporte: '#9b59b6',       // violeta — utilidad / CC
  dps_distancia: '#1fada0', // turquesa — daño a distancia
  dps_mago: '#c9327a',      // magenta — magia
  dps_melee: '#c81e3a',     // rojo carmesí — cuerpo a cuerpo
};

/* Recorta el nombre de un ítem a su forma en español para mostrar debajo del
   ícono: quita anotaciones en inglés entre paréntesis y etiquetas de tier
   (ej. '⭐S-Tier') que se agregan como referencia meta, pero conserva el
   nombre completo (con el inglés) en el atributo title/tooltip y en los
   selects, donde sí es útil para buscar builds de guías en inglés. */
function shortEsName(name) {
  if (!name) return name;
  return name.split(' (')[0].split('⭐')[0].trim();
}

/* Normaliza texto para comparar búsquedas sin distinguir mayúsculas ni
   tildes (ej. "flamigero" encuentra "Flamígero") — se usa tanto en el
   buscador del picker de equipo como en el de la Biblioteca de Builds. */
function normalizeSearch(s) {
  return (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

/* Una "casilla" del muñeco de equipo (paperdoll): ícono grande + etiqueta de
   tipo de slot + nombre del ítem en español debajo, imitando cómo Albion
   muestra el equipo puesto sobre el personaje. `piece` es [nombre, sufijo]
   o null si no aplica. Si se pasa `editable`, la casilla se puede clickear
   para cambiar esa pieza puntual del jugador (independiente de la build). */
function dollSlot(piece, fallbackEmoji, tag, extraClass, editable) {
  const el = document.createElement('div');
  el.className = 'doll-slot ' + extraClass + (piece ? ' filled' : ' empty') + (editable ? ' editable' : '');

  const iconBox = document.createElement('div');
  iconBox.className = 'doll-icon-box';
  iconBox.innerHTML = `<span class="fallback">${fallbackEmoji}</span>`;

  const label = document.createElement('div');
  label.className = 'doll-label';
  const tagEl = document.createElement('span');
  tagEl.className = 'doll-tag';
  tagEl.textContent = tag;
  const nameEl = document.createElement('span');
  nameEl.className = 'doll-name';
  nameEl.textContent = piece ? shortEsName(piece[0]) : '—';
  label.appendChild(tagEl);
  label.appendChild(nameEl);

  if (piece) {
    const [name, suffix] = piece;
    el.title = name;
    nameEl.title = name;
    const url = iconUrl(suffix);
    if (url) {
      const img = document.createElement('img');
      img.src = url;
      img.alt = name;
      img.onerror = () => { iconBox.innerHTML = `<span class="fallback">${fallbackEmoji}</span>`; };
      iconBox.innerHTML = '';
      iconBox.appendChild(img);
    }
  }
  if (editable) {
    const hint = document.createElement('span');
    hint.className = 'doll-edit-hint';
    hint.textContent = '✎';
    iconBox.appendChild(hint);
    el.title = (el.title ? el.title + ' — ' : '') + 'Click para cambiar';
    el.onclick = () => openGearPicker(editable.pieceLabel, editable.catalog, editable.currentKey, editable.allowNone, editable.onPick, editable.showReset !== false);
  }
  el.appendChild(iconBox);
  el.appendChild(label);
  return el;
}

/* Construye el muñeco de equipo completo (6 casillas en cruz, como la
   pantalla de personaje de Albion): arma arriba-izq/centro, casco arriba,
   capa arriba-der, off-hand der, pecho centro, botas abajo. Casco, capa,
   pecho, botas y off-hand se pueden editar pieza por pieza haciendo click
   sobre la casilla, sin importar la build elegida. */
function buildDoll(weapon, def, slot, weaponEditable) {
  if (weaponEditable === undefined) weaponEditable = true;
  const doll = document.createElement('div');
  doll.className = 'paperdoll';

  // Catálogo de armas para editar el arma principal tocando la casilla —
  // en tarjetas de roster se ofrece el catálogo COMPLETO de todas las armas
  // de la herramienta (agrupadas por familia), así cualquier jugador puede
  // llevar el arma que quiera y no solo las predeterminadas del rol (mismo
  // criterio que el <select> de abajo). La elección se guarda en
  // `slot.customWeapon` (objeto de arma completo, o null para volver al
  // arma por defecto de la build/plantilla, que sigue viviendo en
  // `slot.weaponIdx` sin tocarse). En tarjetas de build individual se pasa
  // directamente un objeto de configuración ya armado (weaponEditable como
  // objeto en vez de true/false — ver buildCustomBuildCard).
  let weaponEditableCfg;
  if (weaponEditable && typeof weaponEditable === 'object') {
    weaponEditableCfg = weaponEditable;
  } else if (weaponEditable && ROLES[slot.role]) {
    weaponEditableCfg = {
      pieceLabel: 'arma', catalog: WEAPON_PICKER_GROUPS, currentKey: weapon.name, allowNone: false, showReset: true,
      onPick: (key) => {
        if (key === null) {
          slot.customWeapon = null;
        } else {
          const found = MASTER_WEAPONS.find(w => w.name === key);
          if (found) slot.customWeapon = found;
        }
        slot.gear = {};
        renderPanel();
      },
    };
  }
  const weaponSlot = dollSlot(weapon.u ? [weapon.name, weapon.u] : null, def.icon, 'Arma', 'weapon-slot', weaponEditableCfg);
  if (!weapon.u) {
    weaponSlot.classList.remove('empty'); weaponSlot.classList.add('filled');
    weaponSlot.title = weapon.name + ' — Click para cambiar';
    const nm = weaponSlot.querySelector('.doll-name');
    if (nm) { nm.textContent = shortEsName(weapon.name); nm.title = weapon.name; }
  }
  const tierBadge = document.createElement('span');
  tierBadge.className = 'tier-badge';
  tierBadge.textContent = TIER;
  weaponSlot.querySelector('.doll-icon-box').appendChild(tierBadge);
  doll.appendChild(weaponSlot);

  const onPickFor = (type) => (key) => {
    slot.gear = slot.gear || {};
    if (key === null) delete slot.gear[type];
    else slot.gear[type] = key;
    renderPanel();
  };

  const helmPiece = effectivePiece(slot, weapon, 'helm');
  const capePiece = effectivePiece(slot, weapon, 'cape');
  const chestPiece = effectivePiece(slot, weapon, 'chest');
  const offPiece = effectivePiece(slot, weapon, 'off');
  const bootsPiece = effectivePiece(slot, weapon, 'boots');
  const foodPiece = effectivePiece(slot, weapon, 'food');
  const potionPiece = effectivePiece(slot, weapon, 'potion');

  doll.appendChild(dollSlot(foodPiece, foodPiece ? '🍖' : '—', 'Comida', 'food-slot' + (foodPiece ? '' : ' na'), {
    pieceLabel: 'comida', catalog: FOOD, currentKey: slot.gear && slot.gear.food, allowNone: true, onPick: onPickFor('food'),
  }));
  doll.appendChild(dollSlot(potionPiece, potionPiece ? '🧪' : '—', 'Poción', 'potion-slot' + (potionPiece ? '' : ' na'), {
    pieceLabel: 'poción', catalog: POTIONS, currentKey: slot.gear && slot.gear.potion, allowNone: true, onPick: onPickFor('potion'),
  }));
  doll.appendChild(dollSlot(helmPiece, '🪖', 'Casco', 'helm-slot', {
    pieceLabel: 'casco', catalog: HELM_GROUPED, currentKey: slot.gear && slot.gear.helm, allowNone: false, onPick: onPickFor('helm'),
  }));
  doll.appendChild(dollSlot(capePiece, '🧣', 'Capa', 'cape-slot', {
    pieceLabel: 'capa', catalog: CAPE, currentKey: slot.gear && slot.gear.cape, allowNone: false, onPick: onPickFor('cape'),
  }));
  doll.appendChild(dollSlot(chestPiece, '👕', 'Pecho', 'chest-slot', {
    pieceLabel: 'pieza de pecho', catalog: CHEST_GROUPED, currentKey: slot.gear && slot.gear.chest, allowNone: false, onPick: onPickFor('chest'),
  }));
  doll.appendChild(dollSlot(offPiece, offPiece ? '📯' : '—', 'Off-hand', 'off-slot' + (offPiece ? '' : ' na'), {
    pieceLabel: 'off-hand', catalog: OFF_GROUPED, currentKey: slot.gear && slot.gear.off, allowNone: true, onPick: onPickFor('off'),
  }));
  doll.appendChild(dollSlot(bootsPiece, '👢', 'Botas', 'boots-slot', {
    pieceLabel: 'botas', catalog: BOOTS_GROUPED, currentKey: slot.gear && slot.gear.boots, allowNone: false, onPick: onPickFor('boots'),
  }));
  return doll;
}

function buildSlotCard(slot, idx, compact) {
  const def = ROLES[slot.role];
  const weapon = slot.customWeapon || def.weapons[slot.weaponIdx] || def.weapons[0];
  const accent = ROLE_ACCENT[slot.role] || 'var(--red)';

  const card = document.createElement('div');
  card.className = 'slot-card';
  card.style.setProperty('--accent', accent);
  card.dataset.roleIcon = def.icon;

  const removeBtn = document.createElement('button');
  removeBtn.className = 'remove-slot';
  removeBtn.textContent = '✕';
  removeBtn.title = isEditor() ? 'Quitar jugador' : '🔒 Iniciá sesión para quitar jugadores';
  removeBtn.disabled = !isEditor();
  removeBtn.onclick = () => {
    if (!requireEditor('quitar jugadores')) return;
    const r = currentRoster();
    r.splice(idx, 1);
    setCurrentRoster(r);
    renderPanel();
  };
  card.appendChild(removeBtn);

  // Cinta de rol: identifica el rol de un vistazo y aporta el color distintivo
  const roleBadge = document.createElement('div');
  roleBadge.className = 'role-badge';
  roleBadge.innerHTML = `<span>${def.icon}</span><span>${def.label}</span>`;
  card.appendChild(roleBadge);

  // Muñeco de equipo — look "personaje equipado" con las 6 piezas
  card.appendChild(buildDoll(weapon, def, slot));

  const selects = document.createElement('div');
  selects.className = 'selects';

  const roleSelect = document.createElement('select');
  roleSelect.className = 'role-select';
  roleSelect.disabled = !isEditor();
  ROLE_KEYS.forEach(k => {
    const opt = document.createElement('option');
    opt.value = k;
    opt.textContent = `${ROLES[k].icon} ${ROLES[k].label}`;
    if (k === slot.role) opt.selected = true;
    roleSelect.appendChild(opt);
  });
  roleSelect.onchange = () => {
    if (!requireEditor('cambiar el rol')) { renderPanel(); return; }
    slot.role = roleSelect.value;
    slot.weaponIdx = 0;
    slot.customWeapon = null;
    slot.gear = {};
    renderPanel();
  };
  selects.appendChild(roleSelect);

  // Selector de arma — catálogo COMPLETO (todas las armas del juego,
  // agrupadas por familia con <optgroup>), no solo las del rol, para poder
  // armar cualquier build sin restricciones. La opción de arriba de todo
  // vuelve al arma por defecto de la plantilla (equivalente a "Usar la de
  // la build" del selector visual en el muñeco).
  // En layout compacto (rosters de más de 9 jugadores, ej. ZVZ) se omite: es
  // 100% redundante con clickear el ícono de arma del muñeco, que ya abre el
  // mismo catálogo completo — así se libera espacio en la fila.
  if (!compact) {
    const weaponSelect = document.createElement('select');
    weaponSelect.className = 'weapon-select';
    weaponSelect.disabled = !isEditor();
    const defaultWeapon = def.weapons[slot.weaponIdx] || def.weapons[0];
    const defaultOpt = document.createElement('option');
    defaultOpt.value = '';
    defaultOpt.textContent = shortEsName(defaultWeapon.name);
    weaponSelect.appendChild(defaultOpt);
    WEAPON_PICKER_GROUPS.forEach(group => {
      const optgroup = document.createElement('optgroup');
      optgroup.label = group.label;
      Object.keys(group.entries).forEach(key => {
        const [name] = group.entries[key];
        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = name;
        optgroup.appendChild(opt);
      });
      weaponSelect.appendChild(optgroup);
    });
    weaponSelect.value = slot.customWeapon ? weapon.name : '';
    weaponSelect.onchange = () => {
      if (!requireEditor('cambiar el arma')) { renderPanel(); return; }
      const key = weaponSelect.value;
      if (!key) {
        slot.customWeapon = null;
      } else {
        const found = MASTER_WEAPONS.find(w => w.name === key);
        if (found) slot.customWeapon = found;
      }
      slot.gear = {};
      renderPanel();
    };
    selects.appendChild(weaponSelect);
  }

  card.appendChild(selects);

  const playerInput = document.createElement('input');
  playerInput.className = 'player-input';
  playerInput.placeholder = 'Nombre del jugador...';
  playerInput.value = slot.player;
  playerInput.oninput = () => { slot.player = playerInput.value; };

/* ---------------- Modal de información/habilidades de un arma ----------
   Usa WEAPON_ABILITIES (datos oficiales, ver comentario junto a esa
   constante) para mostrar, al tocar el botón "ℹ️" de una tarjeta de la
   Biblioteca, qué habilidades tiene disponibles ese TIPO de arma. Ojo: en
   Albion cada jugador elige una habilidad activa por casilla (Q/W) y una
   pasiva entre varias opciones que se desbloquean con maestría — por eso
   se listan todas las opciones, no "las 3 que usa esta build puntual" (la
   Definitiva/R sí es siempre una sola, sin elección).
---------------------------------------------------------------------- */
const ATTACK_TYPE_ES = { magic: 'Mágico', melee: 'Cuerpo a cuerpo', ranged: 'A distancia' };

function weaponAbilitiesFor(u) {
  return (u && WEAPON_ABILITIES[u]) || null;
}

/* Ícono de una habilidad — mismo servicio oficial de renders de Albion que
   ya se usa para ítems, pero por el endpoint /v1/spell/ (en vez de /v1/item/)
   y usando el nombre único del hechizo (no el nombre visible). Investigado
   contra la documentación pública del servicio — igual que con los ítems,
   si el ícono puntual no carga se cae a un emoji genérico en vez de romper
   la tarjeta. */
function abilitySpellIconUrl(spellUnique) {
  if (!spellUnique) return null;
  return `https://render.albiononline.com/v1/spell/${spellUnique}.png?size=64&quality=1`;
}

function escapeHtmlAttr(s) {
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* Indicativo de cuál habilidad "conviene" tener seleccionada: no es un
   ranking de poder (eso sí sería un juicio de meta que no puedo verificar
   arma por arma sin caer en lo mismo que ya declinamos con Battle Hub) sino
   un dato objetivo sacado de los archivos del juego — cuánta maestría de
   combate hace falta invertir en esa arma para desbloquear cada opción.
   "Base" = viene desde el arma T4 sin invertir nada extra; "Maestría T3+"
   = hace falta subir maestría hasta ese nivel para poder elegirla. Sirve
   como guía real de progresión sin inventar un "pick recomendado". */
function abilityTierBadge(tier) {
  if (tier == null) return '';
  if (tier <= 1) return '<span class="ability-tier base">Base</span>';
  return `<span class="ability-tier">Maestría T${tier}+</span>`;
}

/* Elección de habilidad por casilla — guardada en ESTE dispositivo (localStorage).
   Esto es lo que reemplaza a "listar las 2-3 opciones como si estuvieran todas
   equipadas a la vez": en Albion elegís UNA por casilla (Q/W/Pasiva) entre las
   que se desbloquean con maestría de combate, así que acá dejamos que cada
   jugador marque la suya (queda resaltada con ✓) en vez de la herramienta
   imponer "la correcta" — eso sería copiar el pick puntual de un build de
   Battle Hub u otro sitio, algo que no vamos a reproducir (ver nota en el
   modal). El estado es 100% local: no se comparte ni se sube a ningún lado. */
const ABILITY_PICK_KEY = 'pvpx_ability_picks';
function loadAbilityPicks() {
  try {
    const raw = localStorage.getItem(ABILITY_PICK_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (err) { return {}; }
}
function saveAbilityPick(weaponU, slotKey, pickId) {
  try {
    const picks = loadAbilityPicks();
    picks[weaponU] = picks[weaponU] || {};
    picks[weaponU][slotKey] = pickId;
    localStorage.setItem(ABILITY_PICK_KEY, JSON.stringify(picks));
  } catch (err) { /* localStorage no disponible (modo privado, cuota llena, etc.) */ }
}
function selectAbility(weaponU, slotKey, pickId, el) {
  if (!requireEditor('elegir habilidades')) return;
  saveAbilityPick(weaponU, slotKey, pickId);
  const list = el.closest('.ability-list');
  if (list) list.querySelectorAll('.ability-item').forEach(li => li.classList.remove('chosen'));
  el.classList.add('chosen');
}

function abilityListHtml(list, weaponU, slotKey) {
  if (!list || !list.length) return '<p class="guide-role-armor">— sin datos —</p>';
  const picks = loadAbilityPicks();
  const savedPick = picks[weaponU] && picks[weaponU][slotKey];
  const selectable = list.length > 1;
  const items = list.map((entry, idx) => {
    const name = typeof entry === 'string' ? entry : entry.n;
    const spellU = typeof entry === 'string' ? null : entry.u;
    const tier = typeof entry === 'string' ? null : entry.t;
    const pickId = spellU || ('idx' + idx);
    const iconUrlStr = abilitySpellIconUrl(spellU);
    const iconHtml = iconUrlStr
      ? `<span class="ability-icon"><span class="fallback">✨</span><img src="${escapeHtmlAttr(iconUrlStr)}" alt="${escapeHtmlAttr(name)}" loading="lazy" onload="this.previousElementSibling.style.display='none'" onerror="this.remove()"></span>`
      : `<span class="ability-icon"><span class="fallback">✨</span></span>`;
    const isChosen = selectable && savedPick === pickId;
    const cls = 'ability-item' + (selectable ? ' selectable' : '') + (isChosen ? ' chosen' : '');
    const radioHtml = selectable ? `<span class="ability-radio">✓</span>` : '';
    const clickAttr = selectable
      ? ` onclick="selectAbility('${escapeHtmlAttr(weaponU)}','${escapeHtmlAttr(slotKey)}','${escapeHtmlAttr(pickId)}', this)"`
      : '';
    return `<li class="${cls}"${clickAttr}>${radioHtml}${iconHtml}<span class="ability-name">${name}</span>${abilityTierBadge(tier)}</li>`;
  }).join('');
  const hint = selectable ? '<p class="ability-hint">Tocá la que usa tu build para marcarla — es tu elección, se guarda solo en este dispositivo.</p>' : '';
  return hint + '<ul class="ability-list">' + items + '</ul>';
}

function openWeaponInfoModal(displayName, u) {
  const info = weaponAbilitiesFor(u);
  const family = weaponFamilyOf(u);
  let html = `<h4>⚔️ ${shortEsName(displayName)}</h4>`;
  if (!info) {
    html += `<p>Todavía no hay datos de habilidades cargados para esta arma.</p>`;
    openGuideModal('Información del arma', html);
    return;
  }
  const atkType = ATTACK_TYPE_ES[info.attacktype] || info.attacktype || '—';
  html += `<p><b>Familia:</b> ${family.label} &nbsp;·&nbsp; <b>Tipo de ataque:</b> ${atkType} &nbsp;·&nbsp; <b>Alcance:</b> ${info.attackrange || '—'} &nbsp;·&nbsp; <b>Cadencia de ataque:</b> ${info.attackspeed || '—'}/s</p>`;
  html += `<div class="guide-note">Fuente: datos oficiales del juego (no de sitios de terceros ni de imágenes de otras webs). En Q, W y la Pasiva elegís UNA opción entre varias que se desbloquean con maestría de combate — tocá la tuya en la lista para marcarla, queda guardada en este dispositivo. La etiqueta junto a cada una indica cuánta maestría hace falta para desbloquearla ("Base" = sin invertir nada extra). No es un ranking de "la mejor" ni el pick de ningún sitio en particular — depende de tu build y del contenido que juegues, así que la elección es tuya. Si el ícono de alguna habilidad no existe en el servicio oficial del juego, se muestra ✨ en su lugar. La Definitiva (R) siempre es la misma, sin elección.</div>`;
  html += `<h4>🅠 Habilidad activa — casilla 1 (Q)</h4>${abilityListHtml(info.q, u, 'q')}`;
  html += `<h4>🅦 Habilidad activa — casilla 2 (W)</h4>${abilityListHtml(info.w, u, 'w')}`;
  html += `<h4>🅡 Definitiva (R)</h4>${abilityListHtml(info.r, u, 'r')}`;
  html += `<h4>Pasiva</h4>${abilityListHtml(info.passive, u, 'passive')}`;
  openGuideModal('Información del arma', html);
}

/* ---------------- "Mis builds" — builds propias del gremio ----------------
   Esta sección la arma cada jugador a mano,
   de dos tipos posibles (cb.type):
     - 'solo'  → una build individual: arma + equipo elegido pieza por
                 pieza (antes vivía en la pestaña Solitario).
     - 'group' → una build grupal: un roster completo de jugadores, del
                 tamaño que sea (antes vivía repartida entre Composición y
                 Avalón, con un tamaño fijo por modalidad).
   Ambos tipos comparten nombre y etiquetas propias, conviven en la misma
   grilla y no tienen límite de cantidad. Se guardan en este navegador
   (autoguardado) y se sincronizan en vivo con el resto del gremio si hay
   una base de datos compartida configurada; para compartirlas a mano se
   usa Exportar/Importar (ver applyState: al importar, estas se SUMAN a las
   que ya haya en vez de reemplazarlas). */
function newCustomBuild(name) {
  return { id: uid(), name: name || 'Mi build', tags: [], type: 'solo', customWeapon: null, gear: {} };
}
function newGroupBuild(name) {
  return { id: uid(), name: name || 'Build grupal', tags: [], type: 'group', roster: [] };
}
/* Las builds guardadas antes de esta versión no tienen `type` (todas eran
   "individuales" en ese entonces) — se tratan como 'solo' por defecto. */
function buildTypeOf(cb) { return cb.type === 'group' ? 'group' : 'solo'; }

function parseTagsInput(str) {
  return (str || '')
    .split(',')
    .map(t => t.trim())
    .filter(Boolean)
    .filter((t, i, arr) => arr.findIndex(x => x.toLowerCase() === t.toLowerCase()) === i);
}

function allCustomBuildTags() {
  const set = new Set();
  state.customBuilds.forEach(cb => (cb.tags || []).forEach(t => set.add(t)));
  return [...set].sort((a, b) => a.localeCompare(b, 'es'));
}

let myBuildsFilter = { search: '', tag: 'all', type: 'all' };

/* Tarjeta de una build INDIVIDUAL (type:'solo') — arma + equipo editables
   pieza por pieza, con el mismo gráfico de estadísticas que antes tenían
   las builds de Solitario. */
function buildCustomBuildCard(cb) {
  const card = document.createElement('div');
